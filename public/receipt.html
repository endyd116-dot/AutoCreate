<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영수증 · AutoCreate</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=18">
<style>
  /* 영수증 = 종이 한 장. 화면에선 회색 바탕 위 흰 카드, 인쇄하면 여백만 남는다(§13.0 그룹 섹션 그대로) */
  body{background:var(--surface)}
  .rc{max-width:560px;margin:0 auto;padding:24px 20px 48px}
  .rc h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0 0 2px}
  .rc .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
  .rc .amt{font-size:30px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:2px 0 4px}
  .rc .sec{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.02em;margin:22px 0 6px}
  .rc .kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:14px;border-bottom:1px solid var(--line)}
  .rc .kv:last-child{border-bottom:0}
  .rc .kv .k{color:var(--muted);flex:none}
  .rc .kv .v{font-weight:600;text-align:right;font-variant-numeric:tabular-nums;word-break:keep-all}
  .rc .tot{font-weight:800;font-size:16px}
  .rc .note{color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:20px}
  .rc .bar{display:flex;gap:8px;margin:24px 0 0}
  .rc .bar button,.rc .bar a{flex:1;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
  .rc .pr{background:var(--brand);color:var(--on-brand)}
  .rc .sd{background:var(--ground);color:var(--ink)}
  .rc .soon{background:var(--ground);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--sub);line-height:1.55}
  @media print{
    @page{margin:14mm}
    body{background:#fff}
    .rc{max-width:none;padding:0}
    .rc .bar,.noprint{display:none!important}
    .rc .kv{border-bottom:1px solid #E8EBEE}
  }
</style>
</head>
<body>
<div class="rc" id="rc"><p class="sub">불러오는 중이에요…</p></div>
<script src="/js/ui.js?v=22"></script>
<script src="/js/mock.js?v=21"></script>
<script>
(async () => {
  const id = Number(UI.qs.get("id"));
  const host = UI.$("#rc");
  if (!id) { host.innerHTML = '<h1>영수증</h1><p class="sub">청구서를 찾을 수 없어요.</p>'; return; }
  const [r, me] = await Promise.all([UI.api("/api/invoice?id=" + id, { noRedirect: true }), UI.api("/api/auth-me", { noRedirect: true })]);
  if (!r.ok) { host.innerHTML = '<h1>영수증</h1><p class="sub">' + UI.esc(r.error || "청구서를 찾을 수 없어요.") + '</p>'; return; }
  const inv = r.invoice, sup = r.supplier;                    // 🔴 공급자 정보는 운영센터 «회사 정보» 한 출처 — 없으면 «준비 중»(금액·결제일은 그대로 보인다)
  const won = UI.won;
  const ST = { paid: "결제 완료", failed: "결제 실패", refunded: "환불됨", pending: "대기" };
  const period = String(inv.period || "");
  const title = inv.kind === "coin" ? "코인 충전" : "구독";
  const when = inv.paidAt || inv.createdAt;
  host.innerHTML = '<h1>영수증</h1><p class="sub">' + UI.esc(title) + ' · ' + UI.esc(period) + '</p>'
    + '<div class="amt">' + won(inv.totalKrw) + '</div>'
    + '<p class="sub">' + (when ? UI.dateKST(when, { year: "numeric" }) + ' ' + UI.timeKST(when) + ' (KST)' : "") + ' · ' + UI.esc(ST[inv.status] || inv.status) + '</p>'
    + '<div class="sec">받는 분</div>'
    + '<div class="kv"><span class="k">고객</span><span class="v">' + UI.esc((me.ok && me.tenant && me.tenant.name) || "") + '</span></div>'
    + '<div class="kv"><span class="k">청구서 번호</span><span class="v">' + inv.id + '</span></div>'
    + (inv.orderNo ? '<div class="kv"><span class="k">주문번호</span><span class="v">' + UI.esc(inv.orderNo) + '</span></div>' : "")
    + '<div class="sec">금액</div>'
    + '<div class="kv"><span class="k">공급가</span><span class="v">' + won(inv.amountKrw) + '</span></div>'
    + '<div class="kv"><span class="k">부가세 10%</span><span class="v">' + won(inv.vatKrw) + '</span></div>'
    + '<div class="kv"><span class="k">합계</span><span class="v tot">' + won(inv.totalKrw) + '</span></div>'
    + (inv.refundedKrw ? '<div class="kv"><span class="k">환불</span><span class="v">' + won(inv.refundedKrw) + '</span></div>' : "")
    + '<div class="sec">공급자</div>'
    + (sup
      ? '<div class="kv"><span class="k">상호</span><span class="v">' + UI.esc(sup.name || "") + '</span></div>'
        + (sup.ceo ? '<div class="kv"><span class="k">대표</span><span class="v">' + UI.esc(sup.ceo) + '</span></div>' : "")
        + (sup.bizNo ? '<div class="kv"><span class="k">사업자등록번호</span><span class="v">' + UI.esc(sup.bizNo) + '</span></div>' : "")
        + (sup.mailOrderNo ? '<div class="kv"><span class="k">통신판매업 신고</span><span class="v">' + UI.esc(sup.mailOrderNo) + '</span></div>' : "")
        + (sup.address ? '<div class="kv"><span class="k">주소</span><span class="v">' + UI.esc(sup.address) + '</span></div>' : "")
        + (sup.email || sup.phone ? '<div class="kv"><span class="k">연락처</span><span class="v">' + UI.esc([sup.phone, sup.email].filter(Boolean).join(" · ")) + '</span></div>' : "")
      : '<div class="soon">공급자 정보는 준비 중이에요. 금액과 결제일은 그대로 남아 있고, 정보가 들어오면 이 영수증에 바로 나와요. 세금계산서가 필요하면 요금제 화면에서 요청해 주세요.</div>')
    + '<p class="note">이 영수증은 실제 결제 내역을 그대로 보여 줘요. 세금계산서는 별도로 발행해 드려요(요금제 → 청구서 → 세금계산서 받기).</p>'
    + '<div class="bar noprint"><button type="button" class="sd" id="back">닫기</button><button type="button" class="pr" id="print">인쇄 · PDF</button></div>';
  const p = UI.$("#print"); if (p) p.onclick = () => window.print();
  const b = UI.$("#back"); if (b) b.onclick = () => { if (history.length > 1) history.back(); else location.href = "/app/plan.html"; };
})();
</script>
</body>
</html>
