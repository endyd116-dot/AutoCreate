<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고객 · AutoCreate 운영센터</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=23">
</head>
<body class="ops">
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ph"></span><span class="ttl">고객</span><span class="sp"></span></div>
<div class="field" style="padding-top:0"><input class="input" id="q" type="search" placeholder="이름·이메일·키로 찾기" autocomplete="off"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="seg" id="seg" style="margin:0"><button class="on" data-s="">전체</button><button data-s="trial">체험</button><button data-s="active">유료</button><button data-s="past_due">미납</button><button data-s="readonly">읽기전용</button></div><div class="seg" id="plan" style="margin:0"><button class="on" data-p="">플랜 전부</button><button data-p="starter">Starter</button><button data-p="pro">Pro</button><button data-p="agency">Agency</button></div></div>
<div class="group" id="list"><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=29"></script>
<script src="/js/ops.js?v=3"></script>
<script src="/js/mock-ops.js?v=2"></script>
<script>
(async () => {
const op = await OPS.boot("tenants"); if (!op) return;
let status = "", plan = "", withInternal = false;
async function load() {
  const q = UI.$("#q").value.trim();
  const r = await UI.api(`/api/ops-tenants?q=${encodeURIComponent(q)}&status=${status}&plan=${plan}&page=1${withInternal ? "&internal=1" : ""}`, { noRedirect: true }); if (!r.ok) { UI.toast(r.error || "불러오지 못했어요"); return; }
  const rows = r.tenants || [];
  /* 🔴 [2026-09-19 수리 · 시나리오 B ①] **서버가 «몇 집을 숨겼는지» 말해 주는데 화면이 그 말을 버리고 있었다.**
     그래서 손님이 전화해서 이름을 대도 화면엔 «0곳»만 떴다 — 운영자는 «가입 기록이 없는데요» 라고 말하게 된다.
     이제 숨긴 수를 **그대로 적고**, 한 번 눌러 **꺼낼 수 있게** 한다(`?internal=1`). 숨김은 «지움»이 아니라 «접어 둠»이다. */
  const hidden = (r.internal && r.internal.excluded) ? (r.internal.hidden || 0) : 0;
  const note = withInternal
    ? `<div class="kv"><span class="k muted" style="white-space:normal">내부 표시된 집도 함께 보고 있어요.</span><span class="v"><button class="btn secondary sm" type="button" id="intOff">다시 접기</button></span></div>`
    : hidden > 0
      ? `<div class="kv"><span class="k" style="white-space:normal">내부로 표시된 <b>${UI.num(hidden)}곳</b>은 빠져 있어요.<br><span class="muted" style="font-size:12px;font-weight:500">찾는 분이 안 보이면 여기서 함께 볼 수 있어요.</span></span><span class="v"><button class="btn secondary sm" type="button" id="intOn">함께 보기</button></span></div>`
      : "";
  UI.$("#list").innerHTML = `<div class="gt">${UI.num(r.total ?? rows.length)}곳${withInternal ? ' <span class="muted" style="font-weight:500">내부 포함</span>' : ""}</div>` + note + OPS.table([
    { h: "고객", f: (t) => `<span class="mk soft sm">${UI.esc((t.name || "?").slice(0, 1))}</span><b>${UI.esc(t.name)}</b> <span class="muted">${UI.esc(t.key)}</span>` },
    { h: "플랜", f: (t) => UI.esc(t.planKey) }, { h: "상태", f: (t) => OPS.pill(OPS.status(t.status)) },
    { h: "체험", f: (t) => (t.status === "trial" || t.status === "readonly") ? OPS.dleft(t.trialEndsAt) : "—" },
    { h: "코인", r: true, f: (t) => UI.num(t.coins || 0) }, { h: "계정", r: true, f: (t) => UI.num(t.accounts || 0) },
    { h: "마지막 발행", f: (t) => OPS.dt(t.lastPostAt) }, { h: "건강", r: true, f: (t) => t.health == null ? "—" : `<span class="dot ${t.health >= 80 ? "ok" : t.health >= 50 ? "warn" : "danger"}"></span> ${t.health}` },
  ], rows, (t) => `class="tap" data-id="${t.id}"`);
  UI.$$("#list tr.tap").forEach((tr) => tr.onclick = () => UI.go(`/ops/tenant.html?id=${tr.dataset.id}`));
  const on = UI.$("#intOn"); if (on) on.onclick = () => { withInternal = true; load(); };
  const off = UI.$("#intOff"); if (off) off.onclick = () => { withInternal = false; load(); };
}
UI.$("#q").addEventListener("input", () => { clearTimeout(window._t); window._t = setTimeout(load, 250); });
UI.$$("#seg button").forEach((b) => b.onclick = () => { UI.$$("#seg button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); status = b.dataset.s; load(); });
UI.$$("#plan button").forEach((b) => b.onclick = () => { UI.$$("#plan button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); plan = b.dataset.p; load(); });
load();
})();
</script>
</body>
</html>
