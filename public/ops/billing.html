<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>결제 · AutoCreate 운영센터</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=20">
</head>
<body class="ops">
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ph"></span><span class="ttl">결제</span><span class="sp"></span></div>
<div class="seg" id="seg" style="margin:0"><button class="on" data-s="">전체</button><button data-s="paid">결제됨</button><button data-s="failed">실패</button><button data-s="pending">대기</button><button data-s="refunded">환불</button></div>
<div class="group"><div class="gt">결제 라인 <span class="muted" style="font-weight:500">법인카드가 인증 창에서 거절될 때 쓰는 «카드번호 직접 입력»</span><span id="lock1"></span></div><div id="pay"></div></div>
<div class="group"><div class="gt">인보이스 <span class="muted" style="font-weight:500">공급가 · 부가세 · 청구 따로</span></div><div id="inv"></div></div>
<div class="ops-two">
<div class="group"><div class="gt">미수</div><div id="recv"></div></div>
<div class="group"><div class="gt">빌링키(카드)</div><div id="keys"></div></div>
</div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=25"></script>
<script src="/js/ops.js?v=2"></script>
<script src="/js/mock-ops.js?v=1"></script>
<script>
(async () => {
const op = await OPS.boot("billing"); if (!op) return;
let status = "", PAY = null;
const IST = { paid: ["ok", "결제됨"], failed: ["danger", "실패"], pending: ["off", "대기"], refunded: ["warn", "환불"] };
const canEdit = OPS.can(op, "admin"); // 결제 토글은 admin+ (§0.2 · operator 는 잠금 표시)
const routePill = (r) => r === "keyin" ? ' <span class="pill off">직접입력</span>' : ""; // 인증 라인은 기본이라 표시하지 않는다
const HTTPS = new RegExp("^https://", "i");
/* [P1R6 §1.2] 세금계산서 — 실발행은 홈택스에서 사람이 한다. 화면은 «요청됨»을 보여 주고, 발행한 뒤 «발행됨»으로 바꾼다(문서 주소는 선택 · https 만).
   🔴 상태는 서버가 준 taxInvoice.status(none·requested·issued) 만 본다 — 화면이 날짜로 추측하지 않는다. */
const taxCell = (x) => { const ti = x.taxInvoice || {};
  if (ti.status === "issued") return OPS.pill(["ok", "발행됨"]) + (ti.url ? ` <a class="lk" href="${UI.esc(ti.url)}" target="_blank" rel="noopener">문서</a>` : "") + `<div class="muted" style="font-size:12px">${OPS.dt(ti.issuedAt)}</div>`;
  if (ti.status === "requested") return OPS.pill(["warn", "요청됨"]) + `<div class="muted" style="font-size:12px">${OPS.dt(ti.requestedAt || x.taxRequestedAt)}</div>`;
  return '<span class="muted">—</span>'; };
function taxSheet(x) {
  const biz = x.taxBiz || {};
  UI.sheet(`<p class="muted" style="margin:0 0 10px;font-size:13.5px">홈택스에서 발행한 뒤 여기서 «발행됨»으로 바꿔 주세요. 고객 요금제 화면과 알림에 그대로 보여요.</p>
    <div class="kv"><span class="k">청구서</span><span class="v">${UI.esc(x.tenantName)} · ${UI.esc(x.period)} · ${UI.won(x.totalKrw)}</span></div>
    ${biz.bizNo || biz.bizName || biz.email
      ? `<div class="kv"><span class="k">요청 시점 사업자</span><span class="v" style="font-weight:500;max-width:70%;text-align:right">${UI.esc([biz.bizName, biz.bizNo, biz.email].filter(Boolean).join(" · "))}</span></div>`
      : '<p class="muted" style="margin:6px 0 0;font-size:12.5px">고객이 남긴 사업자 정보가 없어요 — 요청 없이 먼저 발행하는 경우예요.</p>'}
    <form id="tf"><div class="field"><label>문서 주소 <span class="muted" style="font-weight:500">· 선택 · https 로 시작</span></label><input class="input" name="url" placeholder="https://" maxlength="300"><div class="help"></div></div>
    <div class="cta" style="position:static;padding:4px 0 8px"><button class="btn primary" type="submit">발행됨으로 표시</button></div></form>`,
    { title: "세금계산서", onOpen: (sh, close) => UI.form(sh.querySelector("#tf"), async (d, f) => {
      const url = String(d.url || "").trim();
      if (url && !HTTPS.test(url)) return UI.fieldError(f, "url", "문서 주소는 https:// 로 시작해야 해요.");
      const r = await UI.api("/api/ops-tax-invoice", { body: { invoiceId: x.id, status: "issued", ...(url ? { url } : {}) }, noRedirect: true });
      if (!r.ok) return UI.fieldError(f, "url", r.error || "바꾸지 못했어요");
      close(); UI.toast("발행됨으로 표시했어요 · 고객에게 알림이 갔어요"); load(); }) });
}
/* [§1.6(5)] 결제 라인 토글 — 🔴 MID·시크릿 값은 응답에 없다(boolean 만) · 정책 × MID = effective 를 한 줄로 */
function renderPay(r) {
  PAY = r; const pol = r.payment || {}; const eff = pol.keyinEnabled && r.keyinMidConfigured;
  UI.$("#lock1").innerHTML = canEdit ? "" : OPS.lockPill("admin");
  UI.$("#pay").innerHTML = `<div class="fr"><div class="fl">카드번호 직접 입력 허용<small>고객 결제 화면에 체크박스 하나가 생겨요</small></div><button class="toggle" type="button" id="keyinTg" aria-checked="${pol.keyinEnabled ? "true" : "false"}" aria-label="카드번호 직접 입력 허용"></button></div>
    <div class="kv"><span class="k">지금 고객에게</span><span class="v">${eff ? '<span class="pill ok">보임</span>' : '<span class="pill off">안 보임</span>'}</span></div>
    ${!r.keyinMidConfigured ? '<p class="muted" style="margin:0 16px 8px;font-size:12.5px">비인증 가맹점 번호가 아직 등록되지 않았어요 — 토글을 켜도 고객에겐 안 보이고, 결제는 기존 방식으로 정상 진행돼요.</p>' : ""}
    ${r.kiccConfigured === false ? '<p class="muted" style="margin:0 16px 8px;font-size:12.5px">결제 준비 중이에요 — 가맹점 번호가 등록되면 바로 가동돼요.</p>' : ""}
    <div class="kv"><span class="k">라벨 · 안내문</span><span class="v" style="font-weight:500;max-width:70%;text-align:right">${UI.esc(pol.keyinLabel || "카드번호 직접 입력")}${pol.keyinNotice ? " · " + UI.esc(pol.keyinNotice) : ""}</span></div>
    <div class="cta" style="position:static;padding:4px 12px 10px"><button class="btn secondary sm" type="button" id="keyinEdit">문구 바꾸기</button></div>
    <p class="muted" style="margin:0 16px 10px;font-size:12.5px">모드 ${UI.esc(r.mode || "—")} · 고객이 골라도 정책·가맹점 번호가 맞지 않으면 기존 방식으로 조용히 결제돼요(실패가 아니에요).</p>`;
  const tg = UI.$("#keyinTg");
  UI.toggle(tg, async (on) => { if (!canEdit) { tg.setAttribute("aria-checked", String(!on)); return UI.toast("관리자만 바꿀 수 있어요"); }
    const rr = await UI.api("/api/ops-payment-settings", { body: { keyinEnabled: on }, noRedirect: true });
    if (!rr.ok) { tg.setAttribute("aria-checked", String(!on)); return UI.toast(rr.error || "바꾸지 못했어요"); }
    UI.toast(rr.effective ? "이제 고객 결제 화면에 보여요" : rr.keyinMidConfigured === false ? "켰지만 가맹점 번호가 없어 고객에겐 아직 안 보여요" : "껐어요"); renderPay({ ...r, ...rr }); });
  UI.$("#keyinEdit").onclick = () => { if (!canEdit) return UI.toast("관리자만 바꿀 수 있어요");
    UI.sheet(`<form id="kf"><div class="field"><label>체크박스 라벨</label><input class="input" name="keyinLabel" maxlength="40" value="${UI.esc(pol.keyinLabel || "카드번호 직접 입력")}"><div class="help"></div></div><div class="field"><label>안내문 <span class="muted" style="font-weight:500">· 비우면 안 보여요</span></label><textarea class="input" name="keyinNotice" rows="2" style="height:auto;padding:14px 16px" maxlength="300">${UI.esc(pol.keyinNotice || "")}</textarea></div><p class="muted" style="margin:0 0 4px;font-size:13px">고객 결제 시트의 체크박스 한 줄과 그 아래 설명이에요.</p><div class="cta"><button class="btn primary" type="submit">저장</button></div></form>`, { title: "문구 바꾸기", onOpen: (sh, close) => UI.form(sh.querySelector("#kf"), async (d, f) => {
      const rr = await UI.api("/api/ops-payment-settings", { body: { keyinLabel: d.keyinLabel, keyinNotice: d.keyinNotice }, noRedirect: true });
      if (!rr.ok) return UI.fieldError(f, "keyinLabel", rr.error || "저장하지 못했어요"); close(); UI.toast("바꿨어요"); renderPay({ ...r, ...rr }); }) }); };
  OPS.lock(op, "admin", UI.$("#pay"));
}
async function load() {
  const [i, k, rcv, pay] = await Promise.all([UI.api(`/api/ops-invoices?status=${status}`, { noRedirect: true }), UI.api("/api/ops-billing-keys", { noRedirect: true }), UI.api("/api/ops-receivables", { noRedirect: true }), UI.api("/api/ops-payment-settings", { noRedirect: true })]);
  if (pay.ok) renderPay(pay); else UI.$("#pay").innerHTML = `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">결제 라인 설정을 불러오지 못했어요</span></div></div>`;
  if (!i.ok) { UI.toast(i.error || "불러오지 못했어요"); return; }
  UI.$("#inv").innerHTML = OPS.table([
    { h: "고객", f: (x) => `<b>${UI.esc(x.tenantName)}</b>` }, { h: "종류", f: (x) => x.kind === "coin" ? `코인 <span class="muted">${UI.esc(x.period)}</span>` : `구독 <span class="muted">${UI.esc(x.period)}</span>` },
    { h: "공급가", r: true, f: (x) => UI.won(x.amountKrw) }, { h: "부가세", r: true, f: (x) => UI.won(x.vatKrw) }, { h: "청구", r: true, f: (x) => `<b>${UI.won(x.totalKrw)}</b>` },
    { h: "상태", f: (x) => OPS.pill(IST[x.status] || ["off", x.status]) + routePill(x.payRoute) + (x.status === "failed" ? ` <span class="muted">${x.attempts}회 · 다음 ${OPS.dt(x.nextRetryAt)}</span>` : "") },
    { h: "언제", f: (x) => OPS.dt(x.paidAt || x.failedAt) }, { h: "세금계산서", f: taxCell },
    { h: "", f: (x) => [x.status === "failed" ? `<button type="button" class="lk" data-retry="${x.id}">다시 시도</button>` : "", x.kind === "coin" && x.status === "paid" ? `<button type="button" class="lk" data-refund="${UI.esc(x.period)}">환불</button>` : "", x.status === "paid" && (x.taxInvoice || {}).status !== "issued" ? `<button type="button" class="lk" data-issued="${x.id}">발행됨으로 표시</button>` : "", x.status === "paid" && !(x.taxInvoice || {}).status ? `<button type="button" class="lk" data-tax="${x.id}">증빙 요청</button>` : "", x.receiptUrl ? `<a class="lk" href="${UI.esc(x.receiptUrl)}" target="_blank" rel="noopener">영수증</a>` : ""].filter(Boolean).join(" · ") },
  ], i.rows || []);
  UI.$("#recv").innerHTML = OPS.table([{ h: "고객", f: (x) => `<b>${UI.esc(x.tenantName)}</b>` }, { h: "미수", r: true, f: (x) => UI.won(x.overdueKrw) }, { h: "연체", r: true, f: (x) => `${x.overdueDays}일` }, { h: "시도", r: true, f: (x) => `${x.attempts}회` }, { h: "사유", f: (x) => UI.esc(x.lastFailReason || "") }], rcv.ok ? rcv.rows || [] : []);
  UI.$("#keys").innerHTML = OPS.table([{ h: "고객", f: (x) => `<b>${UI.esc(x.tenantName)}</b>` }, { h: "카드", f: (x) => `${UI.esc(x.brand)} ${UI.esc(x.last4)}${routePill(x.payRoute)}` }, { h: "상태", f: (x) => OPS.pill(x.active ? ["ok", "유효"] : ["warn", "실패"]) }, { h: "갱신", f: (x) => OPS.dt(x.updatedAt) }], k.ok ? k.rows || [] : []);
  UI.$$("[data-retry]").forEach((b) => b.onclick = async () => { const r = await UI.api("/api/ops-invoice-retry", { body: { id: Number(b.dataset.retry) }, noRedirect: true }); if (!r.ok) return UI.toast(r.error); UI.toast(r.invoice.status === "paid" ? "결제됐어요" : `다시 시도 예약 · ${r.invoice.attempts}회째`); load(); });
  UI.$$("[data-refund]").forEach((b) => b.onclick = () => UI.sheet(`<p class="muted" style="margin:0 0 8px">주문 <b style="font-family:ui-monospace,monospace">${UI.esc(b.dataset.refund)}</b></p><p class="muted" style="margin:0 0 12px;font-size:13px">규칙 5: 미사용분만 · 회수 ≤ 잔량 · 7일 · 단가 = 결제액 ÷ 받은 코인 · 부분 환불 없음</p><div id="rc"></div>`, { title: "코인 환불", onOpen: (sh, close) => UI.confirmRow(sh.querySelector("#rc"), "이 주문을 환불할까요? 미사용 코인은 회수돼요.", async () => { const r = await UI.api("/api/ops-refund", { body: { orderNo: b.dataset.refund }, noRedirect: true }); if (!r.ok) return UI.toast(r.error || "환불하지 못했어요"); close(); UI.toast(`${UI.won(r.refundKrw)} 환불 · ${r.revoked}코인 회수`); load(); }) }));
  UI.$$("[data-tax]").forEach((b) => b.onclick = async () => { const r = await UI.api("/api/ops-tax-invoice", { body: { invoiceId: Number(b.dataset.tax) }, noRedirect: true }); if (!r.ok) return UI.toast(r.error); UI.toast(r.note || "요청했어요"); load(); });
  UI.$$("[data-issued]").forEach((b) => b.onclick = () => { const x = (i.rows || []).find((r) => r.id === Number(b.dataset.issued)); if (x) taxSheet(x); });
}
UI.$$("#seg button").forEach((b) => b.onclick = () => { UI.$$("#seg button").forEach((x) => x.classList.remove("on")); b.classList.add("on"); status = b.dataset.s; load(); });
load();
})();
</script>
</body>
</html>
