<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>채널 · AutoCreate 운영센터</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=8">
</head>
<body class="ops">
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ph"></span><span class="ttl">채널</span><span class="sp"></span></div>
<div class="group"><div class="gt">레지스트리 <span class="muted" style="font-weight:500">상태를 바꾸면 고객 그리드·온보딩에 바로 반영</span></div><div id="list"></div></div>
<div class="group"><div class="gt">제휴 고지 문구(§16B) <button type="button" id="editD" style="color:var(--ink);font-weight:600;font-size:12.5px">고치기</button></div><p id="disc" style="margin:0 16px 4px;font-size:14px"></p><p id="discM" class="muted" style="margin:0 16px 12px;font-size:12.5px"></p></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=7"></script>
<script src="/js/ops.js?v=2"></script>
<script src="/js/mock-ops.js?v=1"></script>
<script>
(async () => {
const op = await OPS.boot("channels"); if (!op) return;
const CST = { active: ["ok", "가동"], planned: ["off", "준비 중"], down: ["danger", "장애"] };
let D;
async function load() {
  const [r, d] = await Promise.all([UI.api("/api/ops-channels", { noRedirect: true }), UI.api("/api/ops-disclosure", { noRedirect: true })]);
  if (!r.ok) { UI.toast(r.error || "불러오지 못했어요"); return; }
  UI.$("#list").innerHTML = OPS.table([
    { h: "채널", f: (c) => `${UI.mark(c.key, "sm")}<b>${UI.esc(c.label || UI.chLabel(c.key))}</b>` }, { h: "상태", f: (c) => OPS.pill(CST[c.status] || ["off", c.status]) },
    { h: "최적 시간(KST)", f: (c) => (c.bestHours || []).map((h) => String(h).padStart(2, "0") + "시").join(" · ") || "—" }, { h: "수익", f: (c) => (c.monetize || []).map((m) => UI.srcLabel(m)).join(" · ") || "—" },
    { h: "", f: (c) => `<button type="button" class="lk" data-k="${c.key}">바꾸기</button>` },
  ], r.channels || []);
  UI.$$("[data-k]").forEach((b) => b.onclick = () => sheet(r.channels.find((c) => c.key === b.dataset.k)));
  if (d.ok) { D = d; UI.$("#disc").textContent = d.text; UI.$("#discM").textContent = `${UI.esc(d.updatedBy || "")} · ${OPS.dt(d.updatedAt)} · 바꾸면 다음 발행부터 새 문구 · 변경은 감사에 남아요`; }
}
function sheet(c) {
  const H = [6, 7, 8, 9, 12, 13, 15, 18, 19, 20, 21, 23].map((h) => [h, h + "시"]);
  UI.sheet(`<div class="row" style="padding-left:0;padding-right:0">${UI.mark(c.key)}<div class="l"><span class="t">${UI.esc(c.label || UI.chLabel(c.key))}</span><span class="d">${UI.esc(c.key)}</span></div></div>
    <div class="sec">상태</div>${UI.seg("status", [["active", "가동"], ["planned", "준비 중"], ["down", "장애"]], c.status)}
    <p class="muted" id="hint" style="margin:8px 0 0;font-size:13px"></p>
    <div class="sec">최적 시간(KST)</div>${UI.chips("hours", H, c.bestHours || [], true)}
    <div class="cta"><button class="btn primary" type="button" id="ok">저장</button></div>`, { title: "채널 설정", onOpen: (sh, close) => {
      const hint = sh.querySelector("#hint"); const say = (v) => { hint.textContent = v === "down" ? "장애로 두면 고객 편성표의 이 채널 발행이 «PC 대기/확인 필요»로 멈춰요. 카나리 ✗ 뒤에 사람이 눌러요." : v === "planned" ? "준비 중이면 고객 그리드에서 숨고 온보딩엔 «곧 열려요» 칩이 붙어요." : "가동이면 고객이 바로 연결할 수 있어요."; }; say(c.status);
      UI.bindChips(sh, (n, v) => { if (n === "status") say(v); });
      sh.querySelector("#ok").onclick = async () => { const r = await UI.api("/api/ops-channels", { body: { key: c.key, status: UI.chipVal(sh, "status"), bestHours: UI.chipVal(sh, "hours").map(Number) }, noRedirect: true }); if (!r.ok) return UI.toast(r.error || "저장하지 못했어요"); close(); UI.toast("저장했어요 · 고객 화면에 바로 반영"); load(); };
    } });
}
UI.$("#editD").onclick = () => UI.sheet(`<form id="df"><div class="field"><label>고지 문구 <span class="muted" style="font-weight:500">· 공정위 «추천·보증 심사지침» · 첫 블록 고정</span></label><textarea class="input" name="text" rows="4" style="height:auto;padding:14px 16px" required>${UI.esc(D?.text || "")}</textarea><div class="help"></div></div><div id="dc"></div><div class="cta"><button class="btn primary" type="submit">바꾸기</button></div></form>`, { title: "고지 문구", onOpen: (sh, close) => UI.form(sh.querySelector("#df"), (d, f) => UI.confirmRow(sh.querySelector("#dc"), "다음 발행부터 모든 고객의 제휴 글 첫 줄이 이 문구로 바뀌어요. 바꿀까요?", async () => { const r = await UI.api("/api/ops-disclosure", { body: { text: d.text }, noRedirect: true }); if (!r.ok) return UI.fieldError(f, "text", r.error); close(); UI.toast("바꿨어요 · 감사 기록"); load(); })) });
load();
})();
</script>
</body>
</html>
