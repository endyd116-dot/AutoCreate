<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매출 · AutoCreate 운영센터</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=20">
</head>
<body class="ops">
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ph"></span><span class="ttl">매출</span><span class="sp"></span></div>
<div class="hl"><div class="say" id="say">이번 달</div><div class="num" id="rev">…</div><div class="tip" id="tip"></div></div>
<div class="group"><div class="gt">구독 · 코인</div><div class="bars" id="bars"></div><div class="kv"><span class="k">AI 원가(이달)</span><span class="v" id="ai">—</span></div><div class="kv"><span class="k">마진</span><span class="v" id="margin">—</span></div></div>
<div class="group"><div class="gt">고객</div><div class="stat4" id="stat"></div></div>
<div class="group"><div class="gt">발행 · 수익 회수</div><div class="bars" id="pub"></div><div class="kv"><span class="k">고객 수익 회수 총액(이달)</span><span class="v" id="crev">—</span></div><div class="kv"><span class="k">코인 판매 · 소비(이달)</span><span class="v" id="coins">—</span></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=25"></script>
<script src="/js/ops.js?v=2"></script>
<script src="/js/mock-ops.js?v=1"></script>
<script>
(async () => {
const op = await OPS.boot("dash"); if (!op) return;
const month = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Seoul" }).slice(0, 7);
const r = await UI.api(`/api/ops-dashboard?month=${month}`, { noRedirect: true }); if (!r.ok) { UI.toast(r.error || "불러오지 못했어요"); return; }
const rv = r.revenue || {};
UI.$("#say").textContent = `${Number(month.slice(5))}월에`; UI.$("#rev").innerHTML = `<span id="big">0원</span> 벌었어요`; UI.countUp(UI.$("#big"), rv.monthKrw || 0);
UI.$("#tip").textContent = `오늘 ${UI.won(rv.todayKrw || 0)} · MRR ${UI.won(r.mrr || 0)} · ARR ${UI.won(r.arr || 0)}`;
const max = Math.max(1, rv.subscriptionKrw || 0, rv.coinKrw || 0);
UI.$("#bars").innerHTML = [["구독", rv.subscriptionKrw || 0], ["코인", rv.coinKrw || 0]].map(([n, v], i) => `<div class="bar ${i === 0 ? "top" : ""}"><span class="n">${n}</span><span class="track"><span class="fill" style="width:${Math.round((v / max) * 100)}%"></span></span><span class="v">${UI.num(v)}</span></div>`).join("");
// 🔴 원가는 환율이 없으면 «원가 미환산» — 0 으로 그리지 않는다(계약 §0.1)
const ai = r.aiCost || {};
UI.$("#ai").innerHTML = ai.fxMissing ? `<span class="pill warn">원가 미환산</span> <span class="muted" style="font-weight:500">$${(ai.usd || 0).toFixed(2)} · 환율(FX_USD_KRW)을 넣어 주세요</span>` : `${UI.won(ai.krw || 0)} <span class="muted" style="font-weight:500">($${(ai.usd || 0).toFixed(2)})</span>`;
UI.$("#margin").innerHTML = r.marginKrw == null ? `<span class="muted" style="font-weight:500">원가가 환산돼야 계산해요</span>` : `<b class="${r.marginKrw >= 0 ? "up" : ""}" style="color:${r.marginKrw >= 0 ? "var(--money-ink)" : "var(--ink)"}">${UI.won(r.marginKrw)}</b>`;
const st = (k, v) => `<div class="st"><div class="k">${k}</div><div class="v">${v}</div></div>`;
UI.$("#stat").innerHTML = st("가입(오늘·이달)", `${r.signups?.today ?? 0} · ${r.signups?.month ?? 0}`) + st("체험→유료", `${r.trialToPaidPct ?? 0}%`) + st("활성", UI.num(r.activeTenants || 0)) + st("이탈(이달)", `${r.churn?.month ?? 0} · ${r.churn?.pct ?? 0}%`);
const bc = (r.published && r.published.byChannel) || []; const pm = Math.max(1, ...bc.map((x) => x.n));
UI.$("#pub").innerHTML = bc.length ? bc.map((x, i) => `<div class="bar ${i === 0 ? "top" : ""}"><span class="n">${UI.mark(x.channel, "sm")}${UI.esc(UI.chLabel(x.channel))}</span><span class="track"><span class="fill" style="width:${Math.round((x.n / pm) * 100)}%"></span></span><span class="v">${UI.num(x.n)}</span></div>`).join("") : `<p class="muted" style="margin:0 16px 8px;font-size:13px">이달 발행이 아직 없어요</p>`;
UI.$("#crev").textContent = UI.won(r.revenueCollectedKrw || 0); UI.$("#coins").textContent = `${UI.won(r.coins?.soldKrw || 0)} · ${UI.num(r.coins?.consumed || 0)}코인`;
})();
</script>
</body>
</html>
