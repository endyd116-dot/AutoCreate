<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>매출 · AutoCreate 운영센터</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=2">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ttl">매출</span><span class="sp"></span></div>
<div class="hl"><div class="say" id="say">이번 달</div><div class="num"><em id="rev">0원</em> 벌었어요</div><div class="tip" id="tip"></div></div>
<div class="group"><div class="gt">구독 · 코인</div>
  <div class="kv"><span class="k">구독 매출</span><span class="v" id="sub">—</span></div>
  <div class="kv"><span class="k">코인 매출</span><span class="v" id="coin">—</span></div>
  <div class="kv"><span class="k">MRR · ARR</span><span class="v" id="mrr">—</span></div>
  <div class="kv"><span class="k">AI 원가(이달)</span><span class="v" id="ai">—</span></div>
  <div class="kv"><span class="k">마진</span><span class="v" id="margin">—</span></div>
</div>
<div class="group"><div class="gt">고객</div>
  <div class="kv"><span class="k">전체 · 체험 · 유료</span><span class="v" id="tenants">—</span></div>
  <div class="kv"><span class="k">이달 신규 · 오늘</span><span class="v" id="new">—</span></div>
  <div class="kv"><span class="k">위험(미납·읽기전용)</span><span class="v" id="risk">—</span></div>
  <div class="kv"><span class="k">플랜별 유료</span><span class="v" id="byplan">—</span></div>
</div>
<div class="group"><div class="gt">운영</div>
  <div class="kv"><span class="k">이달 발행</span><span class="v" id="pub">—</span></div>
  <div class="kv"><span class="k">고객 수익 회수(이달)</span><span class="v" id="crev">—</span></div>
  <div class="kv"><span class="k">열린 CS 티켓</span><span class="v" id="tk">—</span></div>
  <div class="kv"><span class="k">코인 판매 · 소비(이달)</span><span class="v" id="coins">—</span></div>
</div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=2"></script>
<script src="/js/ops.js?v=1"></script>
<script>
(async () => {
const op = await OPS.boot("dash"); if (!op) return;
const r = await UI.api("/api/ops-dashboard", { noRedirect: true }); if (!r.ok) { UI.toast(r.error); return; }
const m = r.month, t = r.tenants;
UI.$("#say").textContent = `${new Date().getMonth() + 1}월에`; UI.countUp(UI.$("#rev"), m.revenue);
UI.$("#tip").textContent = `오늘 ${UI.won(m.today)}`;
UI.$("#sub").textContent = UI.won(m.subscription); UI.$("#coin").textContent = UI.won(m.coin);
UI.$("#mrr").textContent = `${UI.won(m.mrr)} · ${UI.won(m.arr)}`; UI.$("#ai").textContent = UI.won(m.aiCostKrw);
UI.$("#margin").innerHTML = `<span style="color:var(--money)">${UI.won(m.marginKrw)}</span>`;
UI.$("#tenants").textContent = `${t.total} · ${t.trial} · ${t.active}`; UI.$("#new").textContent = `${t.newMonth} · ${t.newToday}`; UI.$("#risk").textContent = t.atRisk;
UI.$("#byplan").textContent = t.byPlan.length ? t.byPlan.map((p) => `${p.planKey} ${p.count}`).join(" · ") : "—";
UI.$("#pub").textContent = UI.num(m.published) + "건"; UI.$("#crev").textContent = UI.won(m.customerRevenueKrw); UI.$("#tk").textContent = m.openTickets + "건";
UI.$("#coins").textContent = `${UI.num(m.coinsSold)} · ${UI.num(m.coinsConsumed)}`;
})();
</script>
</body>
</html>
