<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고객 상세 · AutoCreate 운영센터</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=7">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/ops/')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="ttl">고객 상세</span><span class="sp"></span></div>
<div class="hl"><div class="say" id="key"></div><div class="num" id="name" style="font-size:24px">…</div><div class="tip" id="meta"></div></div>
<div class="group"><div class="gt">셋업 체크리스트</div><div id="setup"></div></div>
<div class="group"><div class="gt">빠른 작업</div>
  <button class="row tap" type="button" id="imp"><span class="mk soft">→</span><div class="l"><span class="t">원격접속</span><span class="d">고객 화면 그대로 보고 설정을 도와줘요(감사 기록·결제 차단)</span></div></button>
  <button class="row tap" type="button" id="grant"><span class="mk money">C</span><div class="l"><span class="t">코인 지급 · 회수</span><span class="d" id="coins">잔액 —</span></div></button>
  <button class="row tap" type="button" id="plan"><span class="mk soft">₩</span><div class="l"><span class="t">플랜 · 상태 · 체험 연장</span><span class="d" id="planD"></span></div></button>
</div>
<div class="group"><div class="gt">계정</div><div id="accounts"></div></div>
<div class="group"><div class="gt">사용자 · 러너</div><div id="users"></div><div id="runners"></div></div>
<div class="group"><div class="gt">최근 기록</div><div id="audit"></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=6"></script>
<script src="/js/ops.js?v=1"></script>
<script>
(async () => {
const op = await OPS.boot("tenants"); if (!op) return;
const id = UI.qs.get("id"); let T;
async function load() {
  const r = await UI.api(`/api/ops-tenant?id=${id}`, { noRedirect: true }); if (!r.ok) { UI.toast(r.error); return; } T = r;
  const t = r.tenant, s = OPS.status(t.status);
  UI.$("#key").textContent = t.key; UI.$("#name").textContent = t.name;
  UI.$("#meta").innerHTML = `<span class="pill ${s[0]}">${s[1]}</span> ${t.plan_key} · 가입 ${OPS.dt(t.created_at)} · 체험 종료 ${OPS.dt(t.trial_ends_at)}`;
  const st = r.setup; const chk = (ok, l) => `<div class="kv"><span class="k">${l}</span><span class="v">${ok ? '<span class="pill ok">완료</span>' : '<span class="pill off">아직</span>'}</span></div>`;
  UI.$("#setup").innerHTML = chk(st.accountsConnected, "계정 연결") + chk(st.revenueSource, "수익 매체") + chk(st.rule, "편성 규칙") + chk(st.firstPublish, "첫 발행");
  UI.$("#coins").textContent = `잔액 ${UI.num(r.coins)}코인`; UI.$("#planD").textContent = `${t.plan_key} · ${t.status}`;
  UI.$("#accounts").innerHTML = r.accounts.length ? r.accounts.map((a) => `<div class="row">${UI.mark(a.channel)}<div class="l"><span class="t">@${UI.esc(a.handle)}</span><span class="d">건강 ${a.health_score} · 오늘 ${a.posts_today}/${a.daily_cap}</span></div><span class="pill ${a.status === "active" ? "ok" : a.status === "suspended" ? "danger" : "warn"}">${a.status}</span></div>`).join("") : `<div class="kv"><span class="k muted">연결된 계정 없음</span></div>`;
  UI.$("#users").innerHTML = r.users.map((u) => `<div class="kv"><span class="k">${UI.esc(u.email)} <span class="pill off">${u.role}</span></span><span class="v">${u.email_verified_at ? "인증" : "미인증"} · ${OPS.dt(u.last_login_at)}</span></div>`).join("");
  UI.$("#runners").innerHTML = r.runners.length ? r.runners.map((d) => `<div class="kv"><span class="k">러너 ${UI.esc(d.name)}</span><span class="v"><span class="pill ${d.status === "online" ? "ok" : "off"}">${d.status}</span> ${OPS.dt(d.last_seen_at)}</span></div>`).join("") : `<div class="kv"><span class="k muted">러너 없음</span></div>`;
  UI.$("#audit").innerHTML = r.audit.length ? r.audit.map((a) => `<div class="kv"><span class="k">${UI.esc(a.action)} <span class="muted">${a.actor_type}#${a.actor_id ?? ""}</span></span><span class="v muted" style="font-weight:500">${OPS.dt(a.created_at)}</span></div>`).join("") : `<div class="kv"><span class="k muted">기록 없음</span></div>`;
}
UI.$("#imp").onclick = async () => { const r = await UI.api("/api/ops-impersonate", { body: { id: Number(id) }, noRedirect: true }); if (!r.ok) { UI.toast(r.error); return; } location.href = r.redirect; };
UI.$("#grant").onclick = () => UI.sheet(`<form id="gf"><div class="field"><label>코인(음수 = 회수)</label><input class="input" name="coins" type="number" required value="10"></div><div class="field"><label>사유</label><input class="input" name="reason" required placeholder="예: 온보딩 지원"></div><div class="cta nobar" style="position:static;padding:12px 0 0"><button class="btn primary" type="submit">적용</button></div></form>`, { title: "코인 지급", onOpen: (sh, close) => UI.form(sh.querySelector("#gf"), async (d) => { const r = await UI.api("/api/ops-coins-grant", { body: { id: Number(id), coins: Number(d.coins), reason: d.reason }, noRedirect: true }); if (!r.ok) { UI.toast(r.error); return; } close(); UI.toast(`잔액 ${UI.num(r.balance)}코인`); load(); }) });
UI.$("#plan").onclick = () => UI.sheet(`<form id="pf"><div class="field"><label>플랜</label><select class="input" name="planKey"><option value="">그대로</option><option>trial</option><option>starter</option><option>pro</option><option>agency</option></select></div><div class="field"><label>상태</label><select class="input" name="status"><option value="">그대로</option><option>trial</option><option>active</option><option>past_due</option><option>readonly</option><option>closed</option></select></div><div class="field"><label>체험 종료일</label><input class="input" name="trialEndsAt" type="date"></div><div class="field"><label>메모</label><input class="input" name="note"></div><div class="cta nobar" style="position:static;padding:12px 0 0"><button class="btn primary" type="submit">저장</button></div></form>`, { title: "플랜 · 상태", onOpen: (sh, close) => UI.form(sh.querySelector("#pf"), async (d) => { const body = { id: Number(id) }; for (const k of ["planKey", "status", "trialEndsAt", "note"]) if (d[k]) body[k] = d[k]; const r = await UI.api("/api/ops-tenant-update", { body, noRedirect: true }); if (!r.ok) { UI.toast(r.error); return; } close(); UI.toast("저장했어요"); load(); }) });
load();
})();
</script>
</body>
</html>
