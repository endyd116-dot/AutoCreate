<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>비밀번호 · AutoCreate 운영센터</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=18">
</head>
<body class="ops">
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/ops/')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="ttl">비밀번호</span><span class="sp"></span></div>
<div class="step-h"><h1 id="h">비밀번호를 바꿔요</h1><p id="p">첫 로그인이라 기본 비밀번호는 더 쓸 수 없어요.</p></div>
<form id="f"><div class="field" id="curF"><label>현재 비밀번호</label><input class="input" name="current" type="password" autocomplete="current-password"><div class="help"></div></div>
<div class="field"><label>새 비밀번호</label><input class="input" name="password" type="password" autocomplete="new-password" required placeholder="8자 이상 · 영문+숫자"><div class="help"></div></div>
<div class="cta nobar"><button class="btn primary" type="submit">바꾸기</button></div></form>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=19"></script>
<script src="/js/ops.js?v=2"></script>
<script src="/js/mock-ops.js?v=1"></script>
<script>
(async () => {
const op = await OPS.boot("operators"); if (!op) return;
if (UI.qs.get("first")) UI.$("#curF").hidden = true;
const f = UI.$("#f"); UI.form(f, async (d) => { const r = await UI.api("/api/ops-change-password", { body: { current: d.current || undefined, password: d.password }, noRedirect: true }); if (!r.ok) { UI.fieldError(f, r.step === "current" ? "current" : "password", r.error); return; } UI.done("바꿨어요", () => { location.href = "/ops/"; }); });
})();
</script>
</body>
</html>
