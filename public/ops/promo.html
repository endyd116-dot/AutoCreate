<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이벤트 · AutoCreate 운영센터</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=22">
</head>
<body class="ops">
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ph"></span><span class="ttl">이벤트</span><span class="sp"></span></div>
<div class="group"><div class="gt">이벤트 <button type="button" id="addP" style="color:var(--ink);font-weight:600;font-size:12.5px">새 이벤트</button></div><div id="promos"></div></div>
<div class="group"><div class="gt">쿠폰 <button type="button" id="addC" style="color:var(--ink);font-weight:600;font-size:12.5px">새 쿠폰</button></div><div id="coupons"></div></div>
<div class="group"><div class="gt">쿠폰 사용 기록</div><div id="red"></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=27"></script>
<script src="/js/ops.js?v=3"></script>
<script src="/js/mock-ops.js?v=1"></script>
<script>
(async () => {
const op = await OPS.boot("promo"); if (!op) return;
const KIND = { trial_days: "체험 기간", bonus_coin: "보너스 코인", referral: "추천인 코인" };
const PST = { scheduled: ["off", "예약"], active: ["ok", "진행 중"], ended: ["off", "끝남"] };
const unit = (p) => p.unit === "days" ? `${p.value}일` : p.unit === "pct" ? `+${p.value}%` : `${p.value}코인`;
async function load() {
  const [p, c, r] = await Promise.all([UI.api("/api/ops-promotions", { noRedirect: true }), UI.api("/api/ops-coupons", { noRedirect: true }), UI.api("/api/ops-coupon-redemptions", { noRedirect: true })]);
  if (!p.ok) { UI.toast(p.error || "불러오지 못했어요"); return; }
  UI.$("#promos").innerHTML = OPS.table([
    { h: "이름", f: (x) => `<b>${UI.esc(x.name)}</b>` }, { h: "종류", f: (x) => KIND[x.kind] || x.kind }, { h: "값", f: (x) => unit(x) },
    { h: "기간", f: (x) => `${OPS.dateKST(x.startsAt)} ~ ${OPS.dateKST(x.endsAt)}` }, { h: "대상", f: (x) => (x.target?.plans || []).join(" · ") || "전체" },
    { h: "상태", f: (x) => OPS.pill(PST[x.status] || ["off", x.status]) }, { h: "사용 · 전환", r: true, f: (x) => `${UI.num(x.stats?.used || 0)} · ${UI.num(x.stats?.converted || 0)}` },
    { h: "", f: (x) => x.status !== "ended" ? `<button type="button" class="lk" data-edit="${x.id}">고치기</button> · <button type="button" class="lk" data-end="${x.id}">끝내기</button>` : "" },
  ], p.promotions || []);
  UI.$("#coupons").innerHTML = OPS.table([
    { h: "코드", f: (x) => `<b style="font-family:ui-monospace,monospace">${UI.esc(x.code)}</b>` }, { h: "할인", f: (x) => x.kind === "pct" ? `${x.value}%` : UI.won(x.value) },
    { h: "사용", r: true, f: (x) => `${UI.num(x.used)} / ${UI.num(x.maxUses)}` }, { h: "기간", f: (x) => `${OPS.dateKST(x.startsAt)} ~ ${OPS.dateKST(x.endsAt)}` },
    { h: "플랜", f: (x) => (x.plans || []).join(" · ") || "전체" }, { h: "상태", f: (x) => OPS.pill(PST[x.status] || ["off", x.status]) },
    { h: "", f: (x) => x.status !== "ended" ? `<button type="button" class="lk" data-cend="${x.id}">끝내기</button>` : "" },
  ], c.ok ? c.coupons || [] : []);
  UI.$("#red").innerHTML = OPS.table([{ h: "언제", f: (x) => OPS.dt(x.at) }, { h: "고객", f: (x) => UI.esc(x.tenantName) }, { h: "플랜", f: (x) => UI.esc(x.planKey) }, { h: "할인", r: true, f: (x) => UI.won(x.discountKrw) }], r.ok ? r.redemptions || [] : []);
  UI.$$("[data-edit]").forEach((b) => b.onclick = () => promoSheet((p.promotions || []).find((x) => x.id === Number(b.dataset.edit))));
  UI.$$("[data-end]").forEach((b) => b.onclick = async () => { const rr = await UI.api("/api/ops-promotions", { body: { action: "end", id: Number(b.dataset.end) }, noRedirect: true }); if (!rr.ok) return UI.toast(rr.error); UI.toast("끝냈어요"); load(); });
  UI.$$("[data-cend]").forEach((b) => b.onclick = async () => { const rr = await UI.api("/api/ops-coupons", { body: { action: "end", id: Number(b.dataset.cend) }, noRedirect: true }); if (!rr.ok) return UI.toast(rr.error); UI.toast("끝냈어요"); load(); });
}
const dayIn = (n) => new Date(Date.now() + n * 86400e3).toLocaleDateString("en-CA", { timeZone: "Asia/Seoul" });
function promoSheet(p) {
  const v = p || { kind: "trial_days", name: "", value: 30, startsAt: dayIn(0), endsAt: dayIn(30), target: { plans: [] } };
  UI.sheet(`<form id="pf"><div class="sec">종류</div>${UI.chips("kind", Object.entries(KIND), v.kind)}
    <div class="field"><label>이름</label><input class="input" name="name" required value="${UI.esc(v.name)}" placeholder="예: 가을 체험 30일"><div class="help"></div></div>
    <div class="field"><label>값 <span class="muted" style="font-weight:500">(체험=일 · 보너스=% · 추천=코인)</span></label><input class="input" name="value" type="number" required value="${v.value}"></div>
    <div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>시작(KST)</label><input class="input" name="startsAt" required value="${String(v.startsAt).slice(0, 10)}" placeholder="2026-09-15"></div><div class="field" style="flex:1"><label>끝(KST)</label><input class="input" name="endsAt" required value="${String(v.endsAt).slice(0, 10)}"></div></div>
    <div class="sec">대상 플랜 <span class="muted" style="font-weight:500">· 안 고르면 전체</span></div>${UI.chips("plans", [["trial", "체험"], ["starter", "Starter"], ["pro", "Pro"], ["agency", "Agency"]], v.target?.plans || [], true)}
    <div class="cta"><button class="btn primary" type="submit">${p ? "고치기" : "예약"}</button></div></form>`, { title: p ? "이벤트 고치기" : "새 이벤트", onOpen: (sh, close) => { UI.bindChips(sh); UI.form(sh.querySelector("#pf"), async (d, f) => {
      const kind = UI.chipVal(sh, "kind"); const promotion = { kind, name: d.name, value: Number(d.value), unit: kind === "trial_days" ? "days" : kind === "bonus_coin" ? "pct" : "coins", startsAt: d.startsAt + "T00:00:00+09:00", endsAt: d.endsAt + "T23:59:59+09:00", target: { plans: UI.chipVal(sh, "plans") } };
      const r = await UI.api("/api/ops-promotions", { body: { action: "save", id: p?.id, promotion }, noRedirect: true }); if (!r.ok) return UI.fieldError(f, "name", r.error); close(); UI.toast(p ? "고쳤어요" : "예약했어요"); load(); }); } });
}
UI.$("#addP").onclick = () => promoSheet(null);
UI.$("#addC").onclick = () => UI.sheet(`<form id="cf"><div class="field"><label>코드</label><input class="input" name="code" required placeholder="FALL30" style="text-transform:uppercase"><div class="help"></div></div>
  <div class="sec">할인</div>${UI.seg("kind", [["pct", "%"], ["krw", "원"]], "pct")}<div class="field"><label>값</label><input class="input" name="value" type="number" required value="30"></div>
  <div class="field"><label>최대 사용 횟수</label><input class="input" name="maxUses" type="number" required value="100"></div>
  <div style="display:flex;gap:8px"><div class="field" style="flex:1"><label>시작(KST)</label><input class="input" name="startsAt" required value="${dayIn(0)}"></div><div class="field" style="flex:1"><label>끝(KST)</label><input class="input" name="endsAt" required value="${dayIn(30)}"></div></div>
  <div class="sec">플랜</div>${UI.chips("plans", [["starter", "Starter"], ["pro", "Pro"], ["agency", "Agency"]], [], true)}
  <div class="cta"><button class="btn primary" type="submit">만들기</button></div></form>`, { title: "새 쿠폰", onOpen: (sh, close) => { UI.bindChips(sh); UI.form(sh.querySelector("#cf"), async (d, f) => {
    const coupon = { code: d.code.toUpperCase(), kind: UI.chipVal(sh, "kind"), value: Number(d.value), maxUses: Number(d.maxUses), startsAt: d.startsAt + "T00:00:00+09:00", endsAt: d.endsAt + "T23:59:59+09:00", plans: UI.chipVal(sh, "plans") };
    const r = await UI.api("/api/ops-coupons", { body: { action: "save", coupon }, noRedirect: true }); if (!r.ok) return UI.fieldError(f, "code", r.error); close(); UI.toast("만들었어요"); load(); }); } });
load();
})();
</script>
</body>
</html>
