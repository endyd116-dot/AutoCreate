<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>러너 팜 · AutoCreate 운영센터</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=18">
</head>
<body class="ops">
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ph"></span><span class="ttl">러너 팜</span><span class="sp"></span></div>
<div class="group"><div class="stat4" id="farm"></div></div>
<div class="group"><div class="gt">러너 <span class="muted" style="font-weight:500">관리형(팜) + 고객 PC</span><span id="lock1"></span></div><div id="list"></div></div>
<div class="group"><div class="gt">셀렉터 카나리 <span class="muted" style="font-weight:500">매일 05:00 KST 평가 · 러너가 «임시저장까지» 드라이런</span></div><div id="canary"></div><p class="muted" style="margin:0 16px 10px;font-size:12.5px">✗ 는 채널 상태를 down 으로 바꿀 «제안»이에요 — 자동 전환은 안 하고 채널 메뉴에서 사람이 눌러요. «—» 는 판정 불가(세션 없음).</p></div>
<!-- [P1R8 §3.3 · B2] 셀렉터 표 배포 — 🔴 «어느 판이 어디까지 퍼졌나»와 **«왜 아직 대기 중인가»**.
     대기 이유를 안 보여 주면 멈춰 있는 것과 도는 것을 구분할 수 없다(설계 §9). -->
<div class="group"><div class="gt">셀렉터 표 배포 <span class="muted" style="font-weight:500">넓히는 건 평일 10~18시(KST)만 · 되돌리는 건 언제나</span><span id="lock2"></span></div><div id="recipe"></div><p class="muted" id="recipeNote" style="margin:0 16px 10px;font-size:12.5px"></p></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=19"></script>
<script src="/js/ops.js?v=2"></script>
<script src="/js/mock-ops.js?v=1"></script>
<script>
(async () => {
const op = await OPS.boot("runners"); if (!op) return;
const canEdit = OPS.can(op, "super_admin"); // 변경은 최고 관리자만(메인 지시) — 버튼은 보이되 잠근다
const STEP = { login_fail: "로그인 실패", selector_changed: "화면이 바뀜", draft_saved: "임시저장까지 OK", timeout: "시간 초과", no_session: "세션 없음" };
async function load() {
  const [r, c] = await Promise.all([UI.api("/api/ops-runners", { noRedirect: true }), UI.api("/api/ops-canary?days=14", { noRedirect: true })]);
  if (!r.ok) { UI.toast(r.error || "불러오지 못했어요"); return; }
  const f = r.farm || {};
  UI.$("#farm").innerHTML = [["관리형 러너", UI.num(f.managed || 0)], ["지금 켜짐", UI.num(f.online || 0)], ["대기 잡", UI.num(f.queued || 0)], ["가장 오래 기다림", f.oldestQueuedMin == null ? "—" : `${UI.num(f.oldestQueuedMin)}분`]].map(([k, v]) => `<div class="st"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  UI.$("#lock1").innerHTML = canEdit ? "" : OPS.lockPill("super_admin");
  const managed = (x) => x.tenantId == null || x.kind === "managed";
  UI.$("#list").innerHTML = OPS.table([
    { h: "이름", f: (x) => `<b>${UI.esc(x.name || "#" + x.id)}</b> <span class="pill ${managed(x) ? "ink" : "off"}">${managed(x) ? "관리형" : "고객 PC"}</span>` },
    { h: "고객", f: (x) => x.tenantId != null ? `<a class="lk" href="/ops/tenant.html?id=${x.tenantId}">${UI.esc(x.tenantKey || "#" + x.tenantId)}</a>` : '<span class="muted">팜(미배정)</span>' },
    { h: "상태", f: (x) => OPS.pill(x.online ? ["ok", "켜짐"] : ["off", "꺼짐"]) },
    { h: "하는 중", r: true, f: (x) => UI.num(x.active || 0) }, { h: "대기", r: true, f: (x) => UI.num(x.queued || 0) },
    { h: "하트비트", f: (x) => x.lastSeenAt ? UI.ago(x.lastSeenAt) : "—" }, { h: "버전", f: (x) => UI.esc(x.version || "—") },
    { h: "", f: (x) => `${managed(x) ? `<button type="button" class="lk" data-rebind="${x.id}">배정</button> · ` : ""}<button type="button" class="lk" data-release="${x.id}" ${x.active ? "" : "disabled"}>잡 되돌리기</button> · <button type="button" class="lk" data-remove="${x.id}">제거</button>` },
  ], r.runners || []);
  OPS.lock(op, "super_admin", UI.$("#list"));
  const byId = (id) => (r.runners || []).find((x) => x.id === Number(id));
  UI.$$("[data-rebind]").forEach((b) => b.onclick = async () => { const x = byId(b.dataset.rebind); const t = await UI.api("/api/ops-tenants?limit=50", { noRedirect: true }); const opts = [["", "팜으로(미배정)"], ...((t.ok ? t.tenants || [] : []).map((z) => [String(z.id), `${z.name} · ${z.key}`]))];
    UI.sheet(`<p class="muted" style="margin:0 0 8px;font-size:13px">관리형 러너를 어느 고객에 붙일까요. 붙이면 그 고객의 네이버·티스토리 발행을 이 러너가 대신해요(Agency 원격 셋업 §9.0).</p>${UI.chips("t", opts, x.tenantId == null ? "" : String(x.tenantId))}<div class="cta"><button class="btn primary" type="button" id="ok">배정</button></div>`, { title: `${x.name} 배정`, onOpen: (sh, close) => { UI.bindChips(sh); sh.querySelector("#ok").onclick = async () => { const v = UI.chipVal(sh, "t"); const rr = await UI.api("/api/ops-runner-assign", { body: { action: "rebind", id: x.id, tenantId: v ? Number(v) : null }, noRedirect: true }); if (!rr.ok) return UI.toast(rr.error || "배정하지 못했어요"); close(); UI.toast(rr.tenantId == null ? "팜으로 돌렸어요" : "배정했어요"); load(); }; } }); });
  UI.$$("[data-release]").forEach((b) => b.onclick = () => { const x = byId(b.dataset.release); UI.sheet(`<div id="rc"></div>`, { title: "잡 되돌리기", onOpen: (sh, close) => UI.confirmRow(sh.querySelector("#rc"), `${x.name} 이(가) 물고 있는 잡 ${x.active}건을 큐로 되돌릴까요? 다른 러너가 이어받아요(수동 페일오버).`, async () => { const rr = await UI.api("/api/ops-runner-assign", { body: { action: "release", id: x.id }, noRedirect: true }); if (!rr.ok) return UI.toast(rr.error || "되돌리지 못했어요"); close(); UI.toast(`잡 ${rr.released}건을 큐로 돌렸어요`); load(); }) }); });
  UI.$$("[data-remove]").forEach((b) => b.onclick = () => { const x = byId(b.dataset.remove); UI.sheet(`<div id="rc"></div>`, { title: "러너 제거", onOpen: (sh, close) => UI.confirmRow(sh.querySelector("#rc"), `${x.name} 을(를) 지울까요? 물고 있던 잡은 먼저 큐로 돌아가요. 되돌릴 수 없어요.`, async () => { const rr = await UI.api("/api/ops-runner-assign", { body: { action: "remove", id: x.id }, noRedirect: true }); if (!rr.ok) return UI.toast(rr.error || "지우지 못했어요"); close(); UI.toast("지웠어요"); load(); }) }); });
  /* 카나리 매트릭스 — channels[{channel, today, history[{day,ok,step}]}] → 날짜 × 채널 · ok true/false/null(AC-9) */
  const chans = c.ok ? c.channels || [] : []; const days = [...new Set(chans.flatMap((x) => x.history.map((h) => h.day)))].sort().reverse();
  const cell = (x, d) => { const h = x.history.find((y) => y.day === d); if (!h) return '<span class="muted">—</span>'; const shot = x.today && x.today.ranAt && x.today.ranAt.slice(0, 10) === d && x.today.shotKey ? ` <a class="lk" href="#" data-shot="${UI.esc(x.today.shotKey)}" style="font-weight:500;color:var(--muted)">스냅샷</a>` : "";
    return h.ok === null ? `<span class="muted" title="판정 불가">—</span>${h.step ? ` <span class="muted">${UI.esc(STEP[h.step] || h.step)}</span>` : ""}` : h.ok ? `<span style="color:var(--money-ink);font-weight:800">✓</span>${shot}` : `<span style="color:var(--danger-ink);font-weight:800">✗</span> <span class="muted">${UI.esc(STEP[h.step] || h.step || "")}</span>${shot}`; };
  UI.$("#canary").innerHTML = days.length ? OPS.table([{ h: "날짜(KST)", f: (d) => d }, ...chans.map((x) => ({ h: UI.chLabel(x.channel), f: (d) => cell(x, d) }))], days) : `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">아직 카나리 결과가 없어요 · 러너가 «ac-runner --canary» 로 보내면 여기 쌓여요</span></div></div>`;
  UI.$$("[data-shot]").forEach((a) => a.onclick = (e) => { e.preventDefault(); UI.toast(`스냅샷 ${a.dataset.shot} · R2 저장소에서 열려요`); });

  /* [P1R8 §3.3] 셀렉터 표 배포 — 🔴 숫자·문구는 **전부 서버가 준다**(화면이 조건을 다시 짜면 서버와 갈린다 · AC-74). */
  const rc = await UI.api("/api/ops-recipe", { noRedirect: true });
  if (rc.ok) {
    const STAGE = { canary: "우리 드라이런", own: "우리 기기", volunteer: "먼저 받기 켠 집", all: "전체" };
    UI.$("#recipe").innerHTML = OPS.table([
      { h: "채널", f: (x) => UI.chLabel(x.channel) },
      { h: "지금 퍼진 판", f: (x) => x.current ? `<span class="mono">${UI.esc(x.current)}</span>` : '<span class="muted">묶여 온 표</span>' },
      { h: "시험 중", f: (x) => x.candidate ? `<span class="mono">${UI.esc(x.candidate)}</span> <span class="pill warn">${UI.esc(STAGE[x.stage] || x.stage || "")}</span>` : '<span class="muted">없음</span>' },
      { h: "카나리", f: (x) => x.candidate ? `${x.canary.good}✓ ${x.canary.bad}✗ ${x.canary.unknown}—` : "—" },
      /* 🔴 «왜 대기 중인가» — 이 칸이 이 표의 존재 이유다. */
      { h: "왜 대기 중", f: (x) => x.why ? `<span class="muted">${UI.esc(x.why)}</span>` : (x.candidate ? '<span class="pill ok">넓힐 수 있어요</span>' : "—") },
      { h: "발행 실패", f: (x) => x.harm.fails ? `<span class="pill warn">${x.harm.fails}건 · ${x.harm.tenants}집</span>` : "—" },
      { h: "", f: (x) => x.candidate ? `<button type="button" class="lk" data-rpro="${x.channel}">한 단계 넓히기</button> · <button type="button" class="lk" data-rrb="${x.channel}">되돌리기</button>` : "" },
    ], rc.channels || []);
    /* 🔴 «열쇠가 없다»를 고장처럼 말하지 않는다 — 그건 키 꽂기 전의 정상 상태다(발행은 그대로 된다). */
    UI.$("#recipeNote").innerHTML = (rc.signing
      ? "표를 올리면 우리 드라이런 → 우리 기기 → 먼저 받기 켠 집 → 전체 순서로 퍼져요."
      : "🔴 아직 서명 열쇠가 없어서 표를 내려 주지 않아요 — 러너는 묶여 온 셀렉터로 <b>그대로 잘 돕니다</b>(발행에 지장 없음).")
      + (rc.fellBack24h ? ` · 어제 하루 <b>${UI.num(rc.fellBack24h)}건</b>이 표를 못 믿고 묶여 온 것으로 되돌아갔어요.` : "");
    if (canEdit) {
      UI.$$("[data-rpro]").forEach((b) => b.onclick = async () => {
        const r = await UI.api("/api/ops-recipe", { body: { action: "promote", channel: b.dataset.rpro }, noRedirect: true });
        UI.toast(r.ok ? `«${STAGE[r.stage] || r.stage}» 까지 넓혔어요` : (r.error || "아직 넓힐 수 없어요")); if (r.ok) load();
      });
      /* 되돌리기는 되돌릴 수 없는 일이 아니지만(다시 올리면 된다) 남의 러너를 한꺼번에 바꾸는 일이라 한 번 묻는다.
         🔴 이 화면의 다른 롤백(AI 모델)과 **같은 방식**을 쓴다 — 낱말과 손놀림이 화면마다 다르면 그게 사고가 된다. */
      UI.$$("[data-rrb]").forEach((b) => b.onclick = () => UI.sheet(`<div id="rrc"></div>`, { title: "표 되돌리기", onOpen: (sh, close) => UI.confirmRow(sh.querySelector("#rrc"), "시험 중인 판을 버리고 지금 퍼진 판으로 돌아갈까요? 되돌리기는 언제든 돼요.", async () => {
        const r = await UI.api("/api/ops-recipe", { body: { action: "rollback", channel: b.dataset.rrb, reason: "운영자가 되돌렸어요" }, noRedirect: true });
        if (!r.ok) return UI.toast(r.error || "되돌리지 못했어요");
        close(); UI.toast("되돌렸어요"); load();
      }) }));
    } else { UI.$("#lock2").innerHTML = OPS.lockPill("super_admin"); UI.$$("[data-rpro],[data-rrb]").forEach((b) => b.disabled = true); }
  }
}
load();
})();
</script>
</body>
</html>
