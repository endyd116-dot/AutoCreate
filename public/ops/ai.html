<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 엔진 · AutoCreate 운영센터</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=23">
</head>
<body class="ops">
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ph"></span><span class="ttl">AI 엔진</span><span class="sp"></span></div>
<div class="group"><div class="gt">영상 만들기 <span class="muted" style="font-weight:500">공급자 사고·원가 폭주 때 여기서 멈춘다</span><span id="lock0"></span></div><div id="kill"></div></div>
<div class="group"><div class="gt">역할별 모델 <span class="muted" style="font-weight:500">정본 lib/ai-models.ts + DB 오버레이 · 모델 이름은 API·코드가 준다</span><span id="lock1"></span></div><div id="roles"></div></div>
<div class="ops-two">
<div class="group"><div class="gt">새 모델 후보 <span class="muted" style="font-weight:500">주 1회 models.list 와 diff · 실측 4종</span></div><div id="cands"></div></div>
<div class="group"><div class="gt">원가 · 업데이트</div><div id="cost"></div></div>
</div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=29"></script>
<script src="/js/ops.js?v=3"></script>
<script src="/js/mock-ops.js?v=1"></script>
<script>
(async () => {
const op = await OPS.boot("ai"); if (!op) return;
const canEdit = OPS.can(op, "super_admin");
const ROLE = { high: "글(고급)", low: "글(가벼움)", director: "디렉터", landing: "랜딩", image: "사진" };
const mono = (a) => `<span style="font-family:ui-monospace,monospace;font-size:12.5px">${UI.esc((a || []).join(" → ") || "—")}</span>`;
const tri = (v) => v === true ? '<span style="color:var(--money-ink);font-weight:800">✓</span>' : v === false ? '<span style="color:var(--danger-ink);font-weight:800">✗</span>' : '<span class="muted" title="판정 불가">—</span>';
let A;
async function load() {
  const r = await UI.api("/api/ops-ai-models", { noRedirect: true }); if (!r.ok) { UI.toast(r.error || "불러오지 못했어요"); return; } A = r; const s = r.settings || {};
  UI.$("#lock1").innerHTML = canEdit ? "" : OPS.lockPill("super_admin");
  UI.$("#roles").innerHTML = OPS.table([
    { h: "역할", f: (x) => `<b>${ROLE[x.role] || x.role}</b>` }, { h: "지금 체인", f: (x) => `${mono(x.chain)}${JSON.stringify(x.chain) !== JSON.stringify(x.codeChain) ? ' <span class="pill ink">오버레이</span>' : ' <span class="pill off">코드 기본</span>'}` },
    { h: "후보 · 카나리", f: (x) => x.candidate ? `${mono(x.candidate)} <span class="pill warn">${x.canaryPct}%</span>` : '<span class="muted">없음</span>' },
    { h: "적용", f: (x) => OPS.dt(x.appliedAt) },
    { h: "", f: (x) => `<button type="button" class="lk" data-apply="${x.role}">적용 · 카나리</button>${x.prevChain || x.candidate ? ` · <button type="button" class="lk" data-rb="${x.role}">롤백</button>` : ""}` },
  ], r.roles || []);
  UI.$("#cands").innerHTML = (s.candidates || []).length ? OPS.table([{ h: "모델", f: (c) => mono([c.model]) }, ...["text", "json", "googleSearch", "image"].map((k) => ({ h: { text: "글", json: "JSON", googleSearch: "검색", image: "사진" }[k], f: (c) => c.tested ? tri(c.tested[k]) : '<span class="muted">미실측</span>' })), { h: "발견", f: (c) => OPS.dt(c.at) }], s.candidates) : `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">새 후보가 없어요 · 감시가 찾으면 여기 실측 결과와 함께 올라와요</span></div></div>`;
  UI.$("#cost").innerHTML = `<div class="kv"><span class="k">원가 상한(고객 · 일)</span><span class="v">${s.costCapKrw == null ? "무제한" : UI.won(s.costCapKrw)}</span></div>
    <div class="kv"><span class="k">업데이트</span><span class="v"><div class="seg" id="mode" style="margin:0"><button type="button" data-v="manual" class="${s.updateMode === "auto" ? "" : "on"}">수동</button><button type="button" data-v="auto" class="${s.updateMode === "auto" ? "on" : ""}">자동</button></div></span></div>
    <p class="muted" style="margin:0 16px 8px;font-size:12.5px">${s.updateMode === "auto" ? "자동: 실측(글+JSON) 통과 후보를 글(고급) 카나리 10%로 올리고 24시간 뒤 실패율이 낮으면 승격 · 높으면 자동 롤백 + 알림" : "수동: 후보가 와도 사람이 «적용 · 카나리»를 눌러야 바뀌어요"}</p>
    <div class="cta" style="position:static;padding:8px 12px 10px;flex-direction:column"><button class="btn secondary sm" type="button" id="cap">원가 상한 바꾸기</button><button class="btn ghost sm" type="button" id="sync">정본 동기화 내려받기</button></div>`;
  const V = r.video || { enabled: true, stoppedTenants: [] };
  UI.$("#kill").innerHTML = `<div class="kv"><span class="k">지금</span><span class="v">${V.enabled ? '<span class="pill ok">만들고 있어요</span>' : '<span class="pill warn">멈춰 있어요</span>'}</span></div>
    ${(V.stoppedTenants || []).length ? `<div class="kv"><span class="k">따로 멈춘 고객</span><span class="v">${V.stoppedTenants.length}곳</span></div>` : ""}
    ${V.updatedAt ? `<div class="kv"><span class="k">마지막으로 바꾼 때</span><span class="v">${OPS.dt(V.updatedAt)}</span></div>` : ""}
    ${V.note ? `<div class="kv"><span class="k">메모</span><span class="v" style="max-width:70%;text-align:right">${UI.esc(V.note)}</span></div>` : ""}
    <p class="muted" style="margin:0 16px 8px;font-size:12.5px">전 고객의 영상 만들기를 한 번에 멈추고, 같은 자리에서 다시 켤 수 있어요. 글과 사진은 그대로 돌아가요.</p>
    <div class="cta" style="position:static;padding:8px 12px 10px;flex-direction:column"><button class="btn ${V.enabled ? "secondary" : "primary"} sm" type="button" id="killBtn">${V.enabled ? "영상 만들기 멈추기" : "영상 만들기 다시 켜기"}</button><button class="btn ghost sm" type="button" id="killOne">고객 한 곳만 멈추기 · 다시 켜기</button></div>`;
  OPS.lock(op, "super_admin", UI.$("#kill"));
  UI.$("#killBtn").onclick = () => {
    const off = V.enabled;
    const what = off
      ? `<ul style="margin:0;padding-left:18px;line-height:1.75"><li><b>지금 만들던 영상</b>은 다음 장면으로 넘어가기 직전에 멈추고 «못 만들었어요»로 놓여요 — <b>코인은 돌려드려요.</b></li>
         <li><b>편성표에 잡힌 영상</b>은 만들기 전에 멈춰요. 코인은 애초에 빠져나가지 않고, <b>자리는 그대로</b> 있어서 다시 켜면 이어서 만들어요.</li>
         <li><b>글과 사진</b>은 멈추지 않아요. 이 스위치는 영상만 봐요.</li></ul>`
      : `<ul style="margin:0;padding-left:18px;line-height:1.75"><li>다음 편성 때부터 영상을 다시 만들기 시작해요.</li>
         <li>멈춰 있는 동안 «못 만들었어요»가 된 영상은 <b>고객이 «다시 만들기»를 누르면</b> 다시 만들어요(코인은 다시 들지 않아요).</li>
         <li>따로 멈춰 둔 고객이 있으면 그 고객은 <b>그대로 멈춘 채</b>예요.</li></ul>`;
    UI.sheet(`<div class="sec">이렇게 돼요</div>${what}
      <div class="field" style="margin-top:12px"><label>왜 ${off ? "멈추나" : "켜나"}요 <span class="muted" style="font-weight:500">· 안 적어도 돼요</span></label><input class="input" id="knote" maxlength="300" placeholder="${off ? "예: 공급자 장애 · 원가 급등" : "예: 공급자 복구 확인"}"></div>
      <div id="kc"></div>`, { title: off ? "영상 만들기 멈추기" : "영상 만들기 다시 켜기", onOpen: (sh, close) => UI.confirmRow(sh.querySelector("#kc"), off ? "전 고객의 영상 만들기를 멈출까요?" : "전 고객의 영상 만들기를 다시 켤까요?", async () => {
        const note = String(sh.querySelector("#knote").value || "").trim();
        const rr = await UI.api("/api/ops-ai-video-kill", { body: { enabled: !off, note: note || null }, noRedirect: true });
        if (!rr.ok) return UI.toast(rr.error || "바꾸지 못했어요");
        close(); UI.toast(rr.enabled ? "영상 만들기를 다시 켰어요" : "영상 만들기를 멈췄어요"); load();
      }) });
  };
  /* 🔴 고객 한 곳만 — 전 고객을 멈추지 않고 **말썽인 한 곳만** 멈춘다. 서버는 처음부터 받을 수 있었는데
     화면이 안 보내면 그건 «시험 대본만 쓰는 칸»이 된다(오늘 내가 잡은 바로 그 병 · verify-write-path-missing). */
  UI.$("#killOne").onclick = () => {
    const stopped = V.stoppedTenants || [];
    UI.sheet(`<div class="sec">지금 따로 멈춰 둔 고객</div>
      ${stopped.length ? stopped.map((t) => `<div class="kv"><span class="k">${t}번 고객</span><span class="v"><button type="button" class="lk" data-on="${t}">다시 켜기</button></span></div>`).join("") : `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">따로 멈춰 둔 고객이 없어요</span></div></div>`}
      <div class="sec">한 곳만 멈추기</div>
      <div class="field"><label>고객 번호</label><input class="input" id="ktid" inputmode="numeric" placeholder="예: 761"><div class="help">그 고객의 영상만 멈춰요. 다른 고객과 글·사진은 그대로예요. 멈추면 만들던 영상은 «못 만들었어요»가 되고 코인은 돌려드려요.</div></div>
      <div class="cta"><button class="btn primary" type="button" id="kone">이 고객 멈추기</button></div>`, { title: "고객 한 곳만", onOpen: (sh, close) => {
      const send = async (tid, enabled) => { const rr = await UI.api("/api/ops-ai-video-kill", { body: { enabled, tenantId: tid }, noRedirect: true }); if (!rr.ok) return UI.toast(rr.error || "바꾸지 못했어요"); close(); UI.toast(enabled ? `${tid}번 고객 영상을 다시 켰어요` : `${tid}번 고객 영상을 멈췄어요`); load(); };
      sh.querySelectorAll("[data-on]").forEach((b) => b.onclick = () => send(Number(b.dataset.on), true));
      sh.querySelector("#kone").onclick = () => { const tid = Number(sh.querySelector("#ktid").value || 0); if (!tid) return UI.toast("고객 번호를 적어 주세요"); send(tid, false); };
    } });
  };
  OPS.lock(op, "super_admin", UI.$("#roles")); OPS.lock(op, "super_admin", UI.$("#cost"), ["#sync"]);
  UI.$$("#mode button").forEach((b) => b.onclick = async () => { if (!canEdit) return; const mode = b.dataset.v; if (mode === s.updateMode) return; const rr = await UI.api("/api/ops-ai-mode", { body: { mode }, noRedirect: true }); if (!rr.ok) return UI.toast(rr.error || "바꾸지 못했어요"); UI.toast(rr.updateMode === "auto" ? "자동 업데이트를 켰어요" : "수동으로 바꿨어요"); load(); });
  UI.$$("[data-apply]").forEach((b) => b.onclick = () => { const x = r.roles.find((y) => y.role === b.dataset.apply); const pick = (s.candidates || []).filter((c) => c.tested && c.tested.text === true).map((c) => c.model);
    UI.sheet(`<form id="af"><div class="field"><label>체인 <span class="muted" style="font-weight:500">· 쉼표로 여러 개 · 앞이 1순위</span></label><input class="input" name="chain" value="${UI.esc((x.candidate || x.chain || []).join(", "))}" style="font-family:ui-monospace,monospace" required><div class="help"></div></div>
      ${pick.length ? `<div class="sec">실측 통과 후보</div>${UI.chips("pick", pick.map((m) => [m, m]), "")}` : ""}
      <div class="sec">카나리 비율</div>${UI.chips("pct", [[10, "10%"], [50, "50%"], [100, "100% (전량)"]], x.canaryPct && x.canaryPct < 100 ? x.canaryPct : 10)}
      <p class="muted" style="margin:10px 0 0;font-size:13px">100%는 지금 체인을 통째로 바꿔요(직전 체인은 롤백용으로 남아요). 코드에 없던 모델은 서버가 우리 키로 먼저 불러 보고, 안 되면 적용을 취소해요(§4.9).</p>
      <div class="cta"><button class="btn primary" type="submit">적용</button></div></form>`, { title: `${ROLE[x.role] || x.role} 모델`, onOpen: (sh, close) => { UI.bindChips(sh, (n, v) => { if (n === "pick") sh.querySelector('[name="chain"]').value = v; }); UI.form(sh.querySelector("#af"), async (d, f) => { const chain = String(d.chain).split(",").map((v) => v.trim()).filter(Boolean); const rr = await UI.api("/api/ops-ai-apply", { body: { role: x.role, chain, canaryPct: Number(UI.chipVal(sh, "pct")) }, noRedirect: true }); if (!rr.ok) return UI.fieldError(f, "chain", rr.error || "적용하지 못했어요"); close(); UI.toast(rr.canaryPct >= 100 ? "체인을 바꿨어요" : `카나리 ${rr.canaryPct}%로 올렸어요`); load(); }); } }); });
  UI.$$("[data-rb]").forEach((b) => b.onclick = () => UI.sheet(`<div id="rc"></div>`, { title: "롤백", onOpen: (sh, close) => UI.confirmRow(sh.querySelector("#rc"), "직전 체인으로 되돌리고 후보를 내릴까요?", async () => { const rr = await UI.api("/api/ops-ai-rollback", { body: { role: b.dataset.rb }, noRedirect: true }); if (!rr.ok) return UI.toast(rr.error || "되돌리지 못했어요"); close(); UI.toast("롤백했어요"); load(); }) }));
  UI.$("#cap").onclick = () => UI.sheet(`<div class="fr"><div class="fl">원가 상한<small>고객 · 일 · 넘으면 생성 거부 + 알림 1건/일 · 환율 없으면 «미환산»으로 통과</small></div>${UI.stepper("cap", s.costCapKrw ?? 0, 0, 300000, "원", 5000)}</div><p class="muted" style="margin:8px 0 0;font-size:13px">0원 = 무제한(상한 없음)</p><div class="cta"><button class="btn primary" type="button" id="ok">저장</button></div>`, { title: "원가 상한", onOpen: (sh, close) => { UI.bindSteppers(sh); sh.querySelector("#ok").onclick = async () => { const v = UI.stepVal(sh, "cap"); const rr = await UI.api("/api/ops-ai-cost-cap", { body: { costCapKrw: v > 0 ? v : null }, noRedirect: true }); if (!rr.ok) return UI.toast(rr.error || "저장하지 못했어요"); close(); UI.toast(rr.costCapKrw == null ? "상한을 없앴어요" : `상한 ${UI.won(rr.costCapKrw)}`); load(); }; } });
  UI.$("#sync").onclick = () => { const txt = `// lib/ai-models.ts 형태 · DB 오버레이 내려받기(${new Date().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" })} KST) · PR 은 사람이\nexport const AI_CHAINS = ${JSON.stringify(Object.fromEntries((A.roles || []).map((x) => [x.role, x.chain])), null, 2)};\n`; UI.sheet(`<code class="code" style="white-space:pre-wrap;font-size:12px">${UI.esc(txt)}</code><div class="cta"><button class="btn primary" type="button" id="cp">복사</button></div>`, { title: "정본 동기화", onOpen: (sh) => { sh.querySelector("#cp").onclick = async () => UI.toast((await UI.copy(txt)) ? "복사했어요 · PR 로 올려요" : "복사하지 못했어요"); } }); };
}
load();
})();
</script>
</body>
</html>
