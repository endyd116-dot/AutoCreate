<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>편성표 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=2">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ttl">편성표</span><span class="sp"></span></div>
<div class="hl" style="padding-bottom:0;display:flex;align-items:center;gap:6px"><button type="button" class="ic" id="prev" aria-label="지난달" style="width:32px;height:32px;display:grid;place-items:center;border-radius:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:20px;height:20px"><path d="M15 5l-7 7 7 7"/></svg></button><div class="num" style="font-size:22px;margin:0" id="mon">편성표</div><button type="button" class="ic" id="next" aria-label="다음달" style="width:32px;height:32px;display:grid;place-items:center;border-radius:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:20px;height:20px"><path d="M9 5l7 7-7 7"/></svg></button><span class="muted" style="font-size:13.5px;font-weight:600;margin-left:4px" id="stat"></span></div>
<div class="seg" id="mode"><button type="button" data-m="week">주</button><button type="button" data-m="month" class="on">월</button></div>
<div class="group" id="cal"></div>
<div id="week" hidden></div>
<div class="group" id="day"><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=2"></script>
<script src="/js/mock.js?v=1"></script>
<script>
(async () => {
const me = await UI.boot("schedule"); if (!me) return;
let mode = "month";
const KST = () => new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const IMG = { naver_blog: 6, tistory: 3, blogger: 2, wordpress: 2, threads: 1 }; // 코인 미리보기 추정(정본은 rules-save 응답 coinsPerWeek)
const today = KST(); let view = new Date(today.getFullYear(), today.getMonth(), 1); let sel = ymd(today);
let D = { rules: [], settings: {}, coinsPerWeek: 0, maxRules: null }, accounts = [], slots = [];
const gear = document.createElement("button"); gear.type = "button"; gear.className = "ic"; gear.setAttribute("aria-label", "편성 설정"); gear.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>'; const sp = UI.$(".appbar .sp"); if (sp) sp.replaceWith(gear);
const dotCls = (s) => s === "published" ? "ok" : s === "in_review" ? "warn" : "";

async function load() {
  const [r, a] = await Promise.all([UI.api("/api/rules-list"), UI.api("/api/accounts-list")]);
  if (r.ok) D = r; accounts = a.ok ? a.accounts : [];
  await loadSlots(); render();
}
async function loadSlots() {
  const first = new Date(view.getFullYear(), view.getMonth(), 1); const start = new Date(first); start.setDate(1 - first.getDay()); const end = new Date(start); end.setDate(start.getDate() + 41);
  const s = await UI.api(`/api/slots-list?from=${ymd(start)}&to=${ymd(end)}`); slots = s.ok ? s.slots : [];
}
function render() {
  UI.$("#mon").textContent = `${view.getMonth() + 1}월${view.getFullYear() !== today.getFullYear() ? " " + view.getFullYear() : ""}`;
  const active = D.rules.filter((r) => r.active);
  if (active.length) { const ws = new Date(today); ws.setDate(today.getDate() - today.getDay()); const we = new Date(ws); we.setDate(ws.getDate() + 6); const n = slots.filter((s) => s.date >= ymd(ws) && s.date <= ymd(we) && s.status !== "skipped").length; UI.$("#stat").textContent = `이번 주 ${n}건 · 주 ${D.coinsPerWeek}코인`; } else UI.$("#stat").textContent = "";
  // 달력(상태 점 ≤3)
  const first = new Date(view.getFullYear(), view.getMonth(), 1); const start = new Date(first); start.setDate(1 - first.getDay());
  let h = WD.map((w) => `<span class="wd">${w}</span>`).join("");
  for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); if (i >= 35 && d.getMonth() !== view.getMonth()) break; const k = ymd(d);
    const dim = d.getMonth() !== view.getMonth(); const ds = slots.filter((s) => s.date === k && s.status !== "skipped").slice(0, 3);
    h += `<button type="button" class="dd ${dim ? "dim" : ""} ${k === ymd(today) ? "today" : ""} ${k === sel ? "sel" : ""}" data-d="${k}">${d.getDate()}<span class="dots">${ds.map((s) => `<i class="${dotCls(s.status)}"></i>`).join("")}</span></button>`; }
  UI.$("#cal").innerHTML = `<div class="cal">${h}</div>`;
  UI.$$("#cal .dd").forEach((b) => b.onclick = () => { sel = b.dataset.d; render(); });
  // 그날 목록 · 규칙 없으면 빈 상태
  const day = UI.$("#day"); const sd = new Date(sel + "T00:00:00"); const list = slots.filter((s) => s.date === sel).sort((x, y) => (x.publishAt || "").localeCompare(y.publishAt || ""));
  if (!active.length && !slots.length) { day.innerHTML = `<div class="empty"><span class="mk soft">▦</span><h3>규칙 하나면 한 달치가 알아서 나가요</h3><p>채널마다 «주 몇 회»만 정하면 소재 배정·제작·발행까지 편성돼요.</p><button class="btn primary sm" type="button" id="mkRule">자동 편성 켜기</button></div>`; UI.$("#mkRule").onclick = () => ruleSheet(); return; }
  day.innerHTML = `<div class="gt">${sd.getDate()}일 ${WD[sd.getDay()]}요일${list.length ? ` · ${list.length}건` : ""}</div>` + (list.length ? list.map((s) => `<button type="button" class="row tap" data-id="${s.id}">${UI.mark(s.channel)}<div class="l"><span class="t">${UI.esc(s.topicTitle || "소재 정하는 중")}</span><span class="d">${s.accountHandle ? "@" + UI.esc(s.accountHandle) : "계정 자동"} · ${s.publishAt ? UI.timeKST(s.publishAt) : "시간 자동"}</span></div>${UI.pill(UI.SLOT_STATUS, s.status)}</button>`).join("")
    : `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">이날은 나갈 글이 없어요</span><span class="d">${active.length ? "규칙에 없는 요일이거나 쉬는 날이에요" : "자동 편성을 켜면 채워져요"}</span></div></div>`);
  UI.$$("#day .row[data-id]").forEach((b) => b.onclick = () => slotSheet(slots.find((s) => s.id === Number(b.dataset.id))));
  // 주 보기 = 선택한 날이 든 주의 날짜별 리스트(DESIGN §5B.8)
  UI.$("#cal").hidden = mode !== "month"; UI.$("#day").hidden = mode !== "month"; const wk = UI.$("#week"); wk.hidden = mode !== "week";
  if (mode === "week") { const ws = new Date(sd); ws.setDate(sd.getDate() - sd.getDay()); wk.innerHTML = "";
    for (let i = 0; i < 7; i++) { const d = new Date(ws); d.setDate(ws.getDate() + i); const k = ymd(d); const ls = slots.filter((s) => s.date === k).sort((x, y) => (x.publishAt || "").localeCompare(y.publishAt || ""));
      wk.insertAdjacentHTML("beforeend", `<div class="group" style="margin-bottom:12px"><div class="gt">${d.getDate()}일 ${WD[d.getDay()]}요일${k === ymd(today) ? ' <span class="pill ink">오늘</span>' : ""}</div>${ls.length ? ls.map((s) => `<button type="button" class="row tap" data-id="${s.id}">${UI.mark(s.channel)}<div class="l"><span class="t">${UI.esc(s.topicTitle || "소재 정하는 중")}</span><span class="d">${s.accountHandle ? "@" + UI.esc(s.accountHandle) : "계정 자동"} · ${s.publishAt ? UI.timeKST(s.publishAt) : "시간 자동"}</span></div>${UI.pill(UI.SLOT_STATUS, s.status)}</button>`).join("") : `<div class="row" style="min-height:40px"><span class="d muted">나갈 글 없음</span></div>`}</div>`); }
    UI.$$("#week .row[data-id]").forEach((b) => b.onclick = () => slotSheet(slots.find((s) => s.id === Number(b.dataset.id)))); }
}
UI.$$("#mode button").forEach((b) => b.onclick = () => { mode = b.dataset.m; UI.$$("#mode button").forEach((x) => x.classList.toggle("on", x === b)); render(); });
/* ── 슬롯 시트(R1: 정보 + 건너뛰기) ── */
function slotSheet(s) {
  const p = s.pieceId ? `<a class="btn secondary" href="/app/piece.html?id=${s.pieceId}">글 보기</a>` : "";
  const canSkip = !["published", "skipped", "publishing"].includes(s.status);
  UI.sheet(`<div class="row" style="padding-left:0;padding-right:0">${UI.mark(s.channel)}<div class="l"><span class="t wrap">${UI.esc(s.topicTitle || "소재 정하는 중")}</span><span class="d">${UI.esc(UI.chLabel(s.channel))}</span></div>${UI.pill(UI.SLOT_STATUS, s.status)}</div>
    <div class="kv" style="padding-left:0;padding-right:0"><span class="k">계정</span><span class="v">${s.accountHandle ? "@" + UI.esc(s.accountHandle) : "건강한 계정 순으로 자동"}</span></div>
    <div class="kv" style="padding-left:0;padding-right:0"><span class="k">발행</span><span class="v">${s.publishAt ? `${UI.dateKST(s.publishAt)} ${UI.timeKST(s.publishAt)}` : "채널 최적 시간"}</span></div>
    ${s.reviewDeadline ? `<div class="kv" style="padding-left:0;padding-right:0"><span class="k">검수 마감</span><span class="v">${UI.dateKST(s.reviewDeadline)} ${UI.timeKST(s.reviewDeadline)}</span></div>` : ""}
    <div class="kv" style="padding-left:0;padding-right:0"><span class="k">편성</span><span class="v">${s.origin === "manual" ? "직접 만든 글" : "자동 편성"}</span></div>
    <div class="cta" style="flex-direction:column">${p}${canSkip ? `<button class="btn ghost" type="button" id="skip" style="color:var(--danger)">이날은 건너뛰기</button>` : ""}</div><div id="sc"></div>`, { title: `${new Date(s.date + "T00:00:00").getDate()}일 편성`, onOpen: (sh, close) => {
      const b = sh.querySelector("#skip"); if (b) b.onclick = () => UI.confirmRow(sh.querySelector("#sc"), "이 편성을 건너뛸까요? 다음 편성은 그대로 나가요.", async () => { const r = await UI.api("/api/slots-skip", { body: { id: s.id } }); if (!r.ok) return UI.toast(r.error || "건너뛰지 못했어요"); close(); UI.toast("건너뛰었어요"); await loadSlots(); render(); });
    } });
}
/* ── 자동 편성 켜기 · 3스텝(한 화면 한 질문) ── */
function ruleSheet() {
  const chans = [...new Set(accounts.map((a) => a.channel))];
  if (!chans.length) return UI.sheet(`<p class="muted" style="margin:0 0 16px">편성하려면 먼저 계정을 하나 연결해 주세요.</p><div class="cta"><a class="btn primary" href="/app/accounts.html">계정 연결</a></div>`, { title: "먼저 계정을 연결해요" });
  const cur = Object.fromEntries(D.rules.filter((r) => r.active).map((r) => [r.channel, r]));
  const st = { count: Object.fromEntries(chans.map((c) => [c, cur[c] ? (cur[c].every === "day" ? cur[c].count * 7 : cur[c].every === "month" ? Math.round(cur[c].count / 4) : cur[c].count) : 0])), mode: Object.fromEntries(chans.map((c) => [c, cur[c]?.accountMode || "auto"])), acc: Object.fromEntries(chans.map((c) => [c, cur[c]?.accountId || null])), reviewPolicy: D.settings.reviewPolicy || "silence_approves", produceLeadDays: D.settings.produceLeadDays || 3 };
  const est = () => chans.reduce((a, c) => a + st.count[c] * (1 + (IMG[c] ?? 2)), 0);
  let step = 1;
  const view = (sh, close) => {
    const body = sh.querySelector(".sheet-body"); const on = chans.filter((c) => st.count[c] > 0);
    const prog = `<div class="prog" style="padding:0 0 8px"><i class="${step >= 1 ? "on" : ""}"></i><i class="${step >= 2 ? "on" : ""}"></i><i class="${step >= 3 ? "on" : ""}"></i></div>`;
    if (step === 1) body.innerHTML = prog + `<div class="step-h" style="padding-top:4px"><h2>얼마나 자주 올릴까요?</h2><p>채널마다 «주 몇 회». 0이면 그 채널은 쉬어요.</p></div>` + chans.map((c) => `<div class="fr"><div class="fl" style="display:flex;align-items:center;gap:10px">${UI.mark(c, "sm")}<span>${UI.esc(UI.chLabel(c))}<small>계정 ${accounts.filter((a) => a.channel === c).length}개</small></span></div>${UI.stepper("c:" + c, st.count[c], 0, 7, "회")}</div>`).join("") + `<div class="cta"><button class="btn primary" type="button" id="nx">다음</button></div>`;
    else if (step === 2) body.innerHTML = prog + `<div class="step-h" style="padding-top:4px"><h2>어느 계정으로?</h2><p>«자동»이면 그날 가장 건강한 계정에 배정해요.</p></div>` + on.map((c) => { const accs = accounts.filter((a) => a.channel === c); return `<div class="fr" style="flex-direction:column;align-items:stretch"><div class="fl" style="display:flex;align-items:center;gap:10px">${UI.mark(c, "sm")}<span>${UI.esc(UI.chLabel(c))} · 주 ${st.count[c]}회</span></div>${UI.seg("m:" + c, [["auto", "자동"], ["fixed", "고르기"]], st.mode[c])}<div data-pick="${c}" ${st.mode[c] === "fixed" ? "" : "hidden"}>${UI.chips("a:" + c, accs.map((a) => [a.id, "@" + a.handle]), st.acc[c] || accs[0]?.id)}</div></div>`; }).join("") + `<div class="cta"><button class="btn secondary" type="button" id="bk" style="flex:0 0 30%">이전</button><button class="btn primary" type="button" id="nx">다음</button></div>`;
    else body.innerHTML = prog + `<div class="step-h" style="padding-top:4px"><h2>${st.produceLeadDays}일 전에 만들어 두고,<br>조용히 두면 그대로 나가요</h2><p>검수 시간에 아무것도 안 하면 예정대로 발행돼요.</p></div>
      <div class="sec">검수 방식</div>${UI.seg("rp", [["silence_approves", "조용하면 발행"], ["require_confirm", "반드시 확인"]], st.reviewPolicy)}
      <div class="sec">며칠 전에 만들까요</div>${UI.chips("pl", [[1, "1일 전"], [3, "3일 전"], [5, "5일 전"]], st.produceLeadDays)}
      <div class="group" style="background:var(--ground);margin-top:16px"><div class="kv"><span class="k">이 편성이면</span><span class="v">주 약 <span id="est">${est()}</span>코인</span></div><div class="kv"><span class="k">지금 잔여</span><span class="v">${UI.num(me.coins)}코인</span></div></div>
      <div class="cta"><button class="btn secondary" type="button" id="bk" style="flex:0 0 30%">이전</button><button class="btn primary" type="button" id="go">켜기</button></div>`;
    UI.bindSteppers(body, (n, v) => { st.count[n.slice(2)] = v; }); UI.bindChips(body, (n, v) => { if (n.startsWith("m:")) { st.mode[n.slice(2)] = v; body.querySelector(`[data-pick="${n.slice(2)}"]`).hidden = v !== "fixed"; } else if (n.startsWith("a:")) st.acc[n.slice(2)] = Number(v); else if (n === "rp") st.reviewPolicy = v; else if (n === "pl") { st.produceLeadDays = Number(v); view(sh, close); } });
    const nx = body.querySelector("#nx"); if (nx) nx.onclick = () => { if (step === 1 && !chans.some((c) => st.count[c] > 0)) return UI.toast("한 채널은 1회 이상으로 해 주세요"); step++; view(sh, close); };
    const bk = body.querySelector("#bk"); if (bk) bk.onclick = () => { step--; view(sh, close); };
    const go = body.querySelector("#go"); if (go) go.onclick = async () => {
      go.disabled = true;
      const rules = chans.filter((c) => st.count[c] > 0).map((c) => { const r = { channel: c, kind: "post", accountMode: st.mode[c], every: "week", count: st.count[c], active: true }; if (cur[c]?.id) r.id = cur[c].id; if (st.mode[c] === "fixed") r.accountId = st.acc[c] || accounts.find((a) => a.channel === c)?.id; if (cur[c]?.preferredHour != null) r.preferredHour = cur[c].preferredHour; if (cur[c]?.weekdays) r.weekdays = cur[c].weekdays; return r; });
      const r = await UI.api("/api/rules-save", { body: { rules } }); go.disabled = false;
      if (!r.ok) { if (r.step === "limit") { close(); return UI.sheet(`<p class="muted" style="margin:0 0 16px">${UI.esc(r.error)}</p><div class="cta"><a class="btn primary" href="/app/plans.html">요금제 보기</a></div>`, { title: "이 요금제에서는 여기까지예요" }); } return UI.toast(r.error || "저장하지 못했어요"); }
      const s = await UI.api("/api/rules-settings", { body: { autoSchedule: true, reviewPolicy: st.reviewPolicy, produceLeadDays: st.produceLeadDays } }); if (!s.ok) UI.toast(s.error || "설정은 저장하지 못했어요");
      close(); UI.done(`자동 편성을 켰어요 · 주 ${r.coinsPerWeek}코인`, load);
    };
  };
  UI.sheet(`<div class="sheet-body"></div>`, { title: "", onOpen: (sh, close) => { view(sh, close); } });
}
/* ── 설정 시트(ScheduleSettings 변수 8 + 규칙 요약) ── */
function settingsSheet() {
  const S = { horizonDays: 14, topicLeadDays: 7, produceLeadDays: 3, produceHour: "06:00", reviewPolicy: "silence_approves", bestTimeMode: "auto", weeklyCoinCap: null, quietDays: [], ...D.settings };
  const active = D.rules.filter((r) => r.active); const quiet = new Set(S.quietDays || []);
  const days = []; for (let i = 0; i < 28; i++) { const d = new Date(today); d.setDate(today.getDate() + i); days.push(d); } const pad = today.getDay();
  const qcal = `<div class="cal" style="padding:4px 0">${WD.map((w) => `<span class="wd">${w}</span>`).join("")}${"<span></span>".repeat(pad)}${days.map((d) => `<button type="button" class="dd ${quiet.has(ymd(d)) ? "sel" : ""}" data-q="${ymd(d)}" style="height:34px">${d.getDate()}</button>`).join("")}</div>`;
  UI.sheet(`<div class="fr"><div class="fl">자동 편성<small>${active.length ? `규칙 ${active.length}개${D.maxRules ? ` · 최대 ${D.maxRules}개` : ""}` : "규칙을 만들면 켤 수 있어요"}</small></div><button class="toggle" type="button" id="auto" aria-checked="${!!S.autoSchedule}" aria-label="자동 편성"></button></div>
    ${active.map((r) => `<div class="row" style="min-height:44px">${UI.mark(r.channel, "sm")}<div class="l"><span class="t" style="font-size:14px">${UI.esc(UI.chLabel(r.channel))} · ${r.every === "day" ? "매일" : r.every === "month" ? "월" : "주"} ${r.count}회</span><span class="d">${r.accountMode === "fixed" ? "@" + UI.esc(accounts.find((a) => a.id === r.accountId)?.handle || "") : "계정 자동"}</span></div></div>`).join("")}
    <div style="padding:6px 0 4px"><button class="btn secondary sm" type="button" id="rules" style="width:100%">${active.length ? "규칙 바꾸기" : "규칙 만들기"}</button></div>
    <div class="sec">얼마나 미리 편성할까요</div>${UI.seg("horizonDays", [[7, "7일"], [14, "14일"], [30, "30일"]], S.horizonDays)}
    <div class="sec">소재는 며칠 전에 정할까요</div>${UI.chips("topicLeadDays", [[3, "3일 전"], [7, "7일 전"], [14, "14일 전"]], S.topicLeadDays)}
    <div class="sec">글은 며칠 전에 만들까요</div>${UI.chips("produceLeadDays", [[1, "1일 전"], [3, "3일 전"], [5, "5일 전"]], S.produceLeadDays)}
    <div class="sec">만드는 시각</div>${UI.chips("produceHour", [["06:00", "06:00"], ["09:00", "09:00"]], S.produceHour)}
    <div class="sec">검수 방식</div>${UI.seg("reviewPolicy", [["silence_approves", "조용하면 발행"], ["require_confirm", "반드시 확인"]], S.reviewPolicy)}
    <div class="sec">발행 시간</div>${UI.seg("bestTimeMode", [["auto", "채널 최적 시간"], ["fixed", "정한 시간만"]], S.bestTimeMode)}
    <div class="sec">주간 코인 상한</div>${UI.seg("capMode", [["plan", "플랜 포함분"], ["custom", "직접 정하기"]], S.weeklyCoinCap == null ? "plan" : "custom")}<div id="capBox" ${S.weeklyCoinCap == null ? "hidden" : ""} style="padding:8px 0 0">${UI.stepper("cap", S.weeklyCoinCap || 50, 10, 500, "코인", 10)}</div>
    <div class="sec">쉬는 날 <span class="muted" style="font-weight:500">· 앞으로 4주 · 여러 날 가능</span></div>${qcal}
    <div class="cta"><button class="btn primary" type="button" id="save">저장</button></div>`, { title: "편성 설정", onOpen: (sh, close) => {
      UI.bindSteppers(sh); UI.bindChips(sh, (n, v) => { if (n === "capMode") sh.querySelector("#capBox").hidden = v !== "custom"; });
      sh.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => { const k = b.dataset.q; quiet.has(k) ? quiet.delete(k) : quiet.add(k); b.classList.toggle("sel", quiet.has(k)); });
      UI.toggle(sh.querySelector("#auto"), (on) => { if (on && !active.length) { UI.toast("먼저 규칙을 만들어 주세요"); return false; } });
      sh.querySelector("#rules").onclick = () => { close(); ruleSheet(); };
      sh.querySelector("#save").onclick = async () => {
        const body = { autoSchedule: sh.querySelector("#auto").getAttribute("aria-checked") === "true", horizonDays: Number(UI.chipVal(sh, "horizonDays")), topicLeadDays: Number(UI.chipVal(sh, "topicLeadDays")), produceLeadDays: Number(UI.chipVal(sh, "produceLeadDays")), produceHour: UI.chipVal(sh, "produceHour"), reviewPolicy: UI.chipVal(sh, "reviewPolicy"), bestTimeMode: UI.chipVal(sh, "bestTimeMode"), weeklyCoinCap: UI.chipVal(sh, "capMode") === "custom" ? UI.stepVal(sh, "cap") : null, quietDays: [...quiet].sort() };
        const r = await UI.api("/api/rules-settings", { body }); if (!r.ok) return UI.toast(r.error || "저장하지 못했어요");
        close(); UI.toast("편성 설정을 저장했어요"); load();
      };
    } });
}
gear.onclick = settingsSheet;
UI.$("#prev").onclick = async () => { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); await loadSlots(); render(); };
UI.$("#next").onclick = async () => { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); await loadSlots(); render(); };
await load();
})();
</script>
</body>
</html>
