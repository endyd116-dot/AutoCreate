<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>요금제 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=3">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/app/account.html')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="ttl">요금제</span><span class="sp"></span></div>
<div class="step-h"><h1>이어서 쓸 요금제를 골라요</h1><p>구독은 기능 이용료예요. 글·영상을 만들 때 쓰는 코인은 따로 충전해요.</p></div>
<div id="plans"><div class="sk" style="height:120px"></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=3"></script>
<script src="/js/mock.js?v=2"></script>
<script>
(async () => {
await UI.boot("account");
const r = await UI.api("/api/plans"); if (!r.ok) return;
UI.$("#plans").innerHTML = r.plans.map((p) => `<div class="group" style="margin-bottom:12px;${p.recommended ? "outline:2px solid var(--sel);outline-offset:-2px" : ""}">
  <div class="gt">${UI.esc(p.name)} ${p.recommended ? '<span class="pill ink">추천</span>' : ""}</div>
  <div class="hl" style="padding-top:0"><div class="num" style="font-size:24px">${UI.won(p.priceMonth)}<small class="muted" style="font-size:13px;font-weight:500"> /월</small></div><div class="tip">연납 ${UI.won(p.priceYear)} · 2개월 무료</div></div>
  <div class="kv"><span class="k">계정</span><span class="v">${p.limits.maxAccounts}개</span></div>
  <div class="kv"><span class="k">매달 포함 코인</span><span class="v">${p.limits.coinsIncluded}코인</span></div>
  <div class="kv"><span class="k">자동 편성 기간</span><span class="v">${p.limits.horizonDays}일치</span></div>
  <div class="kv"><span class="k">디렉터 손보기</span><span class="v">${p.features.directorEdit ? "가능" : "자동만"}</span></div>
  <div class="kv"><span class="k">계정 정지 시 승계</span><span class="v">${p.features.failover ? "자동" : "—"}</span></div>
  <div class="cta nobar" style="position:static;padding:12px 12px 8px"><button class="btn primary" type="button" onclick="UI.toast('결제는 곧 열려요 · 지금은 체험 기간을 쓰세요')">이 플랜으로</button></div>
</div>`).join("");
})();
</script>
</body>
</html>
