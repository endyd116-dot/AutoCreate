<script>
(async () => {
await UI.boot("create");
const COMP = { low: "경쟁 낮음", mid: "경쟁 보통", high: "경쟁 높음" };
let accountsN = null, busy = false, timer = null, templates = [], textAccounts = [], videoAccounts = [];
let wantVideo = false;
/* 🔴 [AC-184 · A · 2026-09-21] **여기가 사장님이 «만들기에 영상이 없다»고 하신 자리다.**
   종전엔 영상 줄을 `videoAccounts.length`(영상 채널 계정이 있나)로만 갈랐다 — 그런데 설정의 토글은 `kinds` 를 켠다.
   영상 채널 계정이 0개인 집은 **토글을 켜도 이 화면이 아무 말도 안 했다**(서버는 이미 만들 수 있는데도).
   🔴 `lib/director.ts` §1.2 가 «계정 없이 영상 만들기»를 **수동 «만들기» 경로에 한해** 열어 뒀다 — 그러니 계정은 조건이 아니다.
   ⇒ `kinds` 를 읽고, 계정이 없으면 **그 사실과 다음 수**를 한 줄로 말한다(§9 «막지 않는 대신 말해 준다»). // [P1R5] shorts_templates(레퍼런스 구조) · [R9R10-A] textAccounts = 글 채널 계정(글 레퍼런스는 계정의 옷장에 붙는다) · [R11 A-3] videoAccounts = 영상 축
/* [R11 A-3] 한도는 **그룹 제목 줄 우측**에 글자로 — 링크가 아니다(§13.0b 의 «전체보기 ›» 자리를 글자가 쓴다).
   🔴 «남음»을 **지어내지 않는다** — 서버가 `quota` 를 안 주거나 칸이 비면 **숫자를 빼고 이름만** 남는다(AC-9·AC-92).
   🔴 `left` 는 서버 값을 **그대로** 쓴다 — 화면이 `limit - used` 로 셈하면 같은 수를 두 곳에서 만드는 셈이다(AC-52).
   🔴 단위는 두 축 모두 **«이번 달»**이다(영상이 «하루 3개»였다 · B 가 서버를 맞췄다 · 두 줄이 다른 단위로 말하면 고객이 견준다). */
async function paintQuota() {
  const el = UI.$("#refq"); if (!el) return;
  const num = (q) => (q && Number.isFinite(Number(q.left)) && Number.isFinite(Number(q.limit)) ? `${Number(q.left)} / ${Number(q.limit)}` : null);
  const [ps, vs] = await Promise.all([
    textAccounts.length ? UI.api("/api/account-styles") : Promise.resolve({ ok: false }),
    wantVideo ? UI.api("/api/topics-templates") : Promise.resolve({ ok: false }),   // [AC-184] 계정이 아니라 kinds — 이 한도는 테넌트 것이다(topics-reference.ts 는 계정을 안 본다)
  ]);
  const t = ps.ok ? num(ps.quota) : null, v = vs.ok ? num(vs.quota) : null;
  el.textContent = t && v ? `이번 달 글 ${t} · 영상 ${v} 남음` : t ? `이번 달 ${t} 남음` : v ? `이번 달 ${v} 남음` : "";
}
/* [사장님 실측 2026-09-15 · 테넌트 198] «네이버 소재만 계속 보인다» — 데이터는 맞다(소재 채널은 **연결된 계정의 채널**에서만 정해진다 · lib/topics.ts).
   틀린 건 **화면이 그 까닭을 말하지 않은 것**이다. 연결된 채널을 한 줄로 말하고, 둘 이상이면 칩으로 거른다.
   🔴 고른 칩은 **화면 안에서만** 산다(저장·URL 금지) — 새로 들어오면 늘 «전체»(«한 번 누르면 계속 그 상태»가 그 불편의 정체). */
let chFilter = "";
function sub(t) { const f = t.factors || {}; const parts = [];
  if (f.volume != null) parts.push(`검색 ${UI.num(f.volume)}`); else parts.push("검색량 모름"); // volume 키가 없으면 «모름»(0 아님) — 직접·AI 구분 없이(B-1 확정) if (f.growthPct != null) parts.push(`${f.growthPct >= 0 ? "↑" : "↓"}${Math.abs(f.growthPct)}%`); if (f.competition) parts.push(COMP[f.competition] || f.competition); if (f.seasonal) parts.push(f.seasonal);
  const tp = t.factors?.structureTemplateId ? templates.find((x) => x.id === t.factors.structureTemplateId) : null; if (tp) parts.push(`구조: ${UI.esc(tp.name)}`); // [P1R5] 레퍼런스 구조 부제
  return parts.length ? parts.join(" · ") : UI.esc(t.angle || ""); }
/* [v2.9] 소재 뽑기는 배경 작업 — 도는 동안은 스켈레톤 + 한 문장, 5초마다 다시 본다(떠났다 와도 같은 상태) */
const SK = `<div class="row"><span class="sk" style="width:28px;height:28px;border-radius:9px"></span><div class="l"><span class="sk" style="width:78%;height:13px"></span><span class="sk" style="width:42%;height:11px;margin-top:6px"></span></div></div>`;
const busyBox = (since) => `${SK}${SK}<p class="muted" style="margin:2px 16px 12px;font-size:13.5px">소재 뽑는 중이에요 · 1~2분 걸려요${since ? ` · ${UI.esc(since)}에 시작했어요` : ""}</p>`;
const STALE = `<p class="muted" style="margin:2px 16px 12px;font-size:13.5px">소재 뽑기가 너무 오래 걸려요. 다시 뽑아 주세요.</p>`;
const startPoll = () => { if (!timer) timer = setInterval(() => load(true), 5000); };
const stopPoll = () => { if (timer) { clearInterval(timer); timer = null; } };
/* 연결된 채널 목록 — 정지된 계정은 뺀다(거기로는 못 나간다) · 목록·시트가 같은 값을 쓴다 */
async function loadChans() {
  if (chans) return chans;
  const a = await UI.api("/api/accounts-list");
  chans = a.ok ? [...new Set((a.accounts || []).filter((x) => x.status !== "suspended").map((x) => x.channel))] : [];
  return chans;
}
async function load(poll = false) {
  /* 🔴 [AC-184] **나란히** 부른다 — 줄줄이 붙이면 첫 그림이 왕복 하나만큼 밀린다.
     편성표에서 실제로 그랬다: `verify-hand-on-button` 이 그 화면을 «막다른 골목»(단추 3개)으로 잡았다. 오류는 0이었다. */
  /* 🔴 [R17 · A] «나중에 볼 소재»는 **세 번째 부름**으로 센다 — 옮긴 것이 어디로 갔는지 안 보이면 옮기지 않는다(§9-3).
     실패해도 화면은 그대로 간다(`catch` → 0) — 곁다리 하나 때문에 소재 목록이 안 뜨면 안 된다. */
  const [r, ts, lt] = await Promise.all([UI.api("/api/topics-list?status=candidate"), UI.api("/api/tenant-settings", { noGate: true }),
    UI.api("/api/topics-list?status=later", { noGate: true }).catch(() => ({ ok: false }))]);
  const laterN = lt && lt.ok ? (lt.topics || []).length : 0;
  /* 🔴 [R17 · A · B 계약 2026-09-23] 소재 낱말은 **서버가 준다**(AC-52) — `labels` 는 status 무관 항상 실린다.
     아래 기본값은 서버가 아직 안 줄 때만 쓴다(옛 배포와 섞여도 화면이 안 비게). */
  if (r.ok && r.labels) LBL = r.labels; else if (lt && lt.ok && lt.labels) LBL = lt.labels;
  /* [AC-188] 🔴 토스트만 띄우고 돌아가면 뼈대가 영원히 돈다 — 치우고·까닭 적고·다시 누를 단추를 준다(UI.retryPanel).
     🔴 되풀이 호출(poll)에서는 갈아엎지 않는다 — 보고 있던 목록이 깜빡 사라진다. */
  if (!r.ok) { if (!poll) UI.retryPanel("#topics", () => load(false), r.error); return; }
  /* 🔴 영상을 켰나 — **서버가 정본**(`tenant-settings.kinds`). 못 읽으면 «꺼짐»으로 둔다(없는 기능을 켜 보이지 않는다 · AC-9). */
  wantVideo = !!(ts.ok && (ts.kinds || []).includes("video"));
  if (accountsN == null) { const a = await UI.api("/api/accounts-list"); accountsN = a.ok ? a.accounts.length : 0;
    chans = a.ok ? [...new Set((a.accounts || []).filter((x) => x.status !== "suspended").map((x) => x.channel))] : [];
    /* [R9R10-A] «글 채널»은 서버가 말한다(channels[].category) — 화면에 채널 이름을 박지 않는다 */
    const textCh = new Set((a.ok ? a.channels || [] : []).filter((c) => c.category === "text").map((c) => c.key));
    textAccounts = a.ok ? (a.accounts || []).filter((x) => textCh.has(x.channel) && x.status !== "suspended") : [];
    /* [R11 A-3] 영상 축도 **서버가 말한 category** 로 가른다(글 쪽과 같은 잣대 · 채널 이름을 화면에 박지 않는다). */
    const videoCh = new Set((a.ok ? a.channels || [] : []).filter((c) => c.category === "video").map((c) => c.key));
    videoAccounts = a.ok ? (a.accounts || []).filter((x) => videoCh.has(x.channel) && x.status !== "suspended") : []; }
  const wa = UI.$("#wayAiD");
  if (wa) wa.textContent = wantVideo
    ? (videoAccounts.length ? "소재만 고르면 채널·계정·구성·시각까지 정해 드려요 · 글과 영상을 함께 만들어요" : "소재만 고르면 글과 영상을 함께 만들어요 · 올릴 영상 채널이 없어도 만들어 두고 직접 올리시면 돼요")
    : "소재만 고르면 채널·계정·구성·시각까지 정해 드려요";
  templates = r.templates || [];
  /* [R11 A-3] «배워 올 곳» — 종전엔 제목 없는 그룹이라 **«네 번째 쓰는 길»처럼** 보였다.
     레퍼런스는 쓰는 길이 아니라 **쓰기 전에 옷을 갈아입히는 일**이라 제목을 가진 제 그룹으로 세웠다.
     🔴 **그 축 계정이 없으면 그 줄이 없다** — 영상 계정이 없는 집에 «영상 스타일 배우기»는 못 누르는 줄이다. */
  UI.$("#refPost").hidden = !textAccounts.length;
  UI.$("#ref").hidden = !wantVideo;   // [AC-184] 영상을 켠 집이면 계정 0개여도 배울 수 있다(옷장은 테넌트에 붙는다)
  UI.$("#refg").hidden = !textAccounts.length && !wantVideo;
  if (templates.length) UI.$("#refd").textContent = `배운 구조 ${templates.length}개 · ${templates.map((x) => x.name).slice(-2).join(" · ")}`;
  await paintQuota();
  const f = r.refresh || {};
  const startedMs = f.startedAt ? UI.utc(f.startedAt).getTime() : null;
  const stale = !!(f.running && startedMs && Date.now() - startedMs > 600000); // 고아 방지 — 10분 넘으면 도는 걸로 보지 않는다
  const was = busy; busy = !!f.running && !stale;
  if (busy) startPoll(); else stopPoll();
  if (was && !busy && !stale) UI.toast(f.error ? f.error : f.added ? `소재 ${f.added}개 찾았어요` : "새로 뽑을 소재가 없었어요");
  const BUSY = busy ? busyBox(startedMs ? UI.ago(f.startedAt) : "") : stale ? STALE : "";
  const g = UI.$("#topics");
  /* 🔴 채널 이름을 화면에 박지 않는다 — 연결된 계정에서 읽는다(채널이 늘면 문구가 저절로 따라온다) */
  const chList = chans || [];
  const chLine = accountsN && chList.length === 1
    ? `<p class="muted" style="margin:0 16px 8px;font-size:12.5px">연결된 채널의 소재만 보여드려요 · 지금은 <b style="color:var(--ink)">${UI.esc(UI.chLabel(chList[0]))}</b> <a href="/app/accounts.html" class="inline-tap">다른 채널 연결하기</a></p>` : "";
  const chChips = accountsN && chList.length > 1
    ? `<div style="padding:0 12px 8px">${UI.chips("chf", [["", "전체"], ...chList.map((c) => [c, UI.chLabel(c)])], chFilter)}</div>` : "";
  const head = `<div class="gt">오늘의 소재 ${r.topics.length || ""} ${busy ? '<span class="muted" style="font-weight:600;font-size:12.5px">뽑는 중</span>' : ""}</div>` + chLine + chChips
    + (accountsN ? `<button type="button" class="row tap" id="addTopic"><span class="mk soft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></span><div class="l"><span class="t">내 소재 넣기</span><span class="d">쓰고 싶은 주제를 직접 적어 디렉터에게 보내요</span></div>${UI.chev}</button>` : "") // [사장님 실측] 디렉터는 소재만 받으면 된다 — 입구
    /* 🔴 [R17 · A] «나중에 볼 소재» 입구 — **옮긴 것은 돌아올 길이 보여야 옮긴 게 된다**(§9-3).
       🔴 0개면 줄을 안 그린다 — 빈 줄은 «할 일»처럼 보인다(§13.0 «첫 화면 숫자 하나»). */
    + (laterN ? `<button type="button" class="row tap" id="laterBtn"><span class="mk soft">↺</span><div class="l"><span class="t">${UI.esc(lz("title"))} ${laterN}개</span><span class="d">지금은 아니라고 옮겨 둔 것 · 언제든 다시 꺼내요</span></div>${UI.chev}</button>` : "");
  const cta = UI.$("#cta"), rb = UI.$("#refresh"); cta.hidden = !accountsN; rb.disabled = busy; rb.textContent = busy ? "뽑는 중이에요" : "새로 뽑기";
  /* 🔴 [R17 · A] `#laterBtn` 은 `head` 에 들어가므로 **빈 목록 판에서도 같이 묶여야** 한다 —
     소재가 0개일 때야말로 «나중에 둔 것»을 꺼낼 때다. 그래서 `bindAdd` 와 한 몸으로 둔다(부르는 자리 네 곳 전부). */
  const bindAdd = () => { const b = UI.$("#addTopic"); if (b) b.onclick = addSheet; const l = UI.$("#laterBtn"); if (l) l.onclick = laterSheet; };
  const bindChf = () => UI.bindChips(UI.$("#topics"), (n, v) => { if (n !== "chf") return; chFilter = v || ""; load(); });   // 🔴 저장하지 않는다(새로 들어오면 늘 «전체»)
  if (!accountsN) { g.innerHTML = head + `<div class="empty"><span class="mk soft">+</span><h3>먼저 계정을 연결해 주세요</h3><p>연결된 채널에 맞는 소재부터 보여드려요.</p><a class="btn primary sm" href="/app/accounts.html">계정 연결</a></div>`; return; }
  if (busy && !r.topics.length) { g.innerHTML = head + BUSY; bindAdd(); bindChf(); return; }
  if (!r.topics.length) { g.innerHTML = head + BUSY + `<div class="empty"><span class="mk soft">?</span><h3>소재를 뽑아 볼까요?</h3><p>지금 검색이 늘고 경쟁이 낮은 소재를 골라 드려요. 하루 3번까지.</p></div>`; bindAdd(); bindChf(); return; }
  const shown = chFilter ? r.topics.filter((t) => (t.channelHint || "naver_blog") === chFilter) : r.topics;
  if (!shown.length) { g.innerHTML = head + BUSY + `<div class="empty"><span class="mk soft">?</span><h3>${UI.esc(UI.chLabel(chFilter))} 소재가 아직 없어요</h3><p>«전체»로 보거나 새로 뽑아 보세요.</p></div>`; bindAdd(); bindChf(); return; }
  g.innerHTML = head + BUSY + shown.map((t) => `<div class="row swipe" data-id="${t.id}">${UI.mark(t.channelHint || "naver_blog", "sm")}<div class="l"><span class="t wrap">${UI.esc(t.title)}${t.source === "manual" ? ' <span class="pill off" style="font-size:11px;padding:1px 6px">직접</span>' : ""}</span><span class="d wrap">${sub(t)}</span></div><button type="button" class="btn sm secondary" data-go="${t.id}">디렉터에게</button><button type="button" class="ic" data-more="${t.id}" aria-label="더보기" style="width:32px;height:32px;display:grid;place-items:center;color:var(--muted);flex:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:20px;height:20px"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button></div>`).join("");
  bindAdd(); bindChf();
  UI.$$("[data-go]").forEach((b) => b.onclick = () => { const t = r.topics.find((x) => x.id === Number(b.dataset.go)); UI.go(`/app/director.html?topicId=${b.dataset.go}&t=${encodeURIComponent(t?.title || "")}`); });
  UI.$$("[data-more]").forEach((b) => b.onclick = () => { const t = r.topics.find((x) => x.id === Number(b.dataset.more)); UI.sheet(`<p class="muted" style="margin:0 0 4px">${UI.esc(t.title)}</p><p class="muted" style="margin:0 0 16px;font-size:13px">${UI.esc(t.angle || "")}${t.expiresAt ? ` · ${UI.dateKST(t.expiresAt)}까지` : ""}</p><div class="cta" style="flex-direction:column"><button class="btn primary" type="button" data-s-go>디렉터에게</button><button class="btn secondary" type="button" data-s-later>나중에</button><button class="btn secondary" type="button" data-s-skip>넘김</button></div>`, { title: "이 소재를", onOpen: (sh, close) => { sh.querySelector("[data-s-go]").onclick = () => UI.go(`/app/director.html?topicId=${t.id}&t=${encodeURIComponent(t.title)}`); sh.querySelector("[data-s-skip]").onclick = async () => { close(); await skip(t.id); }; sh.querySelector("[data-s-later]").onclick = async () => { close(); await later(t.id); }; } }); });
  /* [DESIGN §13.0b 소재 카드] 스와이프 — **왼쪽 = 넘김 · 오른쪽 = 디렉터에게 · 위 = 나중에.**
     🔴 [R17 · A] 세 번째 방향이 드디어 붙었다 — 여기 «서버에 «나중에»를 적어 둘 자리가 없다»고 적어 뒀던 그것이다.
        B 가 `POST /api/topics-later` 를 열어 줘서(2026-09-23) 이제 **새로고침해도 그대로**다.
     🔴 세 방향 다 **이미 단추로 되는 일**이라 스와이프는 지름길일 뿐이다 — 스와이프로만 되는 기능을 만들지 않는다(못 찾는 사람이 생긴다).
        «나중에»도 ⋯ 더보기 시트에 단추로 있다. */
  UI.$$(".row.swipe").forEach((row) => { let x0 = null, y0 = null, dx = 0, dy = 0;
    row.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; dy = 0; }, { passive: true });
    row.addEventListener("touchmove", (e) => { if (x0 == null) return; dx = e.touches[0].clientX - x0; dy = e.touches[0].clientY - y0;
      /* 세로가 더 크면 세로로 잡는다 — 가로와 섞이면 둘 다 엉뚱하게 먹는다 */
      if (Math.abs(dy) > Math.abs(dx)) row.style.transform = `translateY(${Math.max(Math.min(dy, 80), -80)}px)`;
      else row.style.transform = `translateX(${Math.max(Math.min(dx, 120), -120)}px)`; }, { passive: true });
    row.addEventListener("touchend", async () => { row.style.transform = ""; const d = dx, dv = dy; x0 = null; y0 = null;
      if (Math.abs(dv) > Math.abs(d) && dv < -60) return later(Number(row.dataset.id));
      if (d < -80) return skip(Number(row.dataset.id));
      if (d > 80) { const t = (r.topics || []).find((x) => x.id === Number(row.dataset.id)); if (t) UI.go(`/app/director.html?topicId=${t.id}&t=${encodeURIComponent(t.title || "")}`); }
    }); });
}
async function refresh() {
  const b = UI.$("#refresh"); b.disabled = true;
  const r = await UI.api("/api/topics-refresh", { body: {} }); b.disabled = busy;
  if (!r.ok) { if (!r.gated) UI.toast(r.error || "지금은 뽑지 못했어요"); return; }
  if (r.topics) { UI.toast(r.added ? `소재 ${r.added}개 찾았어요` : "새로 뽑을 소재가 없어요"); load(); return; } // 옛 동기 응답 호환
  busy = true; UI.toast(r.started === false ? "이미 뽑고 있어요" : "소재를 뽑기 시작했어요"); startPoll(); load(true);
}
async function skip(id) { const r = await UI.api("/api/topics-skip", { body: { id } }); if (!r.ok) { UI.toast(r.error || "넘기지 못했어요"); return; } UI.toast("넘겼어요"); load(); }
/* 🔴 [R17 · A · B 가 서버를 열었다] **«나중에»** — `POST /api/topics-later { id }` · 되돌리기는 `{ id, undo: true }`.
   🔴 `skip`(넘김 = «안 쓴다» → expired)과 **뜻이 다르다** — 나중에 = «지금은 아니다».
      만료 시각을 안 건드려서 되돌리면 **원래 후보로 점수·순서 그대로** 돌아온다(B 계약).
   🔴 §9 — **숨기는 게 아니라 옮기는 것**이다. 그래서 돌아올 길(«나중에 볼 소재»)이 목록 머리에 늘 떠 있다. */
/* 🔴 [R17 · A · B 계약] 소재 낱말은 서버가 준다(AC-52). 기본값은 **서버가 아직 안 줄 때만** 쓴다 —
   글자는 `lib/topics.ts` 의 `labels.later` 와 한 글자도 다르지 않아야 한다(다르면 화면 말투가 갈리고 아무 자도 안 잡는다).
   🔴 `stale` 은 **`=== true` 로만** 본다 — 칸이 없는 건 «안 지났다»가 아니라 «시계가 없다»다(AC-9). */
let LBL = {};
const LZ_FALLBACK = { title: "나중에 볼 소재", empty: "나중에 볼 소재가 아직 없어요", undo: "오늘 소재로", keep: "여기 둔 소재는 사라지지 않아요", stale: "추천한 지 오래됐어요 · 지금도 쓸 수 있어요" };
const lz = (k) => ((LBL.later && LBL.later[k]) || LZ_FALLBACK[k]);
async function later(id) {
  const r = await UI.api("/api/topics-later", { body: { id } });
  if (!r.ok) { UI.toast(r.error || "옮기지 못했어요"); return; }
  /* 되돌릴 길을 **사라지는 토스트에 걸지 않는다** — 놓치면 끝이다. 목록 머리의 줄이 늘 남는다. */
  UI.toast("나중에 볼 소재로 옮겼어요 · 위에서 다시 꺼낼 수 있어요", 3200);
  load();
}
async function laterSheet() {
  UI.sheet(`<div id="ltList"><span class="sk" style="width:100%;height:56px"></span></div>`, { title: lz("title"), onOpen: async (sh, close) => {
    const box = sh.querySelector("#ltList");
    const r = await UI.api("/api/topics-list?status=later");
    if (!r.ok) { box.innerHTML = `<p class="muted" style="margin:0;font-size:13px">${UI.esc(r.error || "지금은 불러올 수 없어요. 잠시 뒤 다시 열어 보세요.")}</p>`; return; }
    if (r.labels) LBL = r.labels;
    const list = r.topics || [];
    if (!list.length) { box.innerHTML = `<p class="muted" style="margin:0;font-size:13px">${UI.esc(lz("empty"))}. 소재를 위로 밀거나 ⋯ 에서 «나중에»를 누르면 여기로 와요.</p>`; return; }
    /* 🔴 [B 2026-09-23] 여기 둔 소재는 **이제 만료로 사라지지 않는다** — 서버가 `later` 만 만료를 안 거른다.
       그래서 «N일 뒤 사라져요»가 아니라 **«사라지지 않아요»**를 적는다(내가 물었던 그 구멍이 서버에서 막혔다).
       🔴 자동 편성에서 빠지는 것은 **따로 말한다** — «지금은 아니다»의 뜻이지만, 안 적으면 «왜 안 올라갔지»가 된다(§9-1). */
    box.innerHTML = `<p class="muted" style="margin:0 0 8px;font-size:13px">${list.length}개 있어요. <b>${UI.esc(lz("keep"))}</b> · «${UI.esc(lz("undo"))}»를 누르면 원래 자리로 그대로 돌아가요.<br>여기 있는 동안은 자동 편성에 안 올라가요.</p>`
      + list.map((t) => `<div class="row">${UI.mark(t.channelHint || "naver_blog", "sm")}<div class="l"><span class="t wrap">${UI.esc(t.title)}</span><span class="d wrap">${UI.esc(t.angle || "")}</span>${t.stale === true ? `<span class="d wrap" style="color:var(--warn-ink)">${UI.esc(lz("stale"))}</span>` : ""}</div><button type="button" class="lk" data-back="${t.id}" style="min-height:44px;padding:0 8px;flex:none">${UI.esc(lz("undo"))}</button></div>`).join("");
    box.querySelectorAll("[data-back]").forEach((b) => b.onclick = async () => {
      b.disabled = true;
      const rr = await UI.api("/api/topics-later", { body: { id: Number(b.dataset.back), undo: true } });
      b.disabled = false;
      if (!rr.ok) return UI.toast(rr.error || "되돌리지 못했어요");
      close(); UI.toast("오늘 소재로 되돌렸어요"); load();
    });
  } });
}
UI.$("#refresh").onclick = refresh;
/* [사장님 실측] 내 소재 넣기 — 제목 한 칸 + 접힌 «검색 키워드» + 채널 칩(연결된 채널만 · 하나면 숨김) → POST /api/topics-add → 바로 디렉터로(«넣고 → 고르고» 두 번 안 누르게) */
let chans = null;
async function addSheet() {
  await loadChans();
  UI.sheet(`<form id="tf"><div class="field"><label>무엇에 대해 쓸까요?</label><input class="input" name="title" maxlength="80" required placeholder="예: 에어프라이어 기름때 3분 청소" autocomplete="off"><div class="help"></div></div>
    <button type="button" class="row tap" id="kwT" style="padding:6px 0;min-height:44px"><div class="l"><span class="t" style="font-size:14px">검색 키워드 <span class="muted" style="font-weight:500">선택</span></span><span class="d">네이버 검색량을 볼 키워드가 제목과 다르면</span></div>${UI.chev}</button>
    <div class="field" id="kwF" hidden><label>검색 키워드</label><input class="input" name="keyword" maxlength="40" placeholder="예: 에어프라이어 청소" autocomplete="off"><div class="help"></div></div>
    ${chans.length > 1 ? `<div class="sec">어디에</div>${UI.chips("ch", chans.map((c) => [c, UI.chLabel(c)]), chans[0])}` : ""}
    <div id="dup"></div>
    <div class="cta"><button class="btn primary" type="submit">디렉터에게 보내기</button></div></form>`, { title: "내 소재 넣기", onOpen: (sh, close) => { UI.bindChips(sh);
      const kwT = sh.querySelector("#kwT"), kwF = sh.querySelector("#kwF"); kwT.onclick = () => { kwF.hidden = false; kwT.hidden = true; kwF.querySelector("input").focus(); };
      UI.form(sh.querySelector("#tf"), async (d, f) => {
        const body = { title: d.title.trim() }; if (d.keyword && d.keyword.trim()) body.keyword = d.keyword.trim(); const ch = chans.length > 1 ? UI.chipVal(sh, "ch") : chans[0]; if (ch) body.channelHint = ch;
        const r = await UI.api("/api/topics-add", { body });
        if (!r.ok) { if (r.step === "banned_category") return UI.fieldError(f, "title", r.error || "이 주제는 만들 수 없어요"); if (r.gated) return close();
          if (r.step === "duplicate" && (r.topic || r.existing)) { const ex = r.topic || r.existing; sh.querySelector("#dup").innerHTML = `<div class="banner" style="margin:4px 0 8px"><span>30일 안에 같은 소재가 있어요 · 그걸로 보낼까요?</span><button type="button" id="dupGo">그걸로</button></div>`; sh.querySelector("#dupGo").onclick = () => { close(); UI.go(`/app/director.html?topicId=${ex.id}&t=${encodeURIComponent(ex.title || "")}`); }; return; }
          if (r.step === "rate") return UI.fieldError(f, "title", r.error || "오늘은 여기까지예요 · 내일 다시 넣어 주세요");
          return UI.fieldError(f, "title", r.error || "소재를 넣지 못했어요"); }
        close(); UI.go(`/app/director.html?topicId=${r.topic.id}&t=${encodeURIComponent(r.topic.title || "")}`); }); } });
}
/* [P1R5] 레퍼런스 URL 한 칸 → POST /api/topics-reference {url} → template{name,structure,hook,style} · 코인 0 · 하루 3회 */
UI.$("#ref").onclick = () => UI.sheet(`<form id="rf"><div class="field"><label>쇼츠 · 릴스 링크</label><input class="input" name="url" type="url" required placeholder="https://youtube.com/shorts/…" autocomplete="off" inputmode="url"><div class="help"></div></div><p class="muted" style="margin:0 0 4px;font-size:13px">링크의 훅·서사·스타일을 구조로 배워 다음 소재부터 «구조: …»로 붙여요. 영상을 베끼지 않아요.</p>${templates.length ? `<div class="sec">배운 구조</div>${templates.map((x) => `<div class="row" style="padding-left:0;padding-right:0;min-height:44px"><div class="l"><span class="t" style="font-size:14px">${UI.esc(x.name)}</span><span class="d">${(x.structure || []).slice(0, 3).map(UI.esc).join(" → ")}</span></div></div>`).join("")}` : ""}<div class="cta"><button class="btn primary" type="submit">구조 배우기</button></div></form>`, { title: "레퍼런스로 구조 배우기", onOpen: (sh, close) => UI.form(sh.querySelector("#rf"), async (d, f) => {
  const r = await UI.api("/api/topics-reference", { body: { url: d.url.trim() } }); if (!r.ok) return r.gated ? close() : UI.fieldError(f, "url", r.error || "구조를 배우지 못했어요");
  close(); UI.done(`구조를 배웠어요 · ${r.template?.name || ""}`, load); }) });
/* [R9R10-A · A-3] 글 레퍼런스 — 영상 줄과 **같은 결**(행 하나 → 시트 · 주소 한 칸 · 코인 0). 시트는 ui.js 한 곳(UI.styleSheet) — 계정 상세·직접 쓰기·디렉터가 같은 것을 연다. */
UI.$("#refPost").onclick = () => UI.styleSheet({ accounts: textAccounts, accountId: textAccounts[0] ? textAccounts[0].id : null });
UI.pullToRefresh(load);   /* [R8 §6.1] 소재 목록은 «새 소식» 화면이라 당겨서 새로고침이 맞다 */
/* [R8-A2 §5D.1] 🔴 **셋은 «모드»가 아니라 «입구»다** — 미리 고르는 설정이 아니라 그때그때 고르는 것이다(사장님 «이것이 다 가능하게 하는 게 주요 골자»).
   «맡기기»는 이 화면 아래 소재 목록이 곧 그 길이라 **같은 화면 안에서** 데려간다(없는 화면으로 보내지 않는다). */
UI.$("#wayAi").onclick = () => { const g = UI.$("#topics"); if (g) g.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); };
await load();
/* «고치기»는 **만들어 둔 글이 몇 편인지**를 같이 말한다 — 못 세면 기본 문장을 그대로 둔다(«0편»을 지어내지 않는다 · AC-9). */
UI.api("/api/pieces-list?status=in_review").then((r) => { if (!r.ok) return; const n = (r.pieces || []).length;
  if (n) UI.$("#wayFixD").textContent = `지금 봐주세요가 ${n}편 있어요 · 열어서 고친 뒤 예약하면 돼요`; });
})();
</script>
