<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>올라간 글 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=22">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/app/schedule.html')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="sp"></span></div>
<div class="step-h"><h1>올라간 글</h1></div>
<div class="seg" id="seg"><button type="button" data-tab="all" class="on">전체</button><button type="button" data-tab="published">발행됨</button><button type="button" data-tab="awaiting_manual">직접 올리기</button></div>
<div id="list"><div class="group"><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=28"></script>
<script src="/js/mock.js?v=30"></script>
<script>
(async () => {
await UI.boot("schedule");
const EXT = '<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
let tab = UI.qs.get("status") || "all", posts = [];
const stuckOf = (p) => p.status === "awaiting_manual" || p.status === "failed";
const isVideoPost = (p) => UI.VIDEO_CH.includes(p.channel);   // [R7 §1.3] 영상은 «본문 복사»가 아니라 «파일 내려받기 → 앱에서 올리기 → 주소 적기»
const privateOf = (p) => p.status === "uploaded_private";                                  // [P1R5] 심사 전 비공개 업로드(posts.status · §7-1)
const processingOf = (p) => p.status === "publishing" && p.errorKind === "video_processing"; // [P1R5] 릴스 컨테이너 처리 중(retriable)
const dayOf = (p) => { if (!p.publishedAt) return ""; const k = (x) => new Date(x).toLocaleDateString("en-CA", { timeZone: "Asia/Seoul" }); const d = k(UI.utc(p.publishedAt)), t0 = k(new Date()), y = k(new Date(Date.now() - 86400e3)); return d === t0 ? "오늘" : d === y ? "어제" : UI.dateKST(p.publishedAt, { weekday: "short" }); };

function row(p) {
  if (privateOf(p)) return `<button type="button" class="row tap" data-id="${p.id}">${UI.mark(p.channel)}<div class="l"><span class="t">${UI.esc(p.title || "제목 없음")}</span><span class="d" style="display:flex;align-items:center;gap:6px;overflow:visible;flex-wrap:wrap">${UI.pill(UI.POST_STATUS, p.status)}<span>공개 전환 필요</span></span></div><a class="lk" href="${UI.studioUrl(p.channelRef)}" target="_blank" rel="noopener" style="font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;min-height:44px;display:inline-flex;align-items:center" data-stop>스튜디오 ›</a></button>`;
  /* [R8 §9] 🔴 **나간 뒤에 보이는 것이 이제 유일하게 남은 안전장치다** — 발행 직전 게이트까지 내렸으니(사장님 결정),
     «그때 이런 지적이 있었다»를 목록에서 바로 짚어 준다. 자동 승인이면 아무도 화면을 안 보고 나갔다는 뜻이라 더 그렇다.
     🔴 무게는 서버가 읽어 준 것(`riskHigh`)만 쓴다 — 옛 글은 무게가 없어 **개수만** 온다(없는 것을 «무거움»으로 지어내지 않는다). */
  const risk = p.riskCount ? `<span class="pill ${p.riskHigh ? "warn" : "off"}" style="margin-left:6px">${p.riskHigh ? "꼭 보세요" : "안내"} ${p.riskCount}</span>` : "";
  const right = stuckOf(p) ? UI.pill(UI.POST_STATUS, p.status) : processingOf(p) ? '<span class="pill off">처리 중</span>' : `${risk}<span class="r mut">${p.publishedAt ? UI.timeKST(p.publishedAt) : ""}</span>${p.externalUrl ? EXT : ""}`;
  const sub = stuckOf(p) ? UI.errk(p.errorKind) : processingOf(p) ? `${UI.chLabel(p.channel)}에서 처리하는 중 · 곧 다시 확인해요` : (p.stats && p.stats.views != null ? "조회 " + UI.num(p.stats.views) : UI.chLabel(p.channel));
  return `<button type="button" class="row tap" data-id="${p.id}">${UI.mark(p.channel)}<div class="l"><span class="t">${UI.esc(p.title || "제목 없음")}</span><span class="d">@${UI.esc(p.accountHandle || "")} · ${UI.esc(sub)}</span></div>${right}</button>`;
}
function render() {
  const shown = posts.filter((p) => tab === "all" || p.status === tab || (tab === "published" && privateOf(p)));
  UI.$$("#seg button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  const host = UI.$("#list");
  /* 🔴 신고는 **탭과 상관없이** 맨 위에 — 목록이 비어 있어도(거른 탭이어도) 보여야 한다. 겁주지 않는 한 문장 + 갈 길(§3·§9-1). */
  const live = notices.filter((n) => UI.TAKEDOWN_ACTIVE.includes(n.status));
  const tdBn = live.length ? `<div class="banner" style="margin:0 0 12px"><span>내 글에 들어온 신고가 ${live.length}건 있어요 · ${UI.takedownLead(live)}</span><button type="button" id="tdGo">확인하기</button></div>` : "";
  const bindTd = () => { const b = UI.$("#tdGo"); if (b) b.onclick = () => (live.length === 1 ? UI.takedownSheet(live[0], load) : UI.go("/app/settings.html#takedown")); };
  if (!shown.length) {
    const E = { all: ["아직 올라간 글이 없어요", "편성표를 확인해 보세요", "/app/schedule.html", "편성표 보기"], published: ["아직 올라간 글이 없어요", "예약한 시각이 되면 여기에 쌓여요", "/app/schedule.html", "편성표 보기"], awaiting_manual: ["직접 올릴 글이 없어요", "올리지 못한 글이 생기면 여기에 모아 드려요", null, null] }[tab];
    host.innerHTML = tdBn + `<div class="group"><div class="empty"><h3>${E[0]}</h3><p>${E[1]}</p>${E[2] ? `<a class="btn primary sm" href="${E[2]}">${E[3]}</a>` : ""}</div></div>`;
    bindTd(); return;
  }
  const stuck = shown.filter(stuckOf), priv = shown.filter(privateOf), proc = shown.filter(processingOf), rest = shown.filter((p) => !stuckOf(p) && !privateOf(p) && !processingOf(p));
  const days = [];
  for (const p of rest) { const k = dayOf(p); let g = days.find((x) => x.k === k); if (!g) { g = { k, list: [] }; days.push(g); } g.list.push(p); }
  host.innerHTML = tdBn + (stuck.length ? `<div class="group" style="margin-bottom:12px"><div class="gt">직접 올려야 해요 ${stuck.length}건</div>${stuck.map(row).join("")}</div>` : "")
    + (priv.length ? `<div class="group" style="margin-bottom:12px"><div class="gt">공개로 바꿔 주세요 ${priv.length}건</div>${priv.map(row).join("")}<p class="muted" style="margin:0 16px 12px;font-size:12.5px">유튜브 앱 심사 전엔 비공개로 올라가요 · 스튜디오에서 «공개»로 바꾸면 끝나요</p></div>` : "")
    + (proc.length ? `<div class="group" style="margin-bottom:12px"><div class="gt">처리 중 ${proc.length}건</div>${proc.map(row).join("")}</div>` : "")
    + days.map((g) => `<div class="group" style="margin-bottom:12px"><div class="gt">${UI.esc(g.k)} · ${g.list.length}건</div>${g.list.map(row).join("")}</div>`).join("");
  bindTd();
  UI.$$("#list .row[data-id]").forEach((b) => b.onclick = (e) => { if (e.target.closest("[data-stop]")) return; postSheet(posts.find((p) => p.id === Number(b.dataset.id))); });
}
/* [R8-A2 · DESIGN §5E.2 ③⑤] 🔴 **신고는 나간 뒤에 오는 일**이라 «올라간 글»에서 보여야 한다 — 설정 화면에만 두면
   나간 글을 보러 온 사람에게는 영영 안 닿는다(알림을 놓친 고객이 여기서 다시 만난다).
   🔴 신고가 붙은 글은 «이 글 내리기»(`post-retract`) 대신 **«신고에 답하기»** 를 준다: 같은 «내리기»가 두 문으로 갈리면
      고객이 어느 쪽을 눌러야 신고가 끝나는지 알 수 없다(신고를 끝내는 문은 `takedown-action` 쪽이다). */
let notices = [];
const noticeOf = (p) => notices.find((n) => UI.TAKEDOWN_ACTIVE.includes(n.status) && ((p.pieceId && n.pieceId === p.pieceId) || (p.externalUrl && n.externalUrl === p.externalUrl)));
async function load() {
  const [r, t] = await Promise.all([UI.api(`/api/posts-list?status=${tab === "published" ? "all" : tab}`), UI.api("/api/takedowns", { noGate: true })]);
  if (!r.ok) { UI.toast(r.error || "불러오지 못했어요"); return; }
  notices = t.ok ? (t.notices || []) : [];   /* 못 읽으면 빈 채로 둔다 — 없는 신고를 지어내지 않는다(AC-9) */
  posts = (r.posts || []).filter((p) => tab !== "published" || p.status === "published" || privateOf(p)); render();
}

/* [R8 §3 · DESIGN §5E] «내려 줘» — 고객이 누르면 **우리가 대신** 내린다(우리가 일방적으로 내리는 길은 만들지 않는다).
   🔴 `canRetract` 가 false 인 채널(유튜브·쓰레드 …)엔 **단추를 만들지 않는다** — 삭제 권한이 없어서다. 대신 그 글로 가는 길을 준다.
      없는 되돌리기를 단추로 만들면 눌러도 아무 일이 안 난다(티스토리 «광고 떼기»와 같은 규율).
   🔴 되돌릴 수 없는 동작이라 한 번 묻는다 — 단추 이름은 «네»가 아니라 **«내릴게요»**(무슨 일이 일어나는지 단추가 말한다).
   🔴 코인은 안 든다(retract 경로에 consume 호출 0 · 우리 잘못이든 마음이 바뀌었든 내리는 데 돈을 받지 않는다). */
const retractable = (p) => p.status === "published" && !p.retractedAt;
/* 🔴 신고가 붙은 글은 **«신고에 답하기» 한 문**으로 모은다 — 같은 «내리기»가 두 문이면 어느 쪽이 신고를 끝내는지 알 수 없다. */
const retractBtn = (p) => (noticeOf(p) ? '<button class="btn ghost" type="button" id="tdAns" style="color:var(--danger-ink)">신고에 답하기</button>'
  : retractable(p) && p.canRetract ? `<button class="btn ghost" type="button" id="rt" style="color:var(--danger-ink)">이 글 내리기</button>` : "");
const retractSay = (p) => (p.retractedAt ? `<p class="muted" style="margin:8px 0 0;font-size:12.5px">${UI.esc(UI.dateKST(p.retractedAt))} ${UI.esc(UI.timeKST(p.retractedAt))}에 내렸어요.</p>`
  : retractable(p) && !p.canRetract ? `<p class="muted" style="margin:8px 0 0;font-size:12.5px">${UI.esc(UI.chLabel(p.channel))}${UI.josa(UI.chLabel(p.channel))} 우리가 대신 내려 드릴 수 없어요 — 위 «올라간 글 열기»로 가서 직접 내려 주세요.</p>` : "");
function bindRetract(p, sh, close) {
  const ans = sh.querySelector("#tdAns");
  if (ans) { ans.onclick = () => { const n = noticeOf(p); close(); setTimeout(() => UI.takedownSheet(n, load), 300); }; return; }
  const b = sh.querySelector("#rt"); if (!b) return;
  b.onclick = () => UI.confirmRow(sh.querySelector("#rtc"), "채널에서 이 글이 지워져요. 되돌릴 수 없고, 코인은 들지 않아요.", async () => {
    b.disabled = true;
    const r = await UI.api("/api/post-retract", { body: { postId: p.id } });
    b.disabled = false;
    const say = UI.esc(r.message || r.error || "");
    close();
    setTimeout(() => UI.sheet(`<p class="muted" style="margin:0 0 16px">${say}</p><div class="cta">${r.openUrl ? `<a class="btn primary" href="${UI.esc(r.openUrl)}" target="_blank" rel="noopener">그 글 열기</a>` : '<button class="btn secondary" type="button" data-ok>알겠어요</button>'}</div>`,
      { title: r.ok ? "" : "내리지 못했어요", onOpen: (s2, c2) => { const ok = s2.querySelector("[data-ok]"); if (ok) ok.onclick = c2; const bg = s2.previousSibling; if (bg) bg.addEventListener("click", load); } }), 300);
    await load();
  }, "내릴게요");
}
/* 글 시트(열기 · 성과 · 본문 복사 · 실패 사유 · [P1R5] 비공개 업로드 → 스튜디오) */
function postSheet(p) {
  if (!p) return;
  const s = p.stats || {};
  const stat = [s.views != null ? `조회 ${UI.num(s.views)}` : null, s.likes != null ? `좋아요 ${UI.num(s.likes)}` : null, s.comments != null ? `댓글 ${UI.num(s.comments)}` : null].filter(Boolean).join(" · ");
  UI.sheet(`<div class="row" style="padding-left:0;padding-right:0">${UI.mark(p.channel)}<div class="l"><span class="t wrap">${UI.esc(p.title || "제목 없음")}</span><span class="d">@${UI.esc(p.accountHandle || "")} · ${UI.esc(UI.chLabel(p.channel))}</span></div>${processingOf(p) ? '<span class="pill off">처리 중</span>' : UI.pill(UI.POST_STATUS, p.status)}</div>
    ${noticeOf(p) ? `<div class="banner" style="margin:4px 0 8px"><span>이 글에 «${UI.esc(noticeOf(p).kindLabel)}» 신고가 들어왔어요 · ${UI.esc(noticeOf(p).reason || "")}</span></div>` : ""}
    ${stuckOf(p) ? `<div class="banner" style="margin:4px 0 8px"><span>${UI.esc(UI.errk(p.errorKind))}${p.failReason ? " · " + UI.esc(p.failReason) : ""}</span></div>` : ""}
    ${privateOf(p) ? `<div class="banner" style="margin:4px 0 8px"><span>심사 전엔 비공개로 올라가요 · 유튜브 스튜디오에서 «공개»로 바꾸면 사람들에게 보여요</span></div>` : ""}
    ${processingOf(p) ? `<p class="muted" style="margin:4px 0 8px;font-size:13.5px">${UI.esc(UI.chLabel(p.channel))}에서 영상을 처리하는 중이에요 · 몇 분 뒤 자동으로 다시 올려요</p>` : ""}
    ${p.publishedAt ? `<div class="kv" style="padding-left:0;padding-right:0"><span class="k">올라간 시각</span><span class="v">${UI.dateKST(p.publishedAt)} ${UI.timeKST(p.publishedAt)}</span></div>` : ""}
    ${p.publishedVia ? `<div class="kv" style="padding-left:0;padding-right:0"><span class="k">올린 방법</span><span class="v">${p.publishedVia === "runner" ? "내 PC 프로그램" : p.publishedVia === "manual" ? "직접 올림" : "채널 연동"}</span></div>` : ""}
    ${stat ? `<div class="kv" style="padding-left:0;padding-right:0"><span class="k">성과</span><span class="v">${UI.esc(stat)}</span></div>` : ""}
    ${s.lastSyncAt ? `<p class="muted" style="margin:8px 0 0;font-size:12.5px">${UI.esc(UI.ago(s.lastSyncAt))} 기준이에요 · 하루에 몇 번씩 다시 세어요</p>` : ""}
    ${p.publishedAt && p.alive === false ? `<div class="banner" style="margin:8px 0 0"><span>채널에서 글이 보이지 않아요 · 지워졌을 수 있어요</span></div>` : ""}
    ${p.riskCount ? `<div class="banner ${p.riskHigh ? "" : "info"}" style="margin:8px 0 0"><span>이 글엔 못 지킨 게 ${p.riskCount}가지 있어요 · 지금이라도 고치거나 내릴 수 있어요</span>${p.pieceId ? `<a href="/app/piece.html?id=${p.pieceId}" style="font-weight:700;text-decoration:underline;white-space:nowrap">무엇인지 보기</a>` : ""}</div>` : ""}
    <div class="cta" style="flex-direction:column">
      ${privateOf(p) ? `<a class="btn primary" href="${UI.studioUrl(p.channelRef)}" target="_blank" rel="noopener">유튜브 스튜디오 열기</a>` : ""}
      ${p.externalUrl ? `<a class="btn ${privateOf(p) ? "secondary" : "primary"}" href="${UI.esc(p.externalUrl)}" target="_blank" rel="noopener">${privateOf(p) ? "올라간 영상 보기(비공개)" : "올라간 글 열기"}</a>` : ""}
      ${stuckOf(p) && isVideoPost(p) ? `<button class="btn secondary" type="button" id="vdl2">영상 내려받기</button>` : ""}
      ${stuckOf(p) ? `<button class="btn ${p.externalUrl ? "secondary" : "primary"}" type="button" id="cp">${isVideoPost(p) ? "올린 주소 적기" : "본문 복사하기"}</button>` : ""}
      ${p.pieceId ? `<a class="btn ghost" href="/app/piece.html?id=${p.pieceId}">${privateOf(p) || processingOf(p) ? "영상 보기" : "글 보기"}</a>` : ""}
      ${retractBtn(p)}
    </div>
    <div id="rtc"></div>${retractSay(p)}
    ${stuckOf(p) ? `<p class="muted" id="vdlNote2" style="margin:4px 0 0;font-size:13px">${isVideoPost(p) ? `영상을 받아 ${UI.esc(UI.chLabel(p.channel))} 앱에서 올린 뒤, 그 주소를 적어 주세요.` : `복사한 본문을 ${UI.esc(UI.chLabel(p.channel))} 에 붙여 넣으면 그대로 올라가요.`}</p>` : ""}`,
    { title: "", onOpen: (sh, close) => {
      bindRetract(p, sh, close);
      const dl2 = sh.querySelector("#vdl2"); if (dl2) dl2.onclick = async () => { dl2.disabled = true; await UI.videoDownload(p.pieceId, sh.querySelector("#vdlNote2")); dl2.disabled = false; };
      const cp = sh.querySelector("#cp"); if (!cp) return;
      if (isVideoPost(p)) { cp.onclick = () => { close(); UI.markPublishedSheet({ id: p.pieceId, channel: p.channel }, load); }; return; }
      cp.onclick = async () => {
        cp.disabled = true; const r = await UI.api(`/api/pieces-get?id=${p.pieceId}`); cp.disabled = false;
        if (!r.ok) return UI.toast(r.error || "본문을 가져오지 못했어요");
        const el = document.createElement("div"); el.innerHTML = r.piece.bodyHtml || "";
        el.querySelectorAll(".disclosure small").forEach((x) => x.remove());
        const text = `${r.piece.title || ""}\n\n${(el.innerText || el.textContent || "").trim()}`;
        UI.toast((await UI.copy(text)) ? "본문을 복사했어요" : "복사하지 못했어요");
      };
    } });
}
UI.$$("#seg button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; load(); });
await load();
})();
</script>
</body>
</html>
