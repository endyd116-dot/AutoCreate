<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=3">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="sp"></span><a class="ic" href="/app/notifications.html" aria-label="알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg></a></div>
    <div id="trialBanner" hidden></div>
    <div class="hl">
      <div class="say">오늘</div>
      <div class="num"><em id="today">0원</em> 벌었어요</div>
      <div class="tip" id="tip"><span class="sk" style="display:inline-block;width:160px"></span></div>
    </div>
    <div class="group" id="todo"><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div>
    <div class="group" id="slots"><div class="gt">오늘 편성</div><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div>
    <div class="group">
      <div class="row"><div class="l"><span class="t">자동 편성</span><span class="d" id="autoDesc">소재부터 발행까지 알아서</span></div><button class="toggle" id="auto" type="button" aria-checked="false" aria-label="자동 편성"></button></div>
    </div>
    <div id="notices"></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=3"></script>
<script src="/js/mock.js?v=2"></script>
<script>
(async () => {
  const me = await UI.boot("home"); if (!me) return;
  const v = UI.qs.get("verify");
  if (v === "ok") UI.toast("이메일 인증이 끝났어요"); else if (v === "used") UI.toast("이미 인증된 링크예요"); else if (v) UI.toast("인증 링크가 유효하지 않아요");
  const r = await UI.api("/api/home-summary");
  if (!r.ok) { UI.toast(r.error || "불러오지 못했어요"); return; }
  UI.countUp(UI.$("#today"), r.revenue.today);
  const diff = r.revenue.month - r.revenue.lastMonthSameDay;
  UI.$("#tip").innerHTML = r.revenue.month || r.revenue.lastMonthSameDay
    ? `이번 달 ${UI.won(r.revenue.month)} · 지난달 같은 날보다 <b>${diff >= 0 ? "+" : "−"}${UI.won(Math.abs(diff))}</b>`
    : "수익 매체를 연결하면 여기에 매일 쌓여요";
  // 체험 배너
  if (r.trial.status === "trial") { const b = UI.$("#trialBanner"); b.hidden = false; b.className = "banner info"; b.innerHTML = `<span>무료 체험 ${r.trial.daysLeft}일 남았어요 · 코인 ${UI.num(r.coins)}개</span><a href="/app/plans.html">요금제 보기</a>`; }
  else if (r.trial.status === "readonly") { const b = UI.$("#trialBanner"); b.hidden = false; b.className = "banner"; b.innerHTML = `<span>체험이 끝났어요. 이어서 쓰려면 요금제를 골라 주세요</span><a href="/app/plans.html">요금제</a>`; }
  // 해야 할 일
  const todo = UI.$("#todo");
  if (!r.todo.length) todo.innerHTML = `<div class="row"><span class="mk money">✓</span><div class="l"><span class="t">오늘 할 일이 없어요</span><span class="d">편성표대로 알아서 돌아가고 있어요</span></div></div>`;
  else todo.innerHTML = `<div class="gt">해야 할 일 ${r.todo.length}</div>` + r.todo.map((t) => `<a class="row tap" href="${t.link}">${UI.kindMark(t.kind, t.tone)}<div class="l"><span class="t wrap">${UI.esc(t.title)}</span><span class="d wrap">${UI.esc(t.desc)}</span></div>${UI.chev}</a>`).join("");
  // 알림 안 읽음 표시(종)
  if (r.unread) { const bell = UI.$(".appbar .ic"); if (bell) { bell.style.position = "relative"; bell.insertAdjacentHTML("beforeend", '<span class="dot danger" style="position:absolute;top:7px;right:7px"></span>'); bell.setAttribute("aria-label", `알림 ${r.unread}개`); } }
  // 오늘 편성
  const PILL = { ...UI.SLOT_STATUS, scheduled: ["off", "예약"], approved: ["off", "예약"] };
  const slots = UI.$("#slots");
  slots.innerHTML = `<div class="gt">오늘 편성 <a href="/app/schedule.html">편성표</a></div>` + (r.todaySlots.length
    ? r.todaySlots.map((s) => { const p = PILL[s.status] || ["off", s.status]; return `<a class="row tap" href="${s.status === "in_review" && s.pieceId ? `/app/piece.html?id=${s.pieceId}` : "/app/schedule.html"}"><span class="mk ${s.channel}">${(UI.CH[s.channel] || {}).mark || "?"}</span><div class="l"><span class="t">${UI.esc(s.title || "소재 정하는 중")}</span><span class="d">${s.handle ? "@" + UI.esc(s.handle) : "계정 자동"} · ${UI.timeKST(s.publishAt) || "시간 자동"}</span></div><span class="pill ${p[0]}">${p[1]}</span></a>`; }).join("")
    : `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">오늘 나갈 글이 없어요</span><span class="d">자동 편성을 켜면 내일부터 채워져요</span></div></div>`);
  // 자동 편성 토글
  const tg = UI.$("#auto"); tg.setAttribute("aria-checked", String(!!r.auto.enabled));
  const autoDesc = async () => {
    if (!r.auto.rules) return "규칙을 만들면 켤 수 있어요";
    // «다음 글은 내일 07:30» — 편성표에서 앞으로 나갈 첫 슬롯 하나만 본다
    const d0 = new Date(), d1 = new Date(Date.now() + 14 * 86400e3);
    const ymd = (d) => d.toLocaleDateString("en-CA", { timeZone: "Asia/Seoul" });
    const s = await UI.api(`/api/slots-list?from=${ymd(d0)}&to=${ymd(d1)}`);
    const next = s.ok ? (s.slots || []).filter((x) => x.publishAt && new Date(x.publishAt) > new Date() && !["skipped", "published"].includes(x.status)).sort((a, b) => a.publishAt.localeCompare(b.publishAt))[0] : null;
    if (!next) return `규칙 ${r.auto.rules}개로 돌아가요`;
    const day = ymd(new Date(next.publishAt)) === ymd(d0) ? "오늘" : ymd(new Date(next.publishAt)) === ymd(new Date(Date.now() + 86400e3)) ? "내일" : UI.dateKST(next.publishAt);
    return `규칙 ${r.auto.rules}개로 돌아가요 · 다음 글은 ${day} ${UI.timeKST(next.publishAt)}`;
  };
  UI.$("#autoDesc").textContent = r.auto.rules ? `규칙 ${r.auto.rules}개로 돌아가요` : "규칙을 만들면 켤 수 있어요";
  autoDesc().then((t) => { UI.$("#autoDesc").textContent = t; });
  UI.toggle(tg, async (on) => {
    if (on && !r.auto.rules) { UI.toast("먼저 편성 규칙을 만들어 주세요"); setTimeout(() => UI.go("/app/schedule.html"), 600); return false; }
    const s = await UI.api("/api/tenant-settings", { body: { autoSchedule: on } });
    if (!s.ok) { UI.toast(s.error || "저장하지 못했어요"); return false; }
    UI.toast(on ? "자동 편성을 켰어요" : "자동 편성을 껐어요");
  });
  if (r.notices.length) UI.$("#notices").innerHTML = r.notices.map((n) => `<div class="banner ${n.kind === "incident" ? "" : "info"}"><span>${UI.esc(n.title)}</span></div>`).join("");
})();
</script>
</body>
</html>
