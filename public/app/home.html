<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홈 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=17">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="sp"></span><a class="ic" href="/app/notifications.html" aria-label="알림"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg></a></div>
    <div id="notice" hidden></div>
    <a class="hl" href="/app/revenue.html" style="display:block">
      <div class="say">오늘</div>
      <div class="num" id="hlnum"><span class="sk" style="display:inline-block;width:60%"></span></div>
      <div class="tip" id="tip"><span class="sk" style="display:inline-block;width:160px"></span></div>
    </a>
    <div class="banner" id="closeBn" hidden><span id="closeBnT"></span><button type="button" id="closeUndo">되돌리기</button></div>
    <div class="banner" id="autoBn" hidden><span id="autoBnT">자동 편성이 꺼져 있어요</span><button type="button" id="autoOn">켜기</button></div>
    <div class="group" id="todo"><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div>
    <div class="group" id="slots"><div class="gt">오늘 편성</div><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div>
    <div class="group">
      <div class="row"><div class="l"><span class="t">자동 편성</span><span class="d" id="autoDesc">소재부터 발행까지 알아서</span></div><button class="toggle" id="auto" type="button" aria-checked="false" aria-label="자동 편성"></button></div>
    </div>
    <div id="notices"></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=16"></script>
<script src="/js/mock.js?v=16"></script>
<script>
(async () => {
  const me = await UI.boot("home"); if (!me) return;
  const v = UI.qs.get("verify");
  if (v === "ok") UI.toast("이메일 인증이 끝났어요"); else if (v === "used") UI.toast("이미 인증된 링크예요"); else if (v) UI.toast("인증 링크가 유효하지 않아요");
  // [P1R4] 공지·장애 배너 — 홈 상단 1줄 · 기간 안에서만 · 닫으면 그 공지는 다시 안 보여요(localStorage)
  UI.api("/api/notices", { noGate: true }).then((n) => {
    if (!n.ok) return; const nowT = Date.now(); let seen = []; try { seen = JSON.parse(localStorage.getItem("acNoticeSeen") || "[]"); } catch { /* empty */ }
    const live = (n.notices || []).filter((x) => (!x.startsAt || UI.utc(x.startsAt).getTime() <= nowT) && (!x.endsAt || UI.utc(x.endsAt).getTime() >= nowT) && !seen.includes(x.id));
    const pick = live.find((x) => x.kind === "incident") || live[0]; if (!pick) return;
    const el = UI.$("#notice"); el.hidden = false; el.className = "banner" + (pick.kind === "incident" ? "" : " info");
    el.innerHTML = `<span>${UI.esc(pick.title)}</span><button type="button" aria-label="닫기" style="text-decoration:none;font-size:18px;line-height:1">×</button>`;
    el.querySelector("button").onclick = () => { el.hidden = true; try { localStorage.setItem("acNoticeSeen", JSON.stringify([...seen, pick.id])); } catch { /* empty */ } };
  });
  /* [R7 §3.1] 탈퇴를 신청해 두면 홈에서도 계속 보인다 — 예약해 놓고 잊어서 30일 뒤 조용히 사라지는 일이 없게.
     🔴 «보기만» 상태(readonly)일 때만 물어본다 — 체험이 끝난 집과 탈퇴한 집이 서버에선 같은 상태라, 어느 쪽인지는 이 한 번으로만 갈린다. */
  if (me.tenant && me.tenant.status === "readonly") UI.api("/api/account-close", { noGate: true }).then((c) => {
    if (!c.ok || !c.closed) return;
    const bn = UI.$("#closeBn"); bn.hidden = false;
    UI.$("#closeBnT").textContent = `${UI.dateKST(c.purgeAt)}에 자료가 지워져요${c.daysLeft != null ? ` · ${c.daysLeft}일 남았어요` : ""}`;
    UI.$("#closeUndo").onclick = async (e) => { e.target.disabled = true;
      const rr = await UI.api("/api/account-restore", { body: {}, noGate: true });
      if (!rr.ok) { e.target.disabled = false; return UI.toast(rr.error || "되돌리지 못했어요"); }
      bn.hidden = true; UI.toast("탈퇴를 되돌렸어요 · 하던 대로 쓰시면 돼요"); };
  });
  const r = await UI.api("/api/home-summary");
  if (!r.ok) { UI.toast(r.error || "불러오지 못했어요"); return; }
  // [P1R3] 오늘 번 돈 — 확정은 진하게, 예상은 회색 작게. 🔴 둘을 합쳐서 한 숫자로 그리지 않는다(§9.3)
  const rev = r.revenue || {};
  const conf = rev.todayConfirmedKrw != null ? rev.todayConfirmedKrw : (rev.today || 0);
  const est = rev.todayEstimatedKrw || 0;
  const yst = rev.yesterdayKrw;
  const mon = rev.monthKrw != null ? rev.monthKrw : (rev.month || 0);
  const numEl = UI.$("#hlnum");
  if (conf || est) {
    numEl.innerHTML = `<em id="today">0원</em> 벌었어요${est ? ` <span class="est">예상 ${UI.won(est)}</span>` : ""}`;
    UI.countUp(UI.$("#today"), conf);
  } else numEl.textContent = (mon || yst) ? "오늘은 아직이에요" : "아직 연결된 곳이 없어요";
  const tip = UI.$("#tip");
  if (yst != null && (conf || est || mon)) { const d = conf - yst;
    tip.innerHTML = yst ? `이번 달 ${UI.won(mon)} · 어제보다 <b class="${d >= 0 ? "up" : ""}">${d >= 0 ? "+" : "−"}${UI.won(Math.abs(d))}</b>` : `이번 달 ${UI.won(mon)}`; // [v4] 증가만 초록
  } else if (mon || rev.lastMonthSameDay) { const d2 = mon - (rev.lastMonthSameDay || 0);
    tip.innerHTML = `이번 달 ${UI.won(mon)} · 지난달 같은 날보다 <b class="${d2 >= 0 ? "up" : ""}">${d2 >= 0 ? "+" : "−"}${UI.won(Math.abs(d2))}</b>`;
  } else tip.textContent = "수익 매체를 연결하면 여기에 매일 쌓여요";
  // 체험(DESIGN §12.3): 배너 없이 «해야 할 일» 행 하나 — D-3 이하일 때만 · 끝났으면 «요금제를 골라 주세요» · 그 전엔 홈에 아무것도 없다
  const trial = r.trial || {};
  if (trial.status === "trial" && trial.daysLeft != null && trial.daysLeft <= 3) r.todo.unshift({ kind: "coin", title: `무료 체험이 ${trial.daysLeft}일 남았어요`, desc: "이어서 쓰려면 요금제를 골라 주세요", link: "/app/plan.html", tone: "warn" });
  /* [여정 점검 13] «체험이 끝났어요»는 **서버 todo(kind:"plan")가 정본**이다 — 화면이 같은 줄을 또 얹어 두 줄로 보였다.
     체험 D-3 남음은 서버가 안 보내므로 그 줄만 화면이 얹는다. */
  // 해야 할 일
  const todo = UI.$("#todo");
  if (!r.todo.length) todo.innerHTML = `<div class="row"><span class="mk money">✓</span><div class="l"><span class="t">오늘 할 일이 없어요</span><span class="d">편성표대로 알아서 돌아가고 있어요</span></div></div>`;
  /* [R7 §1.4] 서버가 주는 count(몇 건인지)·pieceId(1건이면 그 글로 바로) 를 그대로 쓴다 — 화면이 세거나 고르지 않는다 */
  else todo.innerHTML = r.todo.map((t) => { const href = t.pieceId ? `/app/piece.html?id=${t.pieceId}` : t.link;
    return `<a class="row tap" href="${href}">${UI.kindMark(t.kind, t.tone)}<div class="l"><span class="t wrap">${UI.esc(t.title)}</span><span class="d wrap">${UI.esc(t.desc)}</span></div>${t.count > 1 ? `<span class="pill ${t.tone === "warn" || t.tone === "danger" ? "warn" : "off"}">${UI.num(t.count)}건</span>` : ""}${UI.chev}</a>`; }).join("");
  // 알림 안 읽음 표시(종)
  if (r.unread) { const bell = UI.$(".appbar .ic"); if (bell) { bell.style.position = "relative"; bell.insertAdjacentHTML("beforeend", '<span class="dot danger" style="position:absolute;top:7px;right:7px"></span>'); bell.setAttribute("aria-label", `알림 ${r.unread}개`); } }
  // 오늘 편성
  const PILL = { ...UI.SLOT_STATUS, scheduled: ["off", "예약"], approved: ["off", "예약"] };
  const slots = UI.$("#slots");
  slots.innerHTML = `<div class="gt">오늘 편성 <a href="/app/schedule.html">전체</a></div>` + (r.todaySlots.length
    ? r.todaySlots.map((s) => { const p = PILL[s.status] || ["off", s.status]; return `<a class="row tap" href="${s.status === "in_review" && s.pieceId ? `/app/piece.html?id=${s.pieceId}` : "/app/schedule.html"}"><span class="mk ${s.channel}">${(UI.CH[s.channel] || {}).mark || "?"}</span><div class="l"><span class="t">${UI.esc(s.title || "소재 정하는 중")}</span><span class="d">${s.handle ? "@" + UI.esc(s.handle) : "계정 자동"} · ${UI.timeKST(s.publishAt) || "시간 자동"}</span></div><span class="pill ${p[0]}">${p[1]}</span></a>`; }).join("")
    : `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">오늘 나갈 글이 없어요</span><span class="d">자동 편성을 켜면 다음 자리부터 채워져요</span></div></div>`);
  // [사장님 실측] 규칙이 있는데 자동 편성이 꺼져 있으면 맨 위 한 줄(홈 토글과 같은 API)
  const bn = UI.$("#autoBn"); bn.hidden = !(r.auto.rules && !r.auto.enabled);
  if (!bn.hidden) { UI.$("#autoBnT").textContent = `자동 편성이 꺼져 있어요 — 켜면 ${(r.auto.produceLeadDays) || 3}일 전에 글을 만들어 드려요`;
    UI.$("#autoOn").onclick = async (e) => { e.target.disabled = true; const s = await UI.api("/api/tenant-settings", { body: { autoSchedule: true } }); e.target.disabled = false; if (!s.ok) return UI.toast(s.error || "켜지 못했어요"); UI.toast("자동 편성을 켰어요"); bn.hidden = true; UI.$("#auto").setAttribute("aria-checked", "true"); }; }
  // 자동 편성 토글
  const tg = UI.$("#auto"); tg.setAttribute("aria-checked", String(!!r.auto.enabled));
  const autoDesc = async () => {
    if (!r.auto.rules) return "규칙을 만들면 켤 수 있어요";
    // «다음 글은 내일 07:30» — 편성표에서 앞으로 나갈 첫 슬롯 하나만 본다
    const d0 = new Date(), d1 = new Date(Date.now() + 14 * 86400e3);
    const ymd = (d) => d.toLocaleDateString("en-CA", { timeZone: "Asia/Seoul" });
    const s = await UI.api(`/api/slots-list?from=${ymd(d0)}&to=${ymd(d1)}`);
    const next = s.ok ? (s.slots || []).filter((x) => x.publishAt && new Date(x.publishAt) > new Date() && !["skipped", "published"].includes(x.status)).sort((a, b) => a.publishAt.localeCompare(b.publishAt))[0] : null;
    const head = r.auto.enabled ? `규칙 ${r.auto.rules}개로 돌아가요` : `규칙 ${r.auto.rules}개 · 지금은 꺼져 있어요`;   // [R6.5 C] 꺼져 있는데 «돌아가요» 라고 말하지 않는다(위 배너와 어긋난다)
    if (!next) return head;
    const day = ymd(new Date(next.publishAt)) === ymd(d0) ? "오늘" : ymd(new Date(next.publishAt)) === ymd(new Date(Date.now() + 86400e3)) ? "내일" : UI.dateKST(next.publishAt);
    return `${head} · 다음 글은 ${day} ${UI.timeKST(next.publishAt)}`;
  };
  UI.$("#autoDesc").textContent = r.auto.rules ? (r.auto.enabled ? `규칙 ${r.auto.rules}개로 돌아가요` : `규칙 ${r.auto.rules}개 · 지금은 꺼져 있어요`) : "규칙을 만들면 켤 수 있어요";
  autoDesc().then((t) => { UI.$("#autoDesc").textContent = t; });
  UI.toggle(tg, async (on) => {
    if (on && !r.auto.rules) { UI.toast("먼저 편성 규칙을 만들어 주세요"); setTimeout(() => UI.go("/app/schedule.html"), 600); return false; }
    const s = await UI.api("/api/tenant-settings", { body: { autoSchedule: on } });
    if (!s.ok) { UI.toast(s.error || "저장하지 못했어요"); return false; }
    UI.toast(on ? "자동 편성을 켰어요" : "자동 편성을 껐어요");
  });
  if (r.notices.length) UI.$("#notices").innerHTML = r.notices.map((n) => `<div class="banner ${n.kind === "incident" ? "" : "info"}"><span>${UI.esc(n.title)}</span></div>`).join("");
  /* [R8 §6.1] 당겨서 새로고침 — 홈은 «오늘 얼마 벌었나»를 확인하러 다시 여는 화면이라 이 손짓이 가장 자연스럽다.
     🔴 홈은 한 번에 그리는 화면(부분 갱신 함수가 없다)이라 통째로 다시 읽는다 — 화면이 절반만 새것이 되는 것보다 낫다. */
  UI.pullToRefresh(() => new Promise((ok) => { location.reload(); setTimeout(ok, 3000); }));
})();
</script>
</body>
</html>
