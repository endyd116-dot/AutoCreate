<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 계정 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=19">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ph"></span><span class="sp"></span></div>
<div class="hl"><div class="say">안녕하세요</div><div class="num" id="name">…</div><div class="tip" id="plan"></div></div>
<div class="group" id="accounts"><div class="gt">연결한 계정 <a href="/app/accounts.html">관리</a></div><div class="empty"><span class="mk soft">+</span><h3>첫 계정을 연결해 보세요</h3><p id="accEmpty">지금 열려 있는 채널 하나면 시작할 수 있어요.</p><a class="btn primary sm" href="/app/accounts.html">계정 연결</a></div></div>
<div class="group">
  <div class="gt">올린 글 · 내 PC</div>
  <a class="row tap" href="/app/posts.html"><span class="mk soft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span><div class="l"><span class="t">올라간 글</span><span class="d" id="postsDesc">채널에 올라간 글과 조회수</span></div><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></a>
  <a class="row tap" href="/app/runner.html"><span class="mk soft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg></span><div class="l"><span class="t">내 PC 프로그램</span><span class="d" id="runnerDesc">네이버·티스토리 글을 대신 올려요</span></div><span id="runnerPill"></span><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></a>
</div>
<div class="group">
  <div class="gt">요금제 · 코인</div>
  <a class="row tap" href="/app/plan.html"><span class="mk soft">₩</span><div class="l"><span class="t" id="planName">체험</span><span class="d" id="planDesc"></span></div><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></a>
  <a class="row tap" href="/app/coins.html"><span class="mk money">C</span><div class="l"><span class="t">코인 <span id="coins">0</span>개</span><span class="d">1코인 = 500원 · 충전분은 1년</span></div><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></a>
</div>
<div class="group">
  <div class="gt">설정</div>
  <a class="row tap" href="/app/settings.html"><div class="l"><span class="t">설정</span><span class="d">영상 만들기 · 비밀번호 · 기기 · 로그아웃</span></div><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></a>
  <a class="row tap" href="/app/support.html"><div class="l"><span class="t">문의하기</span><span class="d">막히는 게 있으면 바로 알려 주세요</span></div><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></a>
  <button class="row tap" type="button" id="ref"><div class="l"><span class="t">친구 초대</span><span class="d" id="refd">코드를 나눠 주면 둘 다 코인을 받아요</span></div><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button>
</div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=22"></script>
<script src="/js/mock.js?v=21"></script>
<script>
(async () => {
const me = await UI.boot("account"); if (!me) return;
/* [P1R6] 추천인 — 내 코드 · 초대 목록(보상은 «피추천인 첫 유료 결제»부터 · 그전엔 «아직») */
(async () => { const r = await UI.api("/api/referral"); if (!r.ok) return;
  const done = (r.invited || []).filter((x) => x.rewarded).length;
  UI.$("#refd").textContent = `${r.code} · 초대 ${(r.invited || []).length}명${done ? ` · 코인 받은 건 ${done}명` : ""}`;
  UI.$("#ref").onclick = () => UI.sheet(`<div class="confirm" style="padding-top:0"><div class="q">내 추천 코드</div><div class="big" style="font-family:ui-monospace,monospace;letter-spacing:.08em">${UI.esc(r.code)}</div></div>
    <p class="muted" style="margin:0 0 8px;font-size:13px">친구가 가입할 때 이 코드를 넣으면, 친구의 <b style="color:var(--ink)">첫 결제가 끝난 뒤</b> 둘 다 ${r.rewardCoins}코인을 받아요. 체험만 하면 코인은 안 나가요.</p>
    ${(r.invited || []).length ? (r.invited || []).map((x) => `<div class="row" style="padding-left:0;padding-right:0;min-height:44px"><div class="l"><span class="t" style="font-size:14px">${UI.esc(x.tenantName)}</span><span class="d">${UI.dateKST(x.at)} 가입</span></div>${x.rewarded ? '<span class="pill ok">코인 받음</span>' : '<span class="pill off">첫 결제 전</span>'}</div>`).join("") : '<p class="muted" style="margin:0;font-size:13px">아직 초대한 사람이 없어요.</p>'}
    <div class="cta"><button class="btn primary" type="button" id="cp">코드 복사하기</button></div>`, { title: "친구 초대", onOpen: (sh) => { sh.querySelector("#cp").onclick = async () => UI.toast((await UI.copy(r.code)) ? "복사했어요 · 친구에게 보내 주세요" : "복사하지 못했어요"); } });
})();
UI.$("#name").textContent = `${me.user.name || me.user.email}님`;
const P = { trial: "체험", starter: "Starter", pro: "Pro", agency: "Agency" };
UI.$("#planName").textContent = P[me.tenant.planKey] || me.tenant.planKey;
UI.$("#planDesc").textContent = me.tenant.status === "trial" ? `무료 체험 ${me.tenant.trialDaysLeft}일 남음` : me.tenant.status === "active" ? "이용 중" : "이용 정지";
UI.$("#plan").textContent = me.tenant.status === "trial" ? `무료 체험 ${me.tenant.trialDaysLeft}일 남았어요` : "";
UI.$("#coins").textContent = UI.num(me.coins);
if (me.impersonation) UI.$$(".group").forEach((g) => { if (g.textContent.includes("요금제 · 코인")) g.hidden = true; }); // [P1R4] 원격접속 중 결제 경로 숨김
// 내 PC 프로그램 상태(켜짐/꺼짐) · 올라간 글 수
UI.api("/api/runner-list").then((rl) => {
  if (!rl.ok) return;
  const on = (rl.devices || []).filter((d) => d.status === "online").length; const total = (rl.devices || []).length;
  UI.$("#runnerPill").outerHTML = total ? `<span class="pill ${on ? "ok" : "off"}">${on ? "켜짐" : "꺼짐"}</span>` : `<span class="pill off">연결 전</span>`;
  UI.$("#runnerDesc").textContent = !total ? "연결하면 네이버·티스토리 글이 자동으로 올라가요" : on ? `${total}대 연결됨 · 지금 켜져 있어요` : `${total}대 연결됨 · 지금 꺼져 있어요`;
});
UI.api("/api/posts-list?status=published").then((pl) => { if (pl.ok && pl.posts) UI.$("#postsDesc").textContent = pl.posts.length ? `지금까지 ${UI.num(pl.posts.length)}건 올라갔어요` : "아직 올라간 글이 없어요"; });
// 연결한 계정(실데이터 · A1 과 같은 행) — 채널별 그룹
const al = await UI.api("/api/accounts-list");
/* [R7 §4.3] 빈 상태 문구에 채널 이름을 박지 않는다 — 레지스트리에서 «지금 열린» 채널만 읽어 말한다(영상 채널이 열리면 문구가 저절로 따라온다) */
if (al.ok && !al.accounts.length) {
  const open = (al.channels || []).filter((c) => c.status === "active").map((c) => c.label || UI.chLabel(c.key));
  const el = UI.$("#accEmpty");
  if (el && open.length) el.textContent = `${open.slice(0, 3).join(" · ")}${open.length > 3 ? " 등" : ""} 중 하나면 시작할 수 있어요.`;
}
if (al.ok && al.accounts.length) {
  const by = {}; for (const a of al.accounts) (by[a.channel] = by[a.channel] || []).push(a);
  UI.$("#accounts").innerHTML = `<div class="gt">연결한 계정 ${al.accounts.length}개 <a href="/app/accounts.html">관리</a></div>` + Object.entries(by).map(([ch, list]) => list.map((a) => `<a class="row tap" href="/app/accounts.html">${UI.mark(ch)}<div class="l"><span class="t">@${UI.esc(a.handle)}</span><span class="d">${UI.esc(UI.chLabel(ch))} · 오늘 ${a.postsToday}/${a.dailyCap} · 건강 ${a.healthScore}</span></div>${UI.pill(UI.ACC_STATUS, a.status)}${UI.chev}</a>`).join("")).join("");
}
})();
</script>
</body>
</html>
