<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>문의하기 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=15">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/app/account.html')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="sp"></span></div>
<div class="step-h"><h1>무엇이 막히나요?</h1><p>플랜·내 PC 프로그램 상태·최근 오류는 자동으로 같이 보내져요.</p></div>
<div class="group" id="faq"><div class="gt">자주 묻는 질문</div></div>
<div class="group" id="mine"><div class="gt">내 문의</div></div>
<div class="cta"><button class="btn primary" type="button" id="ask">문의 남기기</button></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=13"></script>
<script src="/js/mock.js?v=13"></script>
<script>
(async () => {
await UI.boot("account");
const TST = { open: ["warn", "접수"], progress: ["ink", "답변 중"], hold: ["off", "확인 중"], resolved: ["ok", "해결"] };
async function load() {
  const [f, t] = await Promise.all([UI.api("/api/faqs"), UI.api("/api/support-tickets")]);
  const faqs = f.ok ? f.faqs || [] : [];
  UI.$("#faq").innerHTML = `<div class="gt">자주 묻는 질문</div>` + (faqs.length ? faqs.map((q) => `<button type="button" class="row tap" data-faq="${q.id}"><div class="l"><span class="t wrap">${UI.esc(q.q)}</span></div>${UI.chev}</button>`).join("") : `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">아직 없어요</span></div></div>`);
  UI.$$("[data-faq]").forEach((b) => b.onclick = () => { const q = faqs.find((x) => x.id === Number(b.dataset.faq)); UI.sheet(`<p style="margin:0 0 12px;font-size:15px;line-height:1.7">${UI.esc(q.a)}</p><div class="cta"><button class="btn secondary" type="button" id="ok">알겠어요</button></div>`, { title: q.q, onOpen: (sh, close) => { sh.querySelector("#ok").onclick = close; } }); });
  const tk = t.ok ? t.tickets || [] : [];
  UI.$("#mine").innerHTML = `<div class="gt">내 문의</div>` + (tk.length ? tk.map((x) => `<button type="button" class="row tap" data-t="${x.id}"><div class="l"><span class="t">${UI.esc(x.subject)}</span><span class="d">${UI.ago(x.updatedAt)}${x.status === "resolved" && x.rating == null ? " · 도움이 됐는지 알려 주세요" : ""}</span></div>${UI.pill(TST, x.status)}${UI.chev}</button>`).join("") : `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">남긴 문의가 없어요</span></div></div>`);
  UI.$$("[data-t]").forEach((b) => b.onclick = () => thread(tk.find((x) => x.id === Number(b.dataset.t))));
}
function thread(x) {
  UI.sheet(`<div style="display:flex;flex-direction:column;gap:6px">${(x.messages || []).map((m) => `<div class="msg ${m.from === "operator" ? "op" : m.from === "system" ? "sys" : ""}" style="margin:0;${m.from === "operator" ? "align-self:flex-end" : ""}">${UI.esc(m.text)}<small>${m.from === "operator" ? "AutoCreate" : m.from === "system" ? "자동 첨부" : "나"} · ${UI.dateKST(m.at)} ${UI.timeKST(m.at)}</small></div>`).join("")}</div>
    ${x.status === "resolved" && x.rating == null ? `<div class="sec">도움이 됐나요?</div><div class="cta" style="padding-top:6px"><button class="btn secondary" type="button" data-r="0">아니요</button><button class="btn primary" type="button" data-r="1">네</button></div>` : x.rating != null ? `<p class="muted center" style="margin:12px 0 0;font-size:13px">평가해 주셔서 고마워요</p>` : `<p class="muted center" style="margin:12px 0 0;font-size:13px">답변이 오면 알림으로 알려드려요</p>`}`,
    { title: x.subject, onOpen: (sh, close) => { sh.querySelectorAll("[data-r]").forEach((b) => b.onclick = async () => { const r = await UI.api("/api/support-rate", { body: { id: x.id, helpful: b.dataset.r === "1" } }); if (!r.ok) return UI.toast(r.error); close(); UI.toast("고마워요"); load(); }); } });
}
let files = [];
/* [P1R6 §1.1] 사진 첨부는 presign 왕복이다 — ① /api/support-upload-url 로 60초짜리 PUT 주소를 받고 ② 파일 바이트를 그 주소에 그대로 PUT ③ 받은 key 만 티켓에 싣는다.
   🔴 base64 로 서버에 보내지 않는다(그런 경로가 없다 · 함수 본문 한계도 있다) · 5MB·3장은 화면이 막는다 · R2 미설정(step not_configured)은 빨간 오류가 아니라 한 줄 안내 */
const PIC_MAX = 5 * 1024 * 1024, PIC_N = 3;
const EXT = { "image/png": "png", "image/jpeg": "jpg", "image/jpg": "jpg", "image/webp": "webp" };
const extOf = (f) => EXT[String(f.type || "").toLowerCase()] || (/\.(png|jpe?g|webp)$/i.test(f.name) ? f.name.split(".").pop().toLowerCase().replace("jpeg", "jpg") : "");
async function putPic(file) {
  const r = await UI.api("/api/support-upload-url", { body: { ext: extOf(file), contentType: file.type } });
  if (!r.ok) return { ok: false, step: r.step, error: r.error || "사진을 올리지 못했어요" };
  const put = await fetch(r.uploadUrl, { method: "PUT", headers: { "content-type": r.contentType }, body: file }).catch(() => null);
  if (!put || !put.ok) return { ok: false, error: `${file.name} 을 올리지 못했어요 · 다시 골라 주세요` };   // 주소는 60초짜리다(늦으면 다시 고르면 된다)
  return { ok: true, key: r.key, name: file.name };
}
UI.$("#ask").onclick = () => { files = []; UI.sheet(`<form id="f"><div class="field"><label for="subject">한 줄 요약</label><input class="input" id="subject" name="subject" required maxlength="160" placeholder="예: 네이버 계정이 안 붙어요"><div class="help"></div></div>
  <div class="field"><label for="body">자세히</label><textarea class="input" id="body" name="text" rows="5" style="height:auto;padding:14px 16px" required></textarea><div class="help"></div></div>
  <div class="field"><label>사진 <span class="muted" style="font-weight:500">· 선택 · 3장까지 · 한 장 5MB 까지</span></label><input type="file" id="pic" accept="image/png,image/jpeg,image/webp" multiple style="font-size:13px"><div id="picList" class="muted" style="font-size:12.5px"></div></div>
  <div class="cta"><button class="btn primary" type="submit">보내기</button></div></form>`, { title: "문의 남기기", onOpen: (sh, close) => {
    sh.querySelector("#pic").addEventListener("change", async (e) => {
      const note = sh.querySelector("#picList"); const list = [...e.target.files].slice(0, PIC_N); const out = [];
      if (!list.length) { files = []; note.textContent = ""; return; }
      note.textContent = "사진 올리는 중이에요…";
      for (const f of list) {
        if (!extOf(f)) { UI.toast("png·jpg·webp 사진만 붙일 수 있어요"); continue; }
        if (f.size > PIC_MAX) { UI.toast(`${f.name} 은 5MB 를 넘어요`); continue; }
        const r = await putPic(f);
        if (r.ok) { out.push({ key: r.key, name: r.name }); continue; }
        if (r.step === "not_configured") { files = []; e.target.value = ""; note.textContent = r.error; return; } // 준비 중 = 고장이 아니다 · 글로만 보내도 문의는 간다
        UI.toast(r.error);
      }
      files = out; note.textContent = out.length ? out.map((x) => x.name).join(" · ") + " 붙였어요" : "사진을 못 붙였어요 · 글로만 보내도 돼요";
    });
    UI.form(sh.querySelector("#f"), async (d, f) => { const r = await UI.api("/api/support-ticket", { body: { subject: d.subject, text: d.text, attachments: files.map((x) => x.key) } }); if (!r.ok) return UI.fieldError(f, r.step === "subject" ? "subject" : "text", r.error || "보내지 못했어요"); close(); UI.done("보냈어요 · 답변은 알림으로", load); });
  } }); };
await load();
})();
</script>
</body>
</html>
