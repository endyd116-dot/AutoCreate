<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수익 매체 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=6">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/app/revenue.html')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="ttl">수익 매체</span><span class="sp"></span></div>
<div class="step-h"><h1>어디서 돈이 들어오나요?</h1><p>가입은 본인 이름으로 해야 해요. 연결과 수집은 저희가 할게요.</p></div>
<div id="body"><div class="group"><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=5"></script>
<script src="/js/mock.js?v=5"></script>
<script>
(async () => {
await UI.boot("revenue");
/* 신청 주소는 서버가 준다(계약 v3.1 §1.4b) · 못 받으면 공개 주소로 떨어진다 */
const FALLBACK_LINKS = { adpost: "https://adpost.naver.com/", adsense: "https://www.google.com/adsense/start/", ypp: "https://www.youtube.com/creators/how-things-work/monetization/", coupang: "https://partners.coupang.com/", clip: "https://creators.naver.com/" };
const HOW = {
  adpost: ["애드포스트에 가입해요", "내 블로그를 «미디어»로 등록해요", "심사를 기다려요 · 승인되면 네이버가 광고를 자동으로 넣어요"],
  adsense: ["애드센스에 가입해요", "티스토리·블로거·워드프레스 사이트를 추가해요", "심사를 기다려요 · 승인되면 글 안 «광고 자리»에 자동으로 들어가요"],
  ypp: ["구독 1,000명·쇼츠 조회를 채워요", "유튜브 스튜디오에서 수익 창출을 신청해요", "승인되면 수익을 매일 가져와요"],
  coupang: ["쿠팡 파트너스에 가입해요", "승인 후 API 키(2개)를 발급받아요", "여기에 키를 넣으면 링크와 수익이 자동이에요"],
  clip: ["클립 크리에이터 모집 기간에 지원해요", "선정되면 알려 주세요", "인센티브를 매일 가져와요"],
};
const KEYED = { coupang: [["accessKey", "Access Key"], ["secretKey", "Secret Key"]], aliexpress: [["appKey", "앱 키"]], linkprice: [["merchantKey", "머천트 키"]] };
let EL = { accounts: [], thresholds: null, links: {} }, SRC = [], accounts = [];
const linkOf = (k) => (EL.links && EL.links[k]) || FALLBACK_LINKS[k] || "";
const srcOf = (source, accountId) => SRC.find((s) => s.source === source && (accountId == null || s.accountId === accountId));

async function load() {
  const [e, v, a] = await Promise.all([UI.api("/api/ad-eligibility"), UI.api("/api/revenue-sources"), UI.api("/api/accounts-list")]);
  if (e.ok) EL = { accounts: e.accounts || [], thresholds: e.thresholds || null, links: e.links || {} };
  SRC = v.ok ? (v.sources || []) : []; accounts = a.ok ? (a.accounts || []) : [];
  render();
}

/* 조건 게이지 — 분모는 서버가 준 thresholds 에서만 온다. 없으면 게이지 대신 현재값만(v3.1) */
function gauge(label, now, need, unit) {
  if (need == null) return `<div class="gauge"><div class="gl"><span>${UI.esc(label)}</span><b>${UI.numShort(now)}${UI.esc(unit)}</b></div></div>`;
  const pct = Math.min(100, Math.round((now / need) * 100));
  return `<div class="gauge ${now >= need ? "done" : ""}"><div class="gl"><span>${UI.esc(label)}</span><b>${UI.numShort(now)} / ${UI.numShort(need)}${UI.esc(unit)}</b></div><div class="gt2"><div class="gf" style="width:${pct}%"></div></div></div>`;
}
const STATE_PILL = { none: ["off", "아직 신청 전"], pending: ["warn", "심사 중"], approved: ["ok", "승인됨"] };

function card(key, title, desc, inner) {
  return `<div class="group" style="margin-bottom:12px"><div class="gt">${UI.esc(title)}</div><p class="muted" style="margin:0 16px 6px;font-size:13px">${UI.esc(desc)}</p>${inner}</div>`;
}
function rowBtns(key, accountId, state) {
  const how = `<button type="button" class="btn ghost sm" data-how="${key}" data-acc="${accountId ?? ""}">신청 방법</button>`;
  const done = state !== "approved" ? `<button type="button" class="btn sm secondary" data-done="${key}" data-acc="${accountId ?? ""}">가입 완료했어요</button>` : "";
  return `<div style="display:flex;gap:8px;padding:2px 16px 10px">${how}${done}</div>`;
}

function render() {
  const th = EL.thresholds || {};
  let h = "";

  /* ① 애드포스트 — 네이버 블로그 계정마다 */
  const np = EL.accounts.filter((a) => a.adpost);
  if (np.length) h += card("adpost", "네이버 애드포스트", "네이버 블로그에 네이버가 광고를 넣어 줘요. 글 수와 방문이 기준을 넘으면 신청할 수 있어요.",
    np.map((a) => { const st = STATE_PILL[a.adpost.state] || STATE_PILL.none;
      return `<div class="row" style="align-items:flex-start;padding-top:10px">${UI.mark(a.channel)}<div class="l"><span class="t">@${UI.esc(a.handle)}</span>
        <div style="padding:6px 0 0">${gauge("올린 글", a.adpost.posts, th.adpost?.posts, "편")}${gauge("방문", a.adpost.visitors, th.adpost?.visitors, "명")}</div></div><span class="pill ${st[0]}">${st[1]}</span></div>`
        + (a.adpost.ready || a.adpost.state !== "none" ? rowBtns("adpost", a.accountId, a.adpost.state)
          : `<p class="muted" style="margin:0 16px 10px;font-size:12.5px">기준을 넘으면 여기서 바로 알려드릴게요.</p>`); }).join(""));

  /* ② 애드센스 — 티스토리·블로거·워드프레스 계정 */
  const ad = accounts.filter((a) => ["tistory", "blogger", "wordpress"].includes(a.channel));
  if (ad.length) h += card("adsense", "구글 애드센스", "티스토리·블로거·워드프레스 글에 광고를 넣어요. 글 안 «광고 자리»는 미리 비워 두고 있어요.",
    ad.map((a) => { const s = srcOf("adsense", a.id); const st = s ? UI.SRC_STATUS[s.status] : UI.SRC_STATUS.not_configured;
      return `<div class="row">${UI.mark(a.channel)}<div class="l"><span class="t">@${UI.esc(a.handle)}</span><span class="d">${s && s.lastSyncAt ? UI.esc(UI.ago(s.lastSyncAt)) + " 가져옴" : UI.esc(UI.SRC_ERR[(s && s.lastError) || "not_configured"])}</span></div><span class="pill ${st[0]}">${st[1]}</span></div>`
        + rowBtns("adsense", a.id, s && s.status === "connected" ? "approved" : "none"); }).join(""));

  /* ③ 유튜브 YPP */
  const yt = EL.accounts.filter((a) => a.ypp);
  if (yt.length) h += card("ypp", "유튜브 수익 창출", "구독과 조회가 기준을 넘으면 신청할 수 있어요.",
    yt.map((a) => `<div class="row" style="align-items:flex-start;padding-top:10px">${UI.mark(a.channel)}<div class="l"><span class="t">@${UI.esc(a.handle)}</span>
      <div style="padding:6px 0 0">${gauge("구독", a.ypp.subs, th.ypp?.subs, "명")}${gauge("쇼츠 조회", a.ypp.views, th.ypp?.views, "회")}</div></div><span class="pill ${a.ypp.ready ? "ok" : "off"}">${a.ypp.ready ? "신청 가능" : "모으는 중"}</span></div>`
      + (a.ypp.ready ? rowBtns("ypp", a.accountId, "none") : `<p class="muted" style="margin:0 16px 10px;font-size:12.5px">기준을 넘으면 여기서 바로 알려드릴게요.</p>`)).join(""));

  /* ④ 키를 넣는 매체 */
  for (const [key, fields] of Object.entries(KEYED)) {
    const s = srcOf(key); const st = s ? UI.SRC_STATUS[s.status] : UI.SRC_STATUS.not_configured;
    h += card(key, UI.srcLabel(key), key === "coupang" ? "가입하고 키를 넣으면 글마다 제휴 링크를 자동으로 넣고 수익을 가져와요." : "키를 넣으면 수익을 매일 가져와요.",
      `<div class="row">${UI.srcMark(key)}<div class="l"><span class="t">${UI.esc(UI.srcLabel(key))}</span><span class="d">${s && s.lastSyncAt ? UI.esc(UI.ago(s.lastSyncAt)) + " 가져옴" : UI.esc(UI.SRC_ERR[(s && s.lastError) || "not_configured"])}</span></div><span class="pill ${st[0]}">${st[1]}</span></div>
       <div style="display:flex;gap:8px;padding:2px 16px 10px">${HOW[key] ? `<button type="button" class="btn ghost sm" data-how="${key}" data-acc="">신청 방법</button>` : ""}<button type="button" class="btn sm secondary" data-key="${key}">${s && s.status === "connected" ? "키 바꾸기" : "키 넣기"}</button>${s && s.status === "connected" ? `<button type="button" class="btn ghost sm" data-off="${key}" style="color:var(--danger)">끊기</button>` : ""}</div>`);
  }

  /* ⑤ 네이버 클립 */
  const cl = EL.accounts.find((a) => a.clip);
  h += card("clip", "네이버 클립 인센티브", cl && cl.clip.open ? "지금 모집 중이에요." : "모집이 열리면 알려드릴게요.",
    `<div class="row"><span class="mk soft">C</span><div class="l"><span class="t">클립 크리에이터</span><span class="d">${cl && cl.clip.open ? (cl.clip.deadline ? UI.esc(UI.dateKST(cl.clip.deadline)) + "까지 지원할 수 있어요" : "지원할 수 있어요") : "아직 모집 전이에요"}</span></div><span class="pill ${cl && cl.clip.open ? "ok" : "off"}">${cl && cl.clip.open ? "모집 중" : "대기"}</span></div>`
    + (cl && cl.clip.open ? rowBtns("clip", cl.accountId, "none") : ""));

  /* ⑥ 자동으로 못 가져오는 것 */
  h += card("manual", "그 밖에 받은 돈", "메타·틱톡·협찬비처럼 자동으로 못 가져오는 건 수익 화면에서 직접 넣을 수 있어요.",
    `<a class="row tap" href="/app/revenue.html"><span class="mk soft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><div class="l"><span class="t">직접 넣으러 가기</span><span class="d">협찬·광고비 · 메타 · 틱톡 · 엑스</span></div>${UI.chev}</a>`);

  UI.$("#body").innerHTML = h;
  UI.$$("#body [data-how]").forEach((b) => b.onclick = () => howSheet(b.dataset.how, b.dataset.acc ? Number(b.dataset.acc) : null));
  UI.$$("#body [data-done]").forEach((b) => b.onclick = () => claimSheet(b.dataset.done, b.dataset.acc ? Number(b.dataset.acc) : null));
  UI.$$("#body [data-key]").forEach((b) => b.onclick = () => keySheet(b.dataset.key));
  UI.$$("#body [data-off]").forEach((b) => b.onclick = () => disconnect(b.dataset.off));
}

/* 한 화면 한 단계 — 신청 방법 3단계 + 외부 새 창 */
function howSheet(key, accountId) {
  const steps = HOW[key] || []; const url = linkOf(key);
  UI.sheet(`<div class="steps" style="padding:4px 0 8px">${steps.map((s, i) => `<div class="st ${i === 0 ? "on" : ""}"><i>${i + 1}</i>${UI.esc(s)}</div>`).join("")}</div>
    <p class="muted" style="margin:0 0 4px;font-size:13px">가입은 본인 이름으로만 할 수 있어요. 새 창에서 하고 돌아와 주세요.</p>
    <div class="cta" style="flex-direction:column">${url ? `<a class="btn primary" href="${UI.esc(url)}" target="_blank" rel="noopener" id="go">신청하러 가기</a>` : ""}<button type="button" class="btn ghost" id="did">가입 완료했어요</button></div>`,
    { title: `${UI.srcLabel(key === "ypp" ? "youtube" : key)} 신청`, onOpen: (sh, close) => {
      sh.querySelector("#did").onclick = () => { close(); setTimeout(() => claimSheet(key, accountId), 300); };
    } });
}
/* «가입 완료했어요» 1탭 — 자기 신고라 다음 수집에서 서버 판정이 이긴다고 정직하게 적는다 */
function claimSheet(key, accountId) {
  if (key !== "adpost" && key !== "ypp" && key !== "adsense" && key !== "clip") return keySheet(key);
  UI.sheet(`<p class="muted" style="margin:0 0 4px">신청까지 마치셨다면 여기서 알려 주세요. 상태를 «심사 중»으로 바꿔 둘게요.</p>
    <p class="muted" style="margin:0 0 16px;font-size:13px">승인 여부는 다음 수집 때 저희가 다시 확인해요. 아직이면 원래대로 돌아갈 수 있어요.</p>
    <div class="cta" style="flex-direction:column"><button class="btn primary" type="button" data-a="applied">신청까지 했어요</button><button class="btn ghost" type="button" data-a="approved">이미 승인됐어요</button></div>`,
    { title: "어디까지 하셨나요", onOpen: (sh, close) => {
      sh.querySelectorAll("[data-a]").forEach((b) => b.onclick = async () => {
        b.disabled = true;
        const r = await UI.api("/api/ad-eligibility", { body: { action: b.dataset.a, source: key, accountId } });
        b.disabled = false;
        if (!r.ok) return UI.toast(r.error || "저장하지 못했어요");
        if (r.accounts) EL.accounts = r.accounts;
        close(); UI.done(b.dataset.a === "approved" ? "승인으로 바꿨어요" : "심사 중으로 바꿨어요", load);
      });
    } });
}
/* 키 입력 = 바텀시트 */
function keySheet(key) {
  const fields = KEYED[key] || [["key", "키"]]; const url = linkOf(key);
  UI.sheet(`<p class="muted" style="margin:0 0 8px">키는 암호로 잠가서 보관하고, 수익을 가져올 때만 써요.</p>
    ${fields.map(([n, l]) => `<div class="field"><label>${UI.esc(l)}</label><input class="input" data-f="${n}" autocomplete="off" type="password"><div class="help"></div></div>`).join("")}
    ${url ? `<p class="muted" style="margin:0 0 4px;font-size:12.5px">키는 <a href="${UI.esc(url)}" target="_blank" rel="noopener" style="text-decoration:underline">${UI.esc(UI.srcLabel(key))}</a> 에서 발급받아요.</p>` : ""}
    <div class="cta"><button class="btn primary" type="button" id="ok">연결하기</button></div>`,
    { title: `${UI.srcLabel(key)} 키`, onOpen: (sh, close) => {
      sh.querySelector("#ok").onclick = async (e) => {
        const vals = [...sh.querySelectorAll("[data-f]")].map((i) => i.value.trim());
        if (vals.some((v) => !v)) { sh.querySelector(".help").textContent = "키를 모두 넣어 주세요."; return; }
        e.target.disabled = true;
        const r = await UI.api("/api/revenue-sources", { body: { action: "key", source: key, key: vals.join(":") } });
        sh.querySelectorAll("[data-f]").forEach((i) => i.value = ""); // 🔴 키는 요청 후 즉시 비운다
        e.target.disabled = false;
        if (!r.ok) { sh.querySelector(".help").textContent = r.error || "연결하지 못했어요"; return; }
        close(); UI.done("연결했어요", load);
      };
    } });
}
async function disconnect(key) {
  UI.sheet(`<div id="dc"></div>`, { title: `${UI.srcLabel(key)} 끊기`, onOpen: (sh, close) => {
    UI.confirmRow(sh.querySelector("#dc"), `${UI.srcLabel(key)} 연결을 끊을까요? 지금까지 모은 수익은 그대로 남아요.`, async () => {
      const r = await UI.api("/api/revenue-sources", { body: { action: "disconnect", source: key } });
      if (!r.ok) return UI.toast(r.error || "끊지 못했어요");
      close(); UI.toast("연결을 끊었어요"); load();
    });
  } });
}
await load();
})();
</script>
</body>
</html>
