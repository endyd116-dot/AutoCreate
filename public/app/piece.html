<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>검수 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=5">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/app/pieces.html')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="ttl">검수</span><span class="sp"></span></div>
<div class="row" id="head" style="padding-left:4px;padding-right:4px"><span class="sk" style="width:100%;height:40px"></span></div>
<article class="preview" id="pv" hidden><h1 id="ttl"></h1><div class="by" id="by"></div><div id="body"></div></article>
<div class="group" id="gate" hidden></div>
<div class="cta" id="cta" hidden><button class="btn secondary" type="button" id="save" hidden>수정 저장</button><button class="btn primary" type="button" id="approve">이대로 발행 예약</button></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=5"></script>
<script src="/js/mock.js?v=4"></script>
<script>
(async () => {
await UI.boot("home");
const id = Number(UI.qs.get("id")); if (!id) { UI.go("/app/pieces.html"); return; }
let P = null, dirty = false;
const more = document.createElement("button"); more.type = "button"; more.className = "ic"; more.setAttribute("aria-label", "더보기"); more.innerHTML = UI.dots; const sp = UI.$(".appbar .sp"); if (sp) sp.replaceWith(more);
/* 고지 블록 = bodyHtml 첫 요소 .disclosure(발행물 정본 · §16B) — 편집 불가 · 지워지면 되살린다 */
let discHtml = "";
function lockDisc(body) { const d = body.querySelector(".disclosure"); if (d) { d.contentEditable = "false"; d.setAttribute("data-lock", "1"); if (!d.querySelector("small")) d.insertAdjacentHTML("beforeend", '<small>제휴 고지 · 첫 줄에 자동으로 들어가요 · 지울 수 없어요</small>'); discHtml = d.outerHTML; } }
function restoreDisc(body) { if (discHtml && !body.querySelector(".disclosure")) { body.insertAdjacentHTML("afterbegin", discHtml); UI.toast("고지 문구는 지울 수 없어요"); } }
function cleanBody(body) { const c = body.cloneNode(true); c.querySelectorAll(".disclosure small").forEach((x) => x.remove()); c.querySelectorAll(".disclosure").forEach((x) => { x.removeAttribute("contenteditable"); x.removeAttribute("data-lock"); }); return c.innerHTML; }
function gateList(g) { return `<div class="gt">발행 전 검사 ${g.ok ? '<span class="pill ok">통과</span>' : '<span class="pill warn">확인 필요</span>'}</div>${g.rewritten ? '<p class="muted" style="margin:0 16px 8px;font-size:13px">한 번 고쳐 썼어요</p>' : ""}<div class="gate">${g.checks.map((c) => `<div class="g ${c.pass ? "" : "no"}"><i>${c.pass ? "✓" : "!"}</i><span>${UI.esc(c.label)}</span>${c.detail ? `<small>${UI.esc(c.detail)}</small>` : ""}</div>`).join("")}</div>`; }
function render() {
  const st = UI.PIECE_STATUS[P.status] || ["off", P.status]; const editable = P.status === "in_review";
  const when = P.status === "published" ? `${UI.dateKST(P.publishedAt)} 발행` : P.scheduledFor ? `${UI.dateKST(P.scheduledFor)} ${UI.timeKST(P.scheduledFor)} 예약` : "";
  UI.$("#head").innerHTML = `${UI.mark(P.channel)}<div class="l"><span class="t">${P.accountHandle ? "@" + UI.esc(P.accountHandle) : "계정 자동"}</span><span class="d">${UI.esc(UI.chLabel(P.channel))}${when ? " · " + when : ""}${P.topicTitle ? " · " + UI.esc(P.topicTitle) : ""}</span></div><span class="pill ${st[0]}">${st[1]}</span>`;
  const pv = UI.$("#pv"); pv.hidden = false; pv.className = `preview ${P.channel}`;
  const ttl = UI.$("#ttl"); ttl.textContent = P.title || ""; ttl.contentEditable = editable ? "true" : "false";
  UI.$("#by").innerHTML = `${UI.mark(P.channel, "sm")}<span>${P.accountHandle ? "@" + UI.esc(P.accountHandle) : ""} · ${UI.esc(UI.FORMAT[P.format] || P.format || "")}${P.meta?.tags?.length ? " · #" + P.meta.tags.map(UI.esc).join(" #") : ""}</span>`;
  const body = UI.$("#body"); body.innerHTML = P.bodyHtml || ""; body.contentEditable = editable ? "true" : "false"; lockDisc(body);
  const gate = UI.$("#gate"); if (P.gate) { gate.hidden = false; gate.innerHTML = gateList(P.gate); } else gate.hidden = true;
  const cta = UI.$("#cta"); cta.hidden = false;
  if (editable) { UI.$("#approve").hidden = false; UI.$("#approve").textContent = "이대로 발행 예약"; }
  else if (P.status === "published" && P.externalUrl) { UI.$("#approve").hidden = true; cta.innerHTML = `<a class="btn secondary" href="${UI.esc(P.externalUrl)}" target="_blank" rel="noopener">발행된 글 보기</a>`; }
  else cta.hidden = true;
  if (editable && !dirty) { const mark = () => { restoreDisc(body); if (!dirty) { dirty = true; UI.$("#save").hidden = false; } }; ttl.addEventListener("input", mark); body.addEventListener("input", mark); }
}
async function load() { const r = await UI.api(`/api/pieces-get?id=${id}`); if (!r.ok) { UI.toast(r.error || "글을 찾을 수 없어요"); setTimeout(() => UI.go("/app/pieces.html"), 900); return; } P = r.piece; dirty = false; UI.$("#save").hidden = true; render(); }
UI.$("#save").onclick = async () => {
  const btn = UI.$("#save"); btn.disabled = true;
  const r = await UI.api("/api/pieces-update", { body: { id, title: UI.$("#ttl").textContent.trim(), bodyHtml: cleanBody(UI.$("#body")) } }); btn.disabled = false;
  if (!r.ok) return UI.toast(r.error || "저장하지 못했어요");
  P.title = UI.$("#ttl").textContent.trim(); if (r.bodyHtml) { P.bodyHtml = r.bodyHtml; UI.$("#body").innerHTML = r.bodyHtml; lockDisc(UI.$("#body")); } P.gate = r.gate; P.gateOk = !!r.gate?.ok; UI.$("#gate").innerHTML = gateList(r.gate);
  dirty = false; btn.hidden = true; const bad = (r.gate?.checks || []).filter((c) => !c.pass).length;
  UI.toast(bad ? `저장했어요 · 검사 ${bad}개는 확인이 필요해요` : "저장했어요 · 검사 통과");
};
UI.$("#approve").onclick = async () => {
  if (dirty) return UI.toast("먼저 «수정 저장»을 눌러 주세요");
  const btn = UI.$("#approve"); btn.disabled = true; const r = await UI.api("/api/pieces-approve", { body: { id } }); btn.disabled = false;
  if (!r.ok) {
    if (r.step === "gate" && r.gate) return UI.sheet(`<p class="muted" style="margin:0 0 8px">아래 항목을 고치면 예약할 수 있어요. 글을 고친 뒤 «수정 저장»을 누르면 다시 검사해요.</p><div class="gate" style="padding:4px 0 8px">${r.gate.checks.map((c) => `<div class="g ${c.pass ? "" : "no"}"><i>${c.pass ? "✓" : "!"}</i><span>${UI.esc(c.label)}</span>${c.detail ? `<small>${UI.esc(c.detail)}</small>` : ""}</div>`).join("")}</div><div class="cta"><button class="btn secondary" type="button" data-ok>글 고치러 가기</button></div>`, { title: "발행 전 확인이 필요해요", onOpen: (sh, close) => { sh.querySelector("[data-ok]").onclick = close; } });
    return UI.toast(r.error || "예약하지 못했어요");
  }
  UI.done("발행을 예약했어요", () => UI.go("/app/pieces.html?tab=scheduled"));
};
more.onclick = () => UI.sheet(`<div class="group" style="padding:0">
  <button type="button" class="row tap" id="regen" ${P.regenCount >= 1 ? "disabled" : ""}><div class="l"><span class="t">다시 만들기</span><span class="d">${P.regenCount >= 1 ? "이미 한 번 다시 만들었어요" : "코인은 더 안 들어요 · 1회"}</span></div></button>
  <button type="button" class="row tap" id="reject"><div class="l"><span class="t" style="color:var(--danger)">버리기</span><span class="d">이 글은 발행하지 않아요</span></div></button></div><div id="rc"></div>`, { title: "이 글을", onOpen: (sh, close) => {
    sh.querySelector("#regen").onclick = async () => { const r = await UI.api("/api/pieces-regenerate", { body: { id } }); if (!r.ok) return UI.toast(r.error || "다시 만들지 못했어요"); close(); UI.toast("다시 만들기 시작했어요"); setTimeout(() => UI.go("/app/pieces.html?tab=generating"), 600); };
    sh.querySelector("#reject").onclick = () => UI.confirmRow(sh.querySelector("#rc"), "이 글을 버릴까요? 되돌릴 수 없어요.", async () => { const r = await UI.api("/api/pieces-reject", { body: { id } }); if (!r.ok) return UI.toast(r.error || "버리지 못했어요"); close(); UI.toast("버렸어요"); setTimeout(() => UI.go("/app/pieces.html"), 600); });
  } });
await load();
})();
</script>
</body>
</html>
