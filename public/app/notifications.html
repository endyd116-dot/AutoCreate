<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>알림 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=23">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/app/account.html')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="sp"></span></div>
<div class="step-h"><h1>알림</h1></div>
<div class="group" id="list"><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=31"></script>
<script src="/js/mock.js?v=32"></script>
<script>
(async () => {
await UI.boot("home");
const EMPTY = `<div class="empty"><span class="mk soft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg></span><h3>아직 알림이 없어요</h3><p>발행·검수·계정 상태가 바뀌면 여기에 쌓여요.</p></div>`;
const row = (n) => { const link = n.link || UI.KIND_LINK[n.kind] || ""; return `<a class="row tap" href="${link ? UI.esc(link) : "javascript:void 0"}" ${n.readAt ? 'style="opacity:.55"' : ""}>${UI.kindMark(n.kind, n.tone)}<div class="l"><span class="t wrap">${UI.esc(n.title)}</span><span class="d wrap">${UI.esc(n.desc || "")}</span></div><span class="r mut">${UI.esc(UI.ago(n.createdAt))}</span>${link ? UI.chev : ""}</a>`; }; // [P1R4] 링크 없는 kind 는 기본 링크
async function load() {
  const r = await UI.api("/api/notifications-list?limit=50");
  let list = r.ok ? (r.notifications || []) : null;
  if (list === null) { // 폴백 — 알림 목록이 아직 없으면 홈의 «해야 할 일»을 그대로 보여 준다(빈 화면 금지)
    const h = await UI.api("/api/home-summary");
    list = h.ok ? (h.todo || []).map((t, i) => ({ id: "todo-" + i, kind: t.kind, title: t.title, desc: t.desc, link: t.link, tone: t.tone, createdAt: null })) : [];
  }
  const unread = list.filter((n) => !n.readAt).length;
  UI.$("#list").innerHTML = list.length
    ? (unread ? `<div class="gt">안 읽음 ${unread}${r.ok ? ` <button type="button" id="readAll" style="color:var(--ink);font-weight:600;font-size:12.5px">모두 읽음</button>` : ""}</div>` : "") + list.map(row).join("")
    : EMPTY;
  const b = UI.$("#readAll"); if (b) b.onclick = async () => { const rr = await UI.api("/api/notifications-read", { body: {} }); if (!rr.ok) return UI.toast(rr.error || "읽음으로 바꾸지 못했어요"); load(); };
}
await load();
})();
</script>
</body>
</html>
