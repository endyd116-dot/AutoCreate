<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>글 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=2">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/app/home.html')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="ttl">글</span><span class="sp"></span></div>
<div class="seg" id="seg"><button type="button" data-tab="generating">만드는 중</button><button type="button" data-tab="in_review">봐주세요</button><button type="button" data-tab="scheduled">예약됨</button><button type="button" data-tab="published">발행됨</button></div>
<div class="group" id="list"><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=2"></script>
<script src="/js/mock.js?v=1"></script>
<script>
(async () => {
await UI.boot("home");
const TAB = { generating: ["generating", "draft", "failed"], in_review: ["in_review"], scheduled: ["approved", "scheduled", "publishing", "awaiting_manual"], published: ["published"] };
const STAGES = [["writing", "글 쓰는 중"], ["images", "사진 만드는 중"], ["checking", "검사 중"]];
let tab = UI.qs.get("tab") || null, all = [], timer = null;
function stepBar(p) { const i = p.stage === "failed" ? -1 : Math.max(0, STAGES.findIndex(([k]) => k === p.stage)); const done = p.stage === "done";
  return `<div class="steps" style="padding:0 16px 12px 66px">${STAGES.map(([k, l], n) => `<div class="st ${done || n < i ? "done" : n === i ? "on" : ""}"><i>${done || n < i ? "✓" : n + 1}</i>${l}</div>`).join("")}</div>`; }
function row(p) { const st = UI.PIECE_STATUS[p.status] || ["off", p.status]; const when = p.status === "published" ? UI.dateKST(p.publishedAt) : p.scheduledFor ? `${UI.dateKST(p.scheduledFor)} ${UI.timeKST(p.scheduledFor)}` : "";
  return `<a class="row tap" href="/app/piece.html?id=${p.id}">${UI.mark(p.channel)}<div class="l"><span class="t">${UI.esc(p.title || "제목 정하는 중")}</span><span class="d">${p.accountHandle ? "@" + UI.esc(p.accountHandle) : "계정 자동"}${when ? " · " + when : ""}${p.status === "failed" && p.failReason ? " · " + UI.esc(p.failReason) : ""}</span></div><span class="pill ${st[0]}">${st[1]}</span>${UI.chev}</a>` + (TAB.generating.includes(p.status) && p.status !== "failed" ? stepBar(p) : ""); }
function render() {
  const cnt = Object.fromEntries(Object.entries(TAB).map(([k, v]) => [k, all.filter((p) => v.includes(p.status)).length]));
  if (!tab) tab = cnt.generating ? "generating" : cnt.in_review ? "in_review" : cnt.scheduled ? "scheduled" : "in_review";
  UI.$$("#seg button").forEach((b) => { b.classList.toggle("on", b.dataset.tab === tab); const n = cnt[b.dataset.tab]; b.textContent = b.textContent.replace(/\s\d+$/, "") + (n ? " " + n : ""); });
  const list = all.filter((p) => TAB[tab].includes(p.status));
  const EMPTY = { generating: ["지금 만드는 글이 없어요", "만들기에서 소재를 골라 디렉터에게 보내 보세요", "/app/create.html", "소재 고르기"], in_review: ["봐주실 글이 없어요", "글이 다 되면 여기에 «봐주세요»로 올라와요", null, null], scheduled: ["예약된 글이 없어요", "검수에서 «이대로 발행 예약»을 누르면 여기로 와요", null, null], published: ["아직 발행된 글이 없어요", "예약된 시각에 발행되면 여기에 쌓여요", null, null] };
  const e = EMPTY[tab];
  UI.$("#list").innerHTML = list.length ? list.map(row).join("") : `<div class="empty"><h3>${e[0]}</h3><p>${e[1]}</p>${e[2] ? `<a class="btn primary sm" href="${e[2]}">${e[3]}</a>` : ""}</div>`;
  // 만드는 중이 남아 있으면 5초 폴링 · 없으면 중단
  const busy = all.some((p) => p.status === "generating" || p.status === "draft");
  if (busy && !timer) timer = setInterval(load, 5000); if (!busy && timer) { clearInterval(timer); timer = null; }
}
async function load() { const r = await UI.api("/api/pieces-list?status=all"); if (!r.ok) { UI.toast(r.error || "불러오지 못했어요"); return; } all = r.pieces; render(); }
UI.$$("#seg button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
await load();
})();
</script>
</body>
</html>
