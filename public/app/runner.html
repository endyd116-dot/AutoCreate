<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 PC 프로그램 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=7">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/app/account.html')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="sp"></span></div>
<div class="hl"><div class="say">내 PC 프로그램이</div><div class="num" id="num"><span class="sk" style="display:inline-block;width:60%"></span></div><div class="tip" id="tip"></div></div>
<div class="group" id="list"><div class="row"><span class="sk" style="width:100%;height:40px"></span></div></div>
<div class="group" id="why"><div class="gt">왜 필요한가요</div><div class="reasons"><p>네이버 블로그·티스토리는 프로그램이 대신 올려요. 이 두 곳은 바깥에서 글을 넣는 길이 없어서예요.</p><p>켜 두기만 하면 돼요. 꺼져 있으면 그 시각을 지나도 글을 버리지 않고 기다려요.</p><p>로그인 정보는 암호로 잠가 두고, 올릴 때만 이 프로그램이 열어요.</p></div></div>
<div class="cta"><button class="btn primary" type="button" id="add">내 PC에서 켜기</button></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=6"></script>
<script src="/js/mock.js?v=6"></script>
<script>
(async () => {
await UI.boot("account");
let devices = [], timer = null;
const DL = { url: "", cmd: "" };
const PC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></svg>';

function render() {
  const on = devices.filter((d) => d.status === "online");
  const last = devices.map((d) => d.lastSeenAt).filter(Boolean).sort().pop();
  const waiting = devices.reduce((a, d) => a + (d.jobsWaiting || 0), 0);
  UI.$("#num").textContent = !devices.length ? "아직 없어요" : on.length ? "지금 켜져 있어요" : "꺼져 있어요";
  UI.$("#tip").textContent = !devices.length ? "네이버·티스토리 글은 이 프로그램이 올려요"
    : on.length ? `${UI.ago(last) || "방금 전"} 응답${waiting ? ` · 올릴 글 ${waiting}건` : " · 올릴 글 없음"}`
    : `마지막 응답 ${UI.ago(last) || "오래전"}${waiting ? ` · 글 ${waiting}건이 기다려요` : ""}`;
  const list = UI.$("#list");
  list.innerHTML = devices.length
    ? `<div class="gt">연결한 PC ${devices.length}대</div>` + devices.map((d) => `<button type="button" class="row tap" data-id="${d.id}"><span class="mk ${d.status === "online" ? "money" : "soft"}">${PC}</span><div class="l"><span class="t">${UI.esc(d.name)}</span><span class="d">${d.version ? "버전 " + UI.esc(d.version) + " · " : ""}${d.status === "online" ? (d.jobsWaiting ? `올릴 글 ${d.jobsWaiting}건` : "올릴 글 없음") : "마지막 응답 " + UI.esc(UI.ago(d.lastSeenAt) || "오래전")}</span></div><span class="pill ${d.status === "online" ? "ok" : "off"}">${d.status === "online" ? "켜짐" : "꺼짐"}</span>${UI.chev}</button>`).join("")
    : `<div class="empty"><span class="mk soft">${PC}</span><h3>아직 연결한 PC가 없어요</h3><p>늘 켜 두는 PC 한 대면 돼요. 아래에서 3분이면 끝나요.</p></div>`;
  UI.$$("#list .row[data-id]").forEach((b) => b.onclick = () => deviceSheet(devices.find((d) => d.id === Number(b.dataset.id))));
  const wait = devices.some((d) => d.status !== "online");
  if (wait && !timer) timer = setInterval(load, 5000); if (!wait && timer) { clearInterval(timer); timer = null; }
}
async function load() { const r = await UI.api("/api/runner-list"); if (!r.ok) { UI.toast(r.error || "불러오지 못했어요"); return; } devices = r.devices || []; render(); }

/* 기기 시트(상태 + 해제) */
function deviceSheet(d) {
  if (!d) return;
  UI.sheet(`<div class="kv" style="padding-left:0;padding-right:0"><span class="k">상태</span><span class="v">${d.status === "online" ? '<span class="pill ok">켜짐</span>' : '<span class="pill off">꺼짐</span>'}</span></div>
    <div class="kv" style="padding-left:0;padding-right:0"><span class="k">마지막 응답</span><span class="v">${UI.esc(UI.ago(d.lastSeenAt) || "아직 없음")}</span></div>
    ${d.version ? `<div class="kv" style="padding-left:0;padding-right:0"><span class="k">버전</span><span class="v">${UI.esc(d.version)}</span></div>` : ""}
    <div class="kv" style="padding-left:0;padding-right:0"><span class="k">기다리는 글</span><span class="v">${d.jobsWaiting || 0}건</span></div>
    ${d.status !== "online" ? `<p class="muted" style="margin:12px 0 0;font-size:13.5px">이 PC에서 프로그램을 켜면 기다리던 글이 바로 올라가요.</p>` : ""}
    <div style="padding:16px 0 0"><button class="btn ghost" type="button" id="rm" style="color:var(--danger);width:100%">연결 해제</button><div id="rc"></div></div>`, { title: d.name, onOpen: (sh, close) => {
      sh.querySelector("#rm").onclick = () => UI.confirmRow(sh.querySelector("#rc"), `${d.name} 연결을 해제할까요? 이 PC로는 더 이상 글을 올리지 않아요.`, async () => {
        const r = await UI.api("/api/runner-remove", { body: { id: d.id } }); if (!r.ok) return UI.toast(r.error || "해제하지 못했어요");
        close(); UI.toast("연결을 해제했어요"); load(); });
    } });
}

/* 켜기 3스텝(한 화면 한 질문 · 열쇠는 1회만 보여 준다) */
function addSheet() {
  let step = 1, name = "", token = "";
  const view = (sh, close) => {
    const body = sh.querySelector(".sheet-body");
    const prog = `<div class="prog" style="padding:0 0 8px"><i class="on"></i><i class="${step >= 2 ? "on" : ""}"></i><i class="${step >= 3 ? "on" : ""}"></i></div>`;
    if (step === 1) {
      body.innerHTML = prog + `<div class="step-h" style="padding-top:4px"><h2>이 PC를 뭐라고 부를까요?</h2><p>나중에 어느 PC인지 알아보기 위한 이름이에요.</p></div>
        <div class="field"><input class="input" id="nm" value="${UI.esc(name)}" placeholder="예: 집 PC" maxlength="20" autocomplete="off"><div class="help"></div></div>
        <div class="cta"><button class="btn primary" type="button" id="nx">다음</button></div>`;
      body.querySelector("#nx").onclick = async () => {
        name = body.querySelector("#nm").value.trim();
        if (!name) { body.querySelector(".help").textContent = "이름을 적어 주세요."; return; }
        const btn = body.querySelector("#nx"); btn.disabled = true;
        const r = await UI.api("/api/runner-register", { body: { name, kind: "own" } }); btn.disabled = false;
        if (!r.ok) {
          if (r.step === "limit") { close(); return UI.sheet(`<p class="muted" style="margin:0 0 16px">${UI.esc(r.error)}</p><div class="cta"><a class="btn primary" href="/app/plans.html">요금제 보기</a></div>`, { title: "이 요금제에서는 여기까지예요" }); }
          body.querySelector(".help").textContent = r.error || "등록하지 못했어요"; return;
        }
        token = r.device.token; DL.url = (r.install || {}).url || ""; DL.cmd = (r.install || {}).cmd || ""; step = 2; view(sh, close);
      };
      setTimeout(() => { const el = body.querySelector("#nm"); if (el) el.focus(); }, 60);
    } else if (step === 2) {
      body.innerHTML = prog + `<div class="step-h" style="padding-top:4px"><h2>열쇠를 복사해 두세요</h2><p>이 열쇠로 내 PC와 연결해요.</p></div>
        <code class="code" id="tk">${UI.esc(token)}</code>
        <div class="banner" style="margin:12px 0 0"><span>이 화면을 닫으면 다시 볼 수 없어요</span></div>
        <div class="cta" style="flex-direction:column"><button class="btn primary" type="button" id="cp">열쇠 복사하기</button><button class="btn ghost" type="button" id="nx">복사했어요 · 다음</button></div>`;
      body.querySelector("#cp").onclick = async () => UI.toast((await UI.copy(token)) ? "복사했어요" : "복사하지 못했어요 · 길게 눌러 복사해 주세요");
      body.querySelector("#nx").onclick = () => { step = 3; view(sh, close); };
    } else {
      body.innerHTML = prog + `<div class="step-h" style="padding-top:4px"><h2>세 가지만 하면 끝나요</h2><p>PC에서 한 번만 하면 돼요.</p></div>
        <div class="steps" style="padding:8px 0 4px"><div class="st on"><i>1</i>프로그램 내려받기</div></div>
        <div style="padding:0 0 12px">${DL.url ? `<a class="btn secondary sm" href="${UI.esc(DL.url)}" target="_blank" rel="noopener" style="width:100%">프로그램 내려받기</a>` : `<p class="muted" style="margin:0;font-size:13.5px">받는 곳 주소는 준비되면 여기에 나와요.</p>`}</div>
        <div class="steps" style="padding:4px 0"><div class="st on"><i>2</i>열쇠 붙여넣기</div></div>
        <div style="padding:0 0 8px">${DL.cmd ? `<code class="code">${UI.esc(DL.cmd)}</code><button class="btn ghost" type="button" id="cp2" style="width:100%">이 줄 복사하기</button>` : ""}</div>
        <div class="steps" style="padding:4px 0"><div class="st on"><i>3</i>켜 둔 채로 두기</div></div>
        <p class="muted" style="margin:0 0 4px;font-size:13.5px">창을 닫지 말고 켜 두면, 예약한 시각에 알아서 올라가요.</p>
        <div class="cta"><button class="btn primary" type="button" id="fin">다 했어요</button></div>`;
      const cp2 = body.querySelector("#cp2"); if (cp2) cp2.onclick = async () => UI.toast((await UI.copy(DL.cmd)) ? "복사했어요" : "복사하지 못했어요");
      body.querySelector("#fin").onclick = () => { close(); UI.done(`${name} 을(를) 연결했어요`, load); };
    }
  };
  UI.sheet(`<div class="sheet-body"></div>`, { title: "", onOpen: (sh, close) => view(sh, close) });
}
UI.$("#add").onclick = addSheet;
await load();
})();
</script>
</body>
</html>
