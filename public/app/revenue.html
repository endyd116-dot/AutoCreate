<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수익 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=3">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><span class="ttl">수익</span><span class="sp"></span></div>
<div class="hl"><div class="say" id="say">이번 달</div><div class="num" id="num">0원 벌었어요</div><div class="tip" id="tip">수익 매체를 연결하면 매일 자동으로 모아요</div></div>
<div class="group"><div class="gt">어디서</div><div class="empty"><span class="mk money">₩</span><h3>아직 연결된 수익 매체가 없어요</h3><p>애드센스·쿠팡 파트너스·유튜브는 연결하면 자동으로, 애드포스트는 러너가 가져와요.</p><a class="btn primary sm" href="/app/accounts.html">수익 매체 연결</a></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=3"></script>
<script src="/js/mock.js?v=2"></script>
<script>
(async () => {
await UI.boot("revenue");
const r = await UI.api("/api/home-summary"); if (r.ok) { UI.$("#say").textContent = `${new Date().getMonth() + 1}월에`; UI.$("#num").innerHTML = `<em>${UI.won(r.revenue.month)}</em> 벌었어요`; }
})();
</script>
</body>
</html>
