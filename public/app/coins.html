<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코인 · AutoCreate</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/css/ac.css?v=15">
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="메뉴"></nav>
  <main class="page" id="page">
    <div class="appbar"><a class="ic" href="javascript:history.length>1?history.back():location.assign('/app/account.html')" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><span class="sp"></span></div>
<div class="hl"><div class="say">지금</div><div class="num"><em id="bal">0</em>코인 있어요</div><div class="tip" id="split">…</div></div>
<div class="group" id="packs"><div class="gt">충전하기 <span class="muted" style="font-weight:500">1코인 = 500원 · 부가세 별도</span></div></div>
<div class="group" id="slotg" hidden><div class="gt">계정 더 쓰기 <span class="muted" style="font-weight:500">계정 1개 + 전용 IP · 30일마다</span></div><div id="slots"></div></div>
<div class="group" id="tg"><button type="button" class="row tap" id="transfer"><span class="mk soft"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg></span><div class="l"><span class="t">다른 서비스 코인 가져오기</span><span class="d">함께 쓰는 서비스에 남은 코인을 여기로 옮겨요</span></div><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3l5 5-5 5"/></svg></button></div>
<div class="group" id="hist"><div class="gt">코인 내역 <span class="muted" style="font-weight:500">KST</span></div><div class="seg" id="mseg" style="margin:8px 16px 4px"><button type="button" data-m="this" class="on">이번 달</button><button type="button" data-m="prev">지난 달</button><button type="button" data-m="all">전체</button></div><div id="rows"></div></div>
<div class="group"><div class="gt">코인으로 만드는 것</div><div id="table"></div></div>
  </main>
</div>
<nav class="tabs" aria-label="탭"></nav>
<script src="/js/ui.js?v=11"></script>
<script src="/js/mock.js?v=11"></script>
<script>
(async () => {
const me = await UI.boot("account"); if (!me) return;
const won = UI.won; let PACKS = [], ROWS = [], T = null, mode = "this", KEYIN = null;
/* [§1.6] 결제 라인 선택 — available 일 때만 체크박스 1개(라벨·안내문은 서버 문구) · 켜면 body 에 payRoute:"keyin" · 조건이 안 맞으면 서버가 조용히 기존 방식으로 결제한다(실패 아님) */
const keyinRow = (K) => K && K.available ? `<label class="chk" id="keyinRow" style="margin-top:4px"><input type="checkbox" id="keyin"> <span>${UI.esc(K.label || "카드번호 직접 입력")}</span></label>${K.notice ? `<p class="muted" style="margin:0 0 4px 34px;font-size:12.5px">${UI.esc(K.notice)}</p>` : ""}` : "";
const keyinBody = (sh, body) => { const el = sh.querySelector("#keyin"); if (el && el.checked) body.payRoute = "keyin"; return body; };
if (me.impersonation) UI.$("#packs").innerHTML = `<div class="empty" style="padding:20px 16px"><h3 style="font-size:15px">원격접속 중엔 충전할 수 없어요</h3><p>끝난 뒤 본인이 직접 해 주세요.</p></div>`;
/* KICC 인증창 콜백 복귀(coin-charge-return): ?charged={주문번호} | ?failed={사유} */
const charged = UI.qs.get("charged"), failed = UI.qs.get("failed");
if (failed) setTimeout(() => UI.payFailSheet({ reason: UI.qs.get("reason"), msg: failed, what: "coin" }), 300); // reason 이 없으면(승인 실패 사유가 failed 에 온다) 그 문장만
const ymKST = (d) => new Date(d.getTime() + 9 * 3600e3).toISOString().slice(0, 7);
const monthOf = () => { const d = new Date(); if (mode === "this") return ymKST(d); if (mode === "prev") { d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() - 1); return ymKST(d); } return null; };
async function load() {
  const m = monthOf();
  const [p, k, h] = await Promise.all([UI.api("/api/plans"), UI.api("/api/coin-packs"), UI.api("/api/coin-history" + (m ? `?month=${m}` : ""))]);
  T = p.ok ? p.coins : null; PACKS = k.ok ? k.packs || [] : []; ROWS = h.ok ? h.rows || [] : []; KEYIN = (k.ok && k.keyin) || null; // [§1.6] 카드번호 직접 입력 노출 여부 — 서버만 안다(available 일 때만 그린다)
  const B = h.ok && h.balance ? h.balance : { total: me.coins, included: 0, purchased: 0 };
  UI.countUp(UI.$("#bal"), B.total, UI.num);
  UI.$("#split").textContent = `플랜 포함 ${UI.num(B.included)} · 충전 ${UI.num(B.purchased)} · 포함분은 그달 말까지, 충전분은 1년`;
  if (charged && !load.said) { load.said = true; const row = ROWS.find((r) => r.kind === "purchase" && r.ref === charged); UI.done(row ? `${UI.num(row.amount)}코인 충전했어요` : "충전했어요"); }
  if (!me.impersonation) {
    const show = PACKS.filter((x) => x.available !== false); // 첫 충전 팩은 썼으면 서버가 available:false — 숨긴다
    UI.$("#packs").innerHTML = `<div class="gt">충전하기 <span class="muted" style="font-weight:500">1코인 = 500원 · 부가세 별도</span></div>` + (show.length ? show.map((x) => `<button type="button" class="row tap" data-pack="${UI.esc(x.id)}"><span class="mk money">C</span><div class="l"><span class="t">${UI.num(x.coins)}코인${x.bonusPct ? ` <span class="pill ok">+${x.bonusPct}%</span>` : ""}${x.oncePerTenant ? ' <span class="pill off">첫 충전 1회</span>' : ""}</span><span class="d">${won(x.krw)} + 부가세 ${won(x.vatKrw)}</span></div><span class="r" style="font-variant-numeric:tabular-nums">${won(x.totalKrw)}</span>${UI.chev}</button>`).join("") : `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">지금은 살 수 있는 팩이 없어요</span></div></div>`);
    UI.$$("[data-pack]").forEach((el) => el.onclick = () => buy(PACKS.find((x) => x.id === el.dataset.pack)));
  }
  if (!me.impersonation) { const tr = UI.$("#transfer"); if (tr) tr.onclick = transferSheet; }
  loadSlots();
  const KIND = { purchase: "충전", consume: "사용", grant: "지급", revoke: "환불 회수", expire: "만료" };
  UI.$("#rows").innerHTML = ROWS.length ? ROWS.map((r) => { const plus = r.amount > 0; const what = r.kind === "consume" ? (T && T.labels[r.item]) || "사용" : KIND[r.kind] || r.kind;
    return `<div class="row"><div class="l"><span class="t">${UI.esc(what)}${r.bucket === "included" ? ' <span class="muted" style="font-weight:500;font-size:12px">포함분</span>' : ""}</span><span class="d">${r.kind === "grant" || r.kind === "revoke" ? UI.esc(r.reason || "") + " · " : ""}${r.at ? `${UI.dateKST(r.at)} ${UI.timeKST(r.at)}` : ""}${r.expiresAt && plus ? ` · ${UI.dateKST(r.expiresAt, { year: "numeric" })}까지` : ""}</span></div><span class="r" style="font-variant-numeric:tabular-nums">${plus ? "+" : "−"}${UI.num(Math.abs(r.amount))}</span>${r.kind === "purchase" && r.ref && !me.impersonation ? `<button type="button" class="btn ghost sm" data-refund="${UI.esc(r.ref)}" style="padding:0 8px">환불</button>` : ""}</div>`; }).join("")
    : `<div class="row"><div class="l"><span class="t muted" style="font-weight:500">${mode === "all" ? "아직 내역이 없어요" : "이 달엔 내역이 없어요"}</span></div></div>`;
  UI.$$("[data-refund]").forEach((el) => el.onclick = () => refund(el.dataset.refund));
  if (T) { const show = ["blog", "image", "cardnews", "video_15", "video_30", "video_60", "persona"]; UI.$("#table").innerHTML = show.map((k) => `<div class="kv"><span class="k">${UI.esc(T.labels[k])}</span><span class="v">${T.table[k]}코인</span></div>`).join(""); }
}
/* 충전 시트 — 공급가·부가세·청구는 coin-packs 의 서버 값(화면에서 ×1.1 안 함) · 유료 약관은 첫 결제 1회(충전한 적 없으면 먼저 묻고 · 서버 400 paid_terms 면 다시 편다) */
function buy(x) {
  const firstPay = !ROWS.some((r) => r.kind === "purchase");
  UI.sheet(`<div class="confirm" style="padding-top:0"><div class="q">${UI.num(x.coins)}코인</div><div class="big">${won(x.totalKrw)} 결제할게요</div></div>
    <div class="kv" style="padding-left:0;padding-right:0"><span class="k">공급가</span><span class="v">${won(x.krw)}</span></div>
    <div class="kv" style="padding-left:0;padding-right:0"><span class="k">부가세 10%</span><span class="v">${won(x.vatKrw)}</span></div>
    <div class="kv" style="padding-left:0;padding-right:0"><span class="k">카드 청구</span><span class="v" style="font-weight:800">${won(x.totalKrw)}</span></div>
    <p class="muted" style="margin:8px 0 0;font-size:13px">충전한 코인은 1년 동안 써요 · 안 쓴 코인은 7일 안에 환불돼요.</p>
    ${keyinRow(KEYIN)}
    <label class="chk" id="agreeRow" ${firstPay ? "" : "hidden"}><input type="checkbox" id="agree"> <span><a href="/paid-terms.html" target="_blank" rel="noopener" style="text-decoration:underline">유료서비스 약관</a>(청약철회 7일 · 환불 기준)에 동의해요</span></label>
    <div class="cta"><button class="btn primary" type="button" id="go">충전하기</button></div>`,
    { title: "", onOpen: (sh, close) => {
      const row = sh.querySelector("#agreeRow"); const go = sh.querySelector("#go");
      const need = () => { row.hidden = false; row.style.outline = "2px solid var(--danger)"; row.style.borderRadius = "10px"; UI.toast("유료 약관에 동의해 주세요"); };
      go.onclick = async () => {
        const body = keyinBody(sh, { packId: x.id }); if (!row.hidden) { if (!sh.querySelector("#agree").checked) return need(); body.agreePaidTerms = true; }
        go.disabled = true; const r = await UI.api("/api/coin-purchase-start", { body }); go.disabled = false;
        if (!r.ok) { if (r.step === "paid_terms") return need(); if (r.step === "not_configured") { close(); return soon(); } if (r.step === "once") { close(); UI.toast(r.error || "첫 충전 팩은 한 번만 살 수 있어요"); return load(); } return UI.toast(r.error || "충전을 시작하지 못했어요"); }
        if (r.mode === "oneclick") { close(); return UI.done(`${UI.num(r.coins)}코인 충전했어요 · 잔액 ${UI.num(r.balance)}`, load); }   // 등록 카드로 즉시(응답이 곧 결과)
        if (r.pay && r.pay.url) return UI.postForm(r.pay.url, r.pay.form);                                                     // 인증창 → coin-charge-return → ?charged=
        close(); UI.toast("결제창을 열지 못했어요 · 잠시 뒤 다시 해 주세요");
      };
    } });
}
/* 환불 = 견적(quoteOnly) → 확인 → 실행. 판정·금액은 전부 서버(5규칙) · 화면은 이유를 사람말로만 */
const WHY = { not_coin_order: "충전 주문이 아니에요", not_paid: "결제가 끝난 주문이 아니에요", already_refunded: "이미 환불된 주문이에요", window: "충전 후 7일이 지나 환불할 수 없어요", used: "코인을 모두 써서 돌려드릴 게 없어요", no_lot: "충전 기록을 찾지 못했어요 · 문의해 주세요" };
async function refund(orderNo) {
  const q = await UI.api("/api/coin-refund-request", { body: { orderNo, quoteOnly: true } });
  if (!q.ok) return UI.toast(q.error || "환불 조건을 확인하지 못했어요");
  const Q = q.quote || {}; if (!Q.eligible) return UI.toast(WHY[Q.reason] || "지금은 환불할 수 없어요");
  UI.sheet(`<div class="confirm" style="padding-top:0"><div class="q">${Q.usedCoins ? `안 쓴 ${UI.num(Q.unusedCoins)}코인만` : "전액"}</div><div class="big">${won(Q.maxRefundKrw)} 돌려드려요</div></div>
    <p class="muted" style="margin:0 0 8px;font-size:13px">${Q.usedCoins ? `받은 ${UI.num(Q.packCoins)}코인 중 ${UI.num(Q.usedCoins)}코인을 써서 남은 만큼만 돌려드려요(단가는 그 주문의 결제액 ÷ 받은 코인).` : "아직 한 개도 안 써서 전액이에요."}${Q.refundDeadlineAt ? ` ${UI.dateKST(Q.refundDeadlineAt)}까지만 돼요.` : ""} 카드사 사정에 따라 3~5일 걸릴 수 있어요.</p><div id="rc"></div>`,
    { title: "환불 요청", onOpen: (sh, close) => UI.confirmRow(sh.querySelector("#rc"), `이 충전을 환불할까요? ${UI.num(Q.unusedCoins)}코인이 회수돼요.`, async () => {
      const r = await UI.api("/api/coin-refund-request", { body: { orderNo, reason: "고객 요청" } });
      if (!r.ok) { if (r.step === "not_configured") { close(); return soon(); } return UI.toast((r.reason && WHY[r.reason]) || r.error || "환불하지 못했어요"); }
      close(); UI.done(`${won(r.refundKrw)} 환불 · ${UI.num(r.revoked)}코인 회수`, load); }) });
}
function soon() { UI.sheet(`<p style="margin:0 0 4px;font-size:16px;font-weight:700">결제 준비 중이에요</p><p class="muted" style="margin:0 0 16px">곧 열려요. 열리면 홈 «해야 할 일»에 알려드릴게요.</p><div class="cta"><button class="btn secondary" type="button" id="ok">알겠어요</button></div>`, { title: "", onOpen: (sh, close) => { sh.querySelector("#ok").onclick = close; } }); }
/* [P1R6] 코인 가져오기 — 저쪽에서 차감되고 여기로 들어온다(부분 성공 없음) · 다리가 아직이면 «준비 중» */
function transferSheet() {
  UI.sheet(`<p class="muted" style="margin:0 0 8px">함께 쓰는 서비스(AutoMarketing)에 남은 코인을 여기로 옮겨요. 옮긴 코인은 <b style="color:var(--ink)">여기서 1년</b> 동안 쓸 수 있어요.</p>
    <div class="fr"><div class="fl">몇 코인<small>저쪽에서 그만큼 줄어요</small></div>${UI.stepper("tc", 20, 10, 200, "코인", 10)}</div>
    <p class="muted" style="margin:10px 0 0;font-size:13px">옮기는 중에 문제가 생기면 아무것도 옮기지 않아요(반만 옮겨지는 일은 없어요).</p>
    <div class="cta"><button class="btn primary" type="button" id="go">가져오기</button></div>`, { title: "코인 가져오기", onOpen: (sh, close) => { UI.bindSteppers(sh);
      sh.querySelector("#go").onclick = async () => { const r = await UI.api("/api/coin-transfer", { body: { coins: UI.stepVal(sh, "tc") } });
        if (!r.ok) { if (r.step === "not_configured") { close(); return soonTransfer(); } return r.gated ? close() : UI.toast(r.error || "가져오지 못했어요"); }
        close(); UI.done(`${UI.num(r.coins)}코인 가져왔어요 · 잔액 ${UI.num(r.balance)}`, load); };
    } });
}
function soonTransfer() { UI.sheet(`<p style="margin:0 0 4px;font-size:16px;font-weight:700">아직 준비 중이에요</p><p class="muted" style="margin:0 0 16px">두 서비스를 잇는 일이 끝나면 바로 열려요. 열리면 알려드릴게요.</p><div class="cta"><button class="btn secondary" type="button" id="ok">알겠어요</button></div>`, { title: "", onOpen: (sh, close) => { sh.querySelector("#ok").onclick = close; } }); }
UI.$$("#mseg button").forEach((b) => b.onclick = () => { mode = b.dataset.m; UI.$$("#mseg button").forEach((x) => x.classList.toggle("on", x === b)); load(); });
/* [R7 §3.6] 계정 슬롯 — 여기서 사고, 여기서 상태를 본다(값·문구는 서버 offers·note) */
async function loadSlots() {
  const r = await UI.api("/api/account-slots", { noGate: true }); const g = UI.$("#slotg"); if (!r.ok) { g.hidden = true; return; }
  g.hidden = false;
  const mine = (r.slots || []).map((s) => { const st = UI.SLOT_STATE[s.status] || ["off", s.status, ""];
    const when = s.status === "active" && s.daysLeft != null ? `${s.daysLeft}일 남음 · ${s.autoRenew ? "자동 갱신 켜짐" : "다음 갱신 꺼짐"}` : st[2];
    return `<button type="button" class="row tap" data-slot="${s.id}"><span class="mk ${s.status === "active" ? "money" : "soft"}">${s.managed ? "관" : "IP"}</span><div class="l"><span class="t">${UI.esc(s.label)}</span><span class="d wrap">${UI.esc(when)}</span></div><span class="pill ${st[0]}">${st[1]}</span></button>`; }).join("");
  UI.$("#slots").innerHTML = `<div class="row" style="min-height:44px"><div class="l"><span class="t" style="font-size:14px">계정 ${UI.num(r.usedAccounts)}개 쓰는 중</span><span class="d">요금제 포함 ${UI.num(r.includedAccounts)}개${r.extraSlots ? ` · 더 산 계정 ${UI.num(r.extraSlots)}개` : ""}</span></div></div>`
    + mine + `<div style="padding:8px 16px 10px"><button class="btn secondary sm" type="button" id="slotBuy" style="width:100%">계정 1개 더 쓰기</button></div>`;
  UI.$("#slotBuy").onclick = () => UI.slotBuySheet({ offers: r.offers, note: r.note, balance: r.balance, onDone: load });
  UI.$$("[data-slot]").forEach((b) => b.onclick = () => slotSheet((r.slots || []).find((s) => s.id === Number(b.dataset.slot)), r.note));
}
function slotSheet(s, note) {
  if (!s) return;
  const st = UI.SLOT_STATE[s.status] || ["off", s.status, ""];
  UI.sheet(`<div class="kv" style="padding-left:0;padding-right:0"><span class="k">상태</span><span class="v"><span class="pill ${st[0]}">${st[1]}</span></span></div>
    ${st[2] ? `<p class="muted" style="margin:6px 0 10px;font-size:13.5px">${UI.esc(st[2])}</p>` : ""}
    <div class="kv" style="padding-left:0;padding-right:0"><span class="k">요금</span><span class="v">${UI.num(s.coins)}코인 / 30일<small class="muted" style="font-weight:500"> · ${UI.won(s.krw)}</small></span></div>
    ${s.expiresAt ? `<div class="kv" style="padding-left:0;padding-right:0"><span class="k">다음 갱신</span><span class="v">${UI.dateKST(s.expiresAt)}${s.daysLeft != null ? ` · ${s.daysLeft}일 남음` : ""}</span></div>` : ""}
    ${s.periodsCharged ? `<div class="kv" style="padding-left:0;padding-right:0"><span class="k">지금까지</span><span class="v">${UI.num(s.periodsCharged)}번 빠졌어요</span></div>` : ""}
    <div class="fr" style="padding-top:8px"><div class="fl">자동 갱신<small>끄면 남은 기간까지만 쓰고 멈춰요</small></div><button class="toggle" type="button" id="ar" aria-checked="${s.autoRenew ? "true" : "false"}" aria-label="자동 갱신"></button></div>
    <p class="muted" style="margin:8px 0 0;font-size:12.5px">${UI.esc(note || "남은 기간 환불은 없어요. 다음 갱신만 끌 수 있어요.")}</p>`,
    { title: s.label, onOpen: (sh) => {
      UI.toggle(sh.querySelector("#ar"), async (on) => {
        const r = await UI.api("/api/account-slot-renew", { body: { id: s.id, autoRenew: on } });
        if (!r.ok) { UI.toast(r.error || "바꾸지 못했어요"); return false; }
        UI.toast(on ? "자동 갱신을 켰어요" : "다음 갱신부터 안 빠져요 · 남은 기간은 그대로 써요"); loadSlots();
      });
    } });
}
await load();
})();
</script>
</body>
