[build]
  publish = "public"
  functions = "netlify/functions"

# AM 관례(2026-07-24 실측) — 후처리 스킵·devDep 미설치·docs 시크릿 스캔 제외.
[build.processing]
  skip_processing = true

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_PATHS = "docs/**"
  NPM_FLAGS = "--omit=dev --no-audit --no-fund --prefer-offline --progress=false"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["postgres", "drizzle-orm", "jsonwebtoken", "bcryptjs", "@aws-sdk/client-s3", "resend"]

# ══ 크론 우산 2개(계약 P1R2 §1 · DESIGN §5B.7) ══
#   스텝은 `lib/cron/runner.ts STEPS` 에만 적힌다 — 여기에는 **함수의 주기**만(AM 관례: 스텝 추가 ≠ 함수 추가).
#   수동 강제 실행은 `POST /api/cron-run?every=5m|hourly&secret=$CRON_SECRET`(계약 v2.10 · scheduled 함수는 HTTP 불가 · PITFALLS AC-12①).
[functions."cron-tick-5m"]
  schedule = "*/5 * * * *"

[functions."cron-tick-hourly"]
  schedule = "0 * * * *"

# SPA 아님 — 정적 HTML 직접 서빙. /app/* 는 파일 그대로.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
